<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Estadísticas 5 · Odómetro</title>
<link rel="stylesheet" href="base.css">
<style>
/* La sección queda fija mientras se scrollea: cada tramo de scroll cambia de número
   y los dígitos giran como un odómetro. Abajo, una lectura que sale de cruzar los datos. */
/* overflow-x:clip en vez de hidden: con hidden el body se vuelve contenedor de scroll y sticky no se pega */
body{overflow-x:clip}
.od{position:relative;height:calc(var(--n) * 70 * var(--sv) + 100 * var(--sv));background:var(--acc)}
.st{position:sticky;top:0;height:calc(100 * var(--sv));min-height:600px;overflow:hidden;color:#fff;display:grid;grid-template-columns:1fr minmax(340px,38%);align-items:center;padding:0 60px}
.st:before{content:"";position:absolute;inset:0;background:radial-gradient(70% 90% at 78% 60%,#2a4290 0%,transparent 70%),repeating-linear-gradient(90deg,#ffffff07 0 1px,transparent 1px 120px)}
.pic{position:absolute;right:4%;bottom:0;height:92%;width:auto;z-index:1;filter:drop-shadow(0 30px 50px #0006);-webkit-mask:linear-gradient(180deg,#000 80%,transparent);mask:linear-gradient(180deg,#000 80%,transparent)}
.ghost{position:absolute;right:-2%;top:50%;transform:translateY(-52%);z-index:0;font-size:min(62vh,46vw);font-weight:700;line-height:.8;color:transparent;-webkit-text-stroke:2px #ffffff14;pointer-events:none}
.txt{position:relative;z-index:2}
.k{font-size:11px;font-weight:700;letter-spacing:.28em;text-transform:uppercase;color:#ffffffaa;display:flex;gap:14px;align-items:center}
.k b{color:var(--acc2)}
.lab{margin-top:18px;font-size:clamp(18px,1.8vw,26px);font-weight:500;letter-spacing:.14em;text-transform:uppercase;height:1.2em;overflow:hidden}
.lab span{display:block;transition:transform .6s var(--ease)}
/* Odómetro: una columna 0-9 por dígito */
.num{display:flex;align-items:flex-start;font-size:min(clamp(150px,19vw,300px),calc(52vw / (var(--c,2) * .66)));font-weight:700;line-height:1;height:1em;letter-spacing:-.04em;margin:6px 0 0 -.04em}
.num .d{height:1em;overflow:hidden}
.num .d i{display:flex;flex-direction:column;font-style:normal;transition:transform 1.1s var(--ease)}
.num .d i span{height:1em;text-align:center}
.num .p{opacity:.9;margin:0 -.08em}
.num.hl{color:var(--acc2)}
.cap{margin-top:20px;max-width:30ch;font-size:clamp(16px,1.4vw,20px);line-height:1.4;font-weight:300;color:#ffffffd0;min-height:2.8em;transition:opacity .4s}
.cap b{font-weight:700;color:#fff}
/* Riel con las 6 cifras y el avance */
.rail{position:absolute;left:60px;right:60px;bottom:34px;z-index:3;display:grid;grid-template-columns:repeat(var(--n),1fr);gap:10px}
.rail button{text-align:left;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:#ffffff88;padding-top:12px;position:relative}
.rail button:before,.rail button:after{content:"";position:absolute;top:0;left:0;height:3px;right:0;background:#ffffff26}
.rail button:after{background:#fff;transform-origin:left;transform:scaleX(var(--f,0))}
.rail button[aria-current=true]{color:#fff}
.rail button[aria-current=true]:after{background:var(--acc2)}
.rail b{display:block;font-size:20px;letter-spacing:0;color:#fff;margin-bottom:2px}
.hint{position:absolute;top:30px;right:60px;z-index:3;font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:#ffffff88}
.top{padding-bottom:40px}
/* Radar chico con los 6 atributos: acompaña al número, entre el texto y el recorte */
.rd{position:absolute;z-index:2;left:calc(60px + 31vw);top:7%;width:clamp(220px,19vw,280px);color:#fff}
.rd svg{width:100%;height:auto;overflow:visible}
.rd .poly{transform-origin:center;transform-box:view-box;animation:rdin 1.2s var(--ease) .3s both}
@keyframes rdin{from{transform:scale(0);opacity:0}}
.rd text{font-family:Nippo,system-ui,sans-serif;font-size:7.2px;letter-spacing:.12em;text-transform:uppercase;fill:#ffffffb0}
.rd text.v{font-size:8px;font-weight:700;fill:#fff;letter-spacing:0}
.rd .md{font-size:22px;font-weight:700;fill:#fff;letter-spacing:0}
.rd .ml{font-size:5.6px;fill:#ffffffaa}
.rd .cap2{display:none;margin-top:4px;text-align:center;font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:#ffffff88}
@media (max-width:820px){
  .rd{left:6px;top:auto;bottom:150px;width:156px}.rd text:not(.md):not(.ml){display:none}.rd .cap2{font-size:8px;letter-spacing:.18em}
  .st{grid-template-columns:1fr;align-items:start;padding:96px 20px 0}
  .pic{right:-16%;bottom:150px;height:44%;opacity:.95}
  .ghost{display:none}
  .num{font-size:min(clamp(120px,40vw,200px),calc((100vw - 40px) / (var(--c,2) * .66)))}
  .rail{left:20px;right:20px;bottom:22px;grid-template-columns:repeat(3,1fr);row-gap:16px}
  .rail b{font-size:17px}
  .hint{display:none}
  .cap{max-width:20ch}
}
</style></head><body>
<section class="sec top" id="estadisticas"><div class="sh"><div class="k">Temporada {{seasonLabel}} · {{club}}</div><h2>Estadísticas</h2></div></section>
<div class="od" id="od">
  <div class="st">
    <span class="ghost" aria-hidden="true">{{number}}</span>
    <img class="pic" src="{{photos.heroFront}}" alt="{{alts.heroFront}}">
    <figure class="rd" id="rd" aria-label="Atributos"></figure>
    <div class="txt" aria-live="polite">
      <div class="k"><span id="idx"></span><b>●</b><span>{{full}}</span></div>
      <div class="lab"><span id="lab"></span></div>
      <div class="num" id="num" aria-hidden="true"></div>
      <span id="sr" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)"></span>
      <p class="cap" id="cap"></p>
    </div>
    <div class="hint">Scrolleá ↓</div>
    <div class="rail" id="rail"></div>
  </div>
</div>
<script src="player.js"></script><script src="kit.js"></script><script src="bind.js"></script><script>
// Orden de las cifras: goles primero, el resto como viene
const S=SEASON_ORDER(['goles','pj','tiros','ocas','min','val']),n=S.length,od=document.getElementById('od')
od.style.setProperty('--n',n)
// Lecturas que salen de cruzar los números (si falta un dato, queda la frase genérica)
const num=k=>parseFloat(String(SEASON_BY(k).v).replace(/[^\d.]/g,''))||0
const M=num('min'),G=num('goles'),PJ=num('pj'),T=num('tiros')
const CAP={goles:G&&M?`Un gol cada <b>${Math.round(M/G)}'</b> en cancha.`:'Goles en la temporada.',
 pj:PJ&&G?`Uno cada <b>${(PJ/G).toFixed(1).replace('.',',')}</b> partidos termina en gol suyo.`:'Partidos jugados.',
 tiros:T&&G?`<b>${Math.round(G/T*100)}%</b> de sus tiros al arco terminan en la red.`:'Remates que fueron al arco.',
 ocas:'Pases y jugadas que dejaron a un compañero <b>frente al gol</b>.',
 min:M&&PJ?`<b>${Math.round(M/PJ)}'</b> de promedio por partido.`:'Minutos en cancha.',
 val:'Valoración media de la temporada, <b>sobre 10</b>.'}
const D='<i>'+[...'0123456789'].map(d=>`<span>${d}</span>`).join('')+'</i>'
const rail=document.getElementById('rail'),numEl=document.getElementById('num')
rail.innerHTML=S.map((s,i)=>`<button type="button"><b>${s.v}</b>${s.l}</button>`).join('')
let cur=-1
function show(i){if(i===cur)return;cur=i;const s=S[i],v=String(s.v)
 idx.textContent=String(i+1).padStart(2,'0')+' / '+String(n).padStart(2,'0')
 const L=document.getElementById('lab');L.style.transform='translateY(100%)';setTimeout(()=>{L.textContent=s.l;L.style.transition='none';L.style.transform='translateY(-100%)';L.offsetWidth;L.style.transition='';L.style.transform=''},180)
 // Se arma una columna por dígito; los signos (coma, punto, ') quedan fijos
 numEl.classList.toggle('hl',!!s.hl);numEl.style.setProperty('--c',v.length)
 numEl.innerHTML=[...v].map(c=>/\d/.test(c)?`<span class="d">${D}</span>`:`<span class="p">${c}</span>`).join('')
 numEl.offsetWidth
 ;[...v].filter(c=>/\d/.test(c)).forEach((c,j)=>{numEl.querySelectorAll('.d i')[j].style.transform=`translateY(-${c}0%)`})
 sr.textContent=s.l+': '+v;cap.innerHTML=CAP[s.k]||''
 ;[...rail.children].forEach((b,j)=>b.setAttribute('aria-current',j===i))}
// El avance del scroll dentro del bloque decide qué cifra se ve
function tick(){const r=od.getBoundingClientRect(),run=od.offsetHeight-innerHeight,p=Math.min(1,Math.max(0,-r.top/run))
 const f=p*n,i=Math.min(n-1,Math.floor(f));[...rail.children].forEach((b,j)=>b.style.setProperty('--f',Math.min(1,Math.max(0,f-j))))
 show(i)}
// Radar: los atributos 0-100 en un polígono, el mejor en rojo y la media al centro
;(function(){const A=ATTRS,N=A.length,R=60,c=100,min=50,pt=(i,v)=>{const a=-Math.PI/2+i*2*Math.PI/N,r=R*Math.max(0,v-min)/(100-min);return[(c+r*Math.cos(a)).toFixed(1),(c+r*Math.sin(a)).toFixed(1)]}
 const best=A.reduce((b,x,i)=>x[1]>A[b][1]?i:b,0);let g=''
 for(const v of [62.5,75,87.5,100])g+=`<polygon points="${A.map((_,i)=>pt(i,v).join(',')).join(' ')}" fill="none" stroke="#ffffff${v===100?'40':'18'}"/>`
 A.forEach((_,i)=>{const [x,y]=pt(i,100);g+=`<line x1="${c}" y1="${c}" x2="${x}" y2="${y}" stroke="#ffffff14"/>`})
 g+=`<polygon class="poly" points="${A.map(([,v],i)=>pt(i,v).join(',')).join(' ')}" fill="#ffffff" fill-opacity=".16" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"/>`
 A.forEach(([l,v],i)=>{const [x,y]=pt(i,v);g+=`<circle cx="${x}" cy="${y}" r="${i===best?3.2:2}" fill="${i===best?'var(--acc2)':'#fff'}"/>`
  const a=-Math.PI/2+i*2*Math.PI/N,lx=c+(R+16)*Math.cos(a),ly=c+(R+16)*Math.sin(a),anc=Math.abs(Math.cos(a))<.2?'middle':Math.cos(a)>0?'start':'end'
  g+=`<text x="${lx.toFixed(1)}" y="${(ly-1).toFixed(1)}" text-anchor="${anc}">${l}</text><text class="v" x="${lx.toFixed(1)}" y="${(ly+8).toFixed(1)}" text-anchor="${anc}"${i===best?' style="fill:var(--acc2)"':''}>${v}</text>`})
 g+=`<text class="md" x="${c}" y="${c+6}" text-anchor="middle">${P.media}</text><text class="ml" x="${c}" y="${c+15}" text-anchor="middle">MEDIA</text>`
 rd.innerHTML=`<svg viewBox="0 0 200 200" role="img" aria-label="${A.map(([l,v])=>l+' '+v).join(', ')}">${g}</svg><figcaption class="cap2">Atributos · media ${P.media}</figcaption>`})()
addEventListener('scroll',()=>requestAnimationFrame(tick),{passive:true});addEventListener('resize',tick);tick()
;[...rail.children].forEach((b,i)=>b.onclick=()=>{const run=od.offsetHeight-innerHeight;scrollTo({top:od.offsetTop+run*(i+.5)/n,behavior:matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth'})})
</script>
</body></html>
