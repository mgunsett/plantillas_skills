<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hero 1 · Split editorial</title>
<link rel="stylesheet" href="base.css">
<style>
.hero{position:relative;height:calc(100 * var(--sv));min-height:620px;overflow:hidden;display:grid;grid-template-columns:1.05fr 1fr;background:var(--bg)}
.txt{position:relative;z-index:5;display:flex;flex-direction:column;justify-content:center;padding:90px 0 40px 60px}
.tag{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.tag img{width:22px;height:22px;object-fit:contain}
h1{font-weight:700;text-transform:uppercase;line-height:.86}
h1 .n1{display:block;font-size:clamp(34px,4.4vw,76px);color:var(--ink);font-weight:500}
h1 .n2{display:block;font-size:clamp(70px,10.4vw,190px);color:var(--acc);margin-left:-.04em;white-space:nowrap}
.bio{max-width:440px;margin-top:22px;color:var(--gray);font-size:15px;line-height:1.6;font-weight:300}
.stats{display:grid;grid-template-columns:repeat(4,auto);justify-content:start;margin-top:30px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.stats div{padding:14px 26px 14px 0;margin-right:26px;border-right:1px solid var(--line)}
.stats div:last-child{border:0;margin:0}
.stats b{display:block;font-size:26px;color:var(--acc);font-weight:700}
.stats div.hl b{color:var(--acc2)}
.stats small{font-size:10px;letter-spacing:.22em;color:var(--gray);text-transform:uppercase}
.ctas{display:flex;gap:14px;margin-top:30px}
.btn{font-weight:700;font-size:12px;letter-spacing:.2em;text-transform:uppercase;padding:15px 26px;border-radius:4px;border:1.5px solid var(--acc);color:var(--acc);text-decoration:none}
.btn.solid{background:var(--acc);color:#fff}
@media (hover:hover) and (pointer:fine){.btn{transition:transform .25s var(--ease)}.btn:hover{transform:translateY(-2px)}}
.vis{position:relative}
.panel{position:absolute;inset:0 0 0 -8%;background:var(--acc);clip-path:polygon(22% 0,100% 0,100% 100%,0 100%);animation:pn 1.2s var(--ease) both;overflow:hidden}
@keyframes pn{from{transform:translateX(30%);opacity:0}}
.panel:before{content:attr(data-n);position:absolute;right:-2%;top:-8%;font-weight:700;font-size:78vh;line-height:1;color:transparent;-webkit-text-stroke:2px #ffffff26}
.panel:after{content:"";position:absolute;left:0;right:0;bottom:0;height:10px;background:var(--acc2)}
.panel .crest{position:absolute;right:40px;bottom:40px;width:64px;opacity:.95}
.player{position:absolute;bottom:0;left:50%;transform:translateX(-50%);height:94%;z-index:3;filter:drop-shadow(-24px 20px 40px #0a122655);animation:pl 1.4s var(--ease) .3s both}
@keyframes pl{from{opacity:0;transform:translate(-40%,0)}}
.badge{position:absolute;z-index:4;left:8%;top:22%;background:var(--acc2);color:#fff;font-weight:700;padding:10px 14px;line-height:1;transform:rotate(-4deg)}
.badge b{display:block;font-size:44px}.badge small{font-size:10px;letter-spacing:.2em}
.nav .links:nth-child(3) a{color:#fff;opacity:.9}.nav .links:nth-child(3) .cta{background:#fff;color:var(--acc)}
.eyebrow .s{display:none}
@media (max-width:820px){
  .nav{color:#fff}.nav .logo{color:#fff}
  .eyebrow .l{display:none}.eyebrow .s{display:inline}
  .hero{grid-template-columns:1fr;grid-template-rows:55% 45%;min-height:720px}
  .vis{grid-row:1}
  .panel{inset:0;clip-path:polygon(0 0,100% 0,100% 84%,0 100%)}
  .panel:before{font-size:52vh;right:-6%}
  .panel:after{display:none}
  .panel .crest{width:38px;left:20px;right:auto;bottom:auto;top:76px}
  .player{height:100%;bottom:-2%}
  .badge{left:20px;top:auto;bottom:18%}.badge b{font-size:30px}
  .txt{grid-row:2;padding:0 20px 28px;justify-content:center}
  .tag{margin-bottom:10px}
  h1 .n1{font-size:8vw}h1 .n2{font-size:19vw}
  .bio{display:none}
  .stats{grid-template-columns:repeat(4,1fr);margin-top:16px}
  .stats div{padding:10px 0;margin:0;text-align:center}
  .stats b{font-size:18px}.stats small{font-size:8px;letter-spacing:.12em}
  .ctas{margin-top:18px}.btn{flex:1;text-align:center;padding:13px 10px;font-size:11px}
}
</style></head><body>
<header class="nav"><div class="links"><a>Estadísticas</a><a>Videos</a></div><div class="logo">{{initials}}<span>_</span></div><div class="links"><a>Galería</a><a>Prensa</a><a class="cta">Contacto</a></div><div class="burger"></div></header>
<section class="hero" id="hero">
  <div class="txt">
    <div class="tag rv" style="animation-delay:.2s"><img src="{{flag}}" alt=""><span class="eyebrow"><span class="l">{{position}} · {{club}} · Selección {{nationality}}</span><span class="s">{{position}} · #{{number}}</span></span></div>
    <h1><span class="n1 rv" style="animation-delay:.3s">{{first}}</span><span class="n2 rv" style="animation-delay:.4s">{{last}}</span></h1>
    <p class="bio rv" style="animation-delay:.5s">{{bio}}</p>
    <div class="stats rv" style="animation-delay:.6s">
      <div><b>{{age}}</b><small>Edad</small></div><div><b>{{height}}</b><small>Altura</small></div><div><b>{{s.pj}}</b><small>Partidos</small></div><div class="hl"><b>{{s.goles}}</b><small>Goles</small></div>
    </div>
    <div class="ctas rv" style="animation-delay:.7s"><a class="btn solid" href="#">Ver jugadas</a><a class="btn" href="#">Contacto</a></div>
  </div>
  <div class="vis">
    <div class="panel" data-n="{{number}}"><img class="crest" src="{{crest}}" alt=""></div>
    <img class="player" src="{{photos.heroBall}}" alt="{{alts.heroBall}}" fetchpriority="high">
    <div class="badge rv" style="animation-delay:.9s"><small>DORSAL</small><b>{{number2}}</b></div>
  </div>
</section>
<script src="player.js"></script><script src="kit.js"></script><script src="bind.js"></script>
</body></html>
