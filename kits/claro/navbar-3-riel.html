<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Navbar 3 · Riel lateral</title>
<link rel="stylesheet" href="base.css">
<style>
body{padding-left:84px}
.rail{position:fixed;top:0;left:0;bottom:0;width:84px;z-index:60;background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:22px 0}
.mk{display:flex;flex-direction:column;align-items:center;gap:6px;text-decoration:none}
.mk b{font-weight:700;font-size:22px;color:var(--acc);letter-spacing:.04em}
.mk span{width:30px;height:30px;border-radius:50%;background:var(--acc2);color:#fff;display:grid;place-items:center;font-weight:700;font-size:14px}
.ix{margin:auto 0;display:flex;flex-direction:column;gap:4px}
.ix a{position:relative;display:flex;align-items:center;gap:10px;width:84px;padding:12px 0 12px 22px;text-decoration:none;color:var(--gray)}
.ix a small{font-size:11px;font-weight:700;letter-spacing:.1em;font-variant-numeric:tabular-nums}
.ix a i{display:block;width:12px;height:2px;background:currentColor;transform-origin:left;transition:transform .45s var(--ease)}
.ix a .t{position:absolute;left:96px;top:50%;white-space:nowrap;padding:8px 12px;border-radius:4px;background:var(--acc);color:#fff;font-size:11px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;opacity:0;transform:translate(-8px,-50%);pointer-events:none;transition:opacity .3s,transform .4s var(--ease)}
.ix a[aria-current]{color:var(--acc)}.ix a[aria-current] i{transform:scaleX(2.2);background:var(--acc2)}
@media (hover:hover) and (pointer:fine){.ix a:hover{color:var(--acc)}.ix a:hover .t{opacity:1;transform:translate(0,-50%)}}
.so{display:flex;flex-direction:column;align-items:center;gap:14px}
.so a{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--acc);border:1px solid var(--line);font-size:18px;text-decoration:none}
.so img{width:22px;height:22px;border-radius:50%;object-fit:cover}
.vt{writing-mode:vertical-rl;transform:rotate(180deg);font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:var(--gray);margin-bottom:18px}
/* Mobile: cabecera mínima arriba y barra de secciones abajo */
.top,.tabs{display:none}
@media (max-width:820px){
  body{padding-left:0;padding-bottom:72px}
  .rail{display:none}
  .demo-hero h1{bottom:110px}
  .top{display:flex;position:fixed;top:0;left:0;right:0;z-index:60;justify-content:space-between;align-items:center;padding:16px 20px;color:#fff;transition:transform .45s var(--ease)}
  .top.hide{transform:translateY(-100%)}
  .top b{font-weight:700;font-size:20px}.top b i{font-style:normal;color:var(--acc2)}
  .top a{font-size:10px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;text-decoration:none;border:1.5px solid currentColor;border-radius:999px;padding:8px 14px}
  .tabs{display:flex;position:fixed;left:10px;right:10px;bottom:10px;z-index:60;background:#ffffffeb;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:18px;padding:6px;box-shadow:0 8px 30px #0a122626;overflow-x:auto;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tabs a{flex:1 0 auto;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 12px;border-radius:12px;text-decoration:none;color:var(--gray);font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
  .tabs a small{font-size:9px;opacity:.6}
  .tabs a[aria-current]{background:var(--acc);color:#fff}
}
</style></head><body>
<nav class="rail" aria-label="Principal">
  <a class="mk" href="#hero" aria-label="Inicio · {{full}}"><b>{{initials}}</b><span>{{number}}</span></a>
  <div class="ix" id="ix"></div>
  <span class="vt">{{club}} · {{year}}</span>
  <div class="so"><a href="{{instagram.u}}" target="_blank" rel="noopener" aria-label="Instagram" id="ig"></a><img src="{{flag}}" alt="{{nationality}}"></div>
</nav>
<header class="top" id="top"><b>{{initials}}<i>_</i></b><a href="#contact">Contacto</a></header>
<nav class="tabs" id="tabs" aria-label="Secciones"></nav>
<main id="demo"></main>
<script src="player.js"></script><script src="kit.js"></script><script src="demo.js"></script><script src="navkit.js"></script>
<script>
document.getElementById('ig').innerHTML=IG
NK.links(document.getElementById('ix'),(l,h,i)=>`<a href="${h}" aria-label="${l}"><small>0${i+1}</small><i></i><span class="t">${l}</span></a>`)
NK.links(document.getElementById('tabs'),(l,h,i)=>`<a href="${h}"><small>0${i+1}</small>${l}</a>`)
const tabs=document.getElementById('tabs'),top_=document.getElementById('top')
NK.spy(h=>{document.querySelectorAll('.ix a,.tabs a').forEach(a=>a.getAttribute('href')===h?a.setAttribute('aria-current','true'):a.removeAttribute('aria-current'))
  const a=tabs.querySelector(`a[href="${h}"]`);if(a&&tabs.offsetParent)tabs.scrollTo({left:a.offsetLeft-tabs.clientWidth/2+a.offsetWidth/2,behavior:'smooth'})})
NK.scroll((y,down)=>top_.classList.toggle('hide',y>120))
document.addEventListener('click',NK.go)
</script>
<script src="bind.js"></script>
</body></html>
