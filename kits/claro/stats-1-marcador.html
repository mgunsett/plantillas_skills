<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Estadísticas 1 · Marcador</title>
<link rel="stylesheet" href="base.css">
<style>
.board{display:grid;grid-template-columns:1.1fr 1fr;gap:2px;background:var(--line);border:1px solid var(--line)}
.main{background:var(--acc);color:#fff;padding:34px 38px;display:flex;flex-direction:column;justify-content:space-between;min-height:340px}
.main small{font-size:12px;font-weight:700;letter-spacing:.24em;text-transform:uppercase}
.main b{font-size:clamp(150px,24vw,340px);line-height:.78;font-weight:700;letter-spacing:-.02em}
.main p{font-size:15px;font-weight:500;max-width:30ch}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:2px}
.t{background:var(--bg2);padding:24px 26px;display:flex;flex-direction:column;justify-content:space-between;gap:18px}
.t small{font-size:10px;font-weight:700;letter-spacing:.24em;color:var(--gray);text-transform:uppercase}
.t b{font-size:clamp(40px,4vw,62px);line-height:.9;font-weight:700}
.t.hl b{color:var(--acc2)}
.t:last-child{grid-column:span 2;flex-direction:row;align-items:flex-end}
.prof{display:grid;grid-template-columns:repeat(6,1fr);margin-top:34px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.prof div{padding:16px 18px;border-left:1px solid var(--line)}
.prof div:first-child{border-left:0;padding-left:0}
.prof small{display:block;font-size:10px;letter-spacing:.22em;color:var(--gray);text-transform:uppercase;margin-bottom:6px}
.prof strong{font-size:16px;font-weight:500}
/* Pie: radar chico con los 6 atributos y las barras al lado */
.foot{display:grid;grid-template-columns:clamp(300px,27vw,390px) 1fr;gap:48px;align-items:center;margin-top:38px}
.rd{position:relative}
.rd svg{width:100%;height:auto;overflow:visible}
.rd .poly{transform-origin:center;transform-box:view-box;transform:scale(0);opacity:0}
.rd.on .poly{animation:rdin 1.2s var(--ease) both}
@keyframes rdin{to{transform:none;opacity:1}}
.rd text{font-family:Nippo,system-ui,sans-serif;font-size:8.4px;letter-spacing:.12em;text-transform:uppercase;fill:var(--gray)}
.rd text.v{font-size:9.5px;font-weight:700;fill:var(--acc);letter-spacing:0}
.rd .md{font-size:22px;font-weight:700;fill:var(--acc);letter-spacing:0}
.rd .ml{font-size:5.6px;fill:var(--gray)}
.attrs{display:grid;grid-template-columns:repeat(2,1fr);gap:22px 48px}
.a .top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.a .top span{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:#3D4A68}
.a .top b{font-size:22px;color:var(--acc)}
.seg{display:grid;grid-template-columns:repeat(10,1fr);gap:3px}
.seg i{height:8px;background:#17285a14;transform-origin:left;animation:sg .6s var(--ease) both}
.seg i.on{background:var(--acc)}
@keyframes sg{from{transform:scaleX(0)}}
@media (max-width:820px){
  .board{grid-template-columns:1fr}
  .main{min-height:0;gap:10px;padding:24px}
  .main b{font-size:44vw}
  .t{padding:18px}.t b{font-size:34px}
  .prof{grid-template-columns:repeat(2,1fr)}
  .prof div{border-left:0;border-top:1px solid var(--line);padding:12px 0}
  .prof div:nth-child(-n+2){border-top:0}
  .foot{grid-template-columns:1fr;gap:28px}.rd{max-width:340px;margin:0 auto;width:100%}
  .attrs{grid-template-columns:1fr;gap:16px}
}
</style></head><body>
<section class="sec" id="estadisticas">
  <div class="sh"><div class="k">Temporada {{seasonLabel}}</div><h2>Estadísticas</h2></div>
  <div class="board">
    <div class="main"><small id="mainL"></small><b class="tab" id="mainV"></b><p>{{statsHook}}</p></div>
    <div class="tiles" id="tiles"></div>
  </div>
  <div class="prof">
    <div><small>Posición</small><strong>{{position}}</strong></div>
    <div><small>Pie hábil</small><strong>{{foot}}</strong></div>
    <div><small>Edad</small><strong>{{age}} años</strong></div>
    <div><small>Altura</small><strong>{{height}} m</strong></div>
    <div><small>Peso</small><strong>{{weight}} kg</strong></div>
    <div><small>Origen</small><strong>{{birthPlaceShort}}</strong></div>
  </div>
  <div class="foot"><figure class="rd" id="rd"></figure><div class="attrs" id="attrs"></div></div>
</section>
<script src="player.js"></script><script src="kit.js"></script><script src="bind.js"></script><script>
const A=ATTRS,[M,...R]=SEASON_ORDER(['goles','pj','tiros','ocas','min','val'])
mainL.textContent=M.ll||M.l;mainV.textContent=M.v
tiles.innerHTML=R.map(s=>`<div class="t${s.hl?' hl':''}"><small>${s.ll||s.l}</small><b class="tab">${s.v}</b></div>`).join('')
document.getElementById('attrs').innerHTML=A.map(([l,v],k)=>`<div class="a"><div class="top"><span>${l}</span><b class="tab">${v}</b></div><div class="seg" role="img" aria-label="${l}: ${v} de 100">${Array.from({length:10},(_,i)=>`<i class="${i<Math.round(v/10)?'on':''}" style="animation-delay:${k*.08+i*.03}s"></i>`).join('')}</div></div>`).join('')
// Radar: atributos 0-100 (escala desde 50), el mejor en rojo y la media al centro
;(function(){const N=A.length,R=60,c=100,min=50,pt=(i,v)=>{const a=-Math.PI/2+i*2*Math.PI/N,r=R*Math.max(0,v-min)/(100-min);return[(c+r*Math.cos(a)).toFixed(1),(c+r*Math.sin(a)).toFixed(1)]}
 const best=A.reduce((b,x,i)=>x[1]>A[b][1]?i:b,0);let g=''
 for(const v of [62.5,75,87.5,100])g+=`<polygon points="${A.map((_,i)=>pt(i,v).join(',')).join(' ')}" fill="none" stroke="#17285a${v===100?'55':'1f'}"/>`
 A.forEach((_,i)=>{const [x,y]=pt(i,100);g+=`<line x1="${c}" y1="${c}" x2="${x}" y2="${y}" stroke="#17285a1a"/>`})
 g+=`<polygon class="poly" points="${A.map(([,v],i)=>pt(i,v).join(',')).join(' ')}" fill="var(--acc)" fill-opacity=".14" stroke="var(--acc)" stroke-width="1.6" stroke-linejoin="round"/>`
 A.forEach(([l,v],i)=>{const [x,y]=pt(i,v);g+=`<circle cx="${x}" cy="${y}" r="${i===best?3.2:2}" fill="${i===best?'var(--acc2)':'var(--acc)'}"/>`
  const a=-Math.PI/2+i*2*Math.PI/N,lx=c+(R+16)*Math.cos(a),ly=c+(R+16)*Math.sin(a),anc=Math.abs(Math.cos(a))<.2?'middle':Math.cos(a)>0?'start':'end'
  g+=`<text x="${lx.toFixed(1)}" y="${(ly-1).toFixed(1)}" text-anchor="${anc}">${l}</text><text class="v" x="${lx.toFixed(1)}" y="${(ly+8).toFixed(1)}" text-anchor="${anc}"${i===best?' style="fill:var(--acc2)"':''}>${v}</text>`})
 g+=`<text class="md" x="${c}" y="${c+6}" text-anchor="middle">${P.media}</text><text class="ml" x="${c}" y="${c+15}" text-anchor="middle">MEDIA</text>`
 rd.innerHTML=`<svg viewBox="-42 0 284 200" role="img" aria-label="Atributos: ${A.map(([l,v])=>l+' '+v).join(', ')}">${g}</svg>`
 new IntersectionObserver((e,o)=>{if(e[0].isIntersecting){rd.classList.add('on');o.disconnect()}},{threshold:.3}).observe(rd)})()
</script>
</body></html>
