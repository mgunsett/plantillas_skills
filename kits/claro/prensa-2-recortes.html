<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prensa 2 · Recortes</title>
<link rel="stylesheet" href="base.css">
<style>
.hd{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:56px}.hd .sh{margin:0}
.ej{font-size:10px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--acc2);border:1px dashed var(--acc2);padding:7px 10px;border-radius:4px}
.board{display:grid;grid-template-columns:repeat(3,1fr);gap:40px;padding:0 10px}
.cl{position:relative;display:block;background:#fff;color:#0D1730;padding:30px 26px 26px;text-decoration:none;transform:rotate(var(--r));box-shadow:0 18px 40px #0a122624;transition:transform .4s var(--ease)}
.cl:before{content:"";position:absolute;top:-12px;left:50%;width:96px;height:26px;margin-left:-48px;background:#E23744cc;transform:rotate(calc(var(--r) * -2))}
.cl .tp{display:flex;align-items:center;gap:12px;padding-bottom:14px;border-bottom:2px solid #0D1730}
.cl img{width:40px;height:40px;border-radius:8px;object-fit:cover}
.cl .tp b{font-size:12px;letter-spacing:.16em;text-transform:uppercase}
.cl .tp span{margin-left:auto;font-size:11px;letter-spacing:.12em;color:#5C6A88;text-transform:uppercase}
.cl h3{margin-top:18px;font-size:clamp(22px,2vw,28px);line-height:1.1;font-weight:700;text-transform:uppercase}
.cl p{margin-top:12px;font-size:14px;line-height:1.5;color:#3D4A68;}
.cl .go{display:inline-block;margin-top:20px;font-size:11px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;border-bottom:2px solid var(--acc2);padding-bottom:3px}
.cl:focus-visible{outline:3px solid var(--acc2);outline-offset:4px}
@media (hover:hover) and (pointer:fine){.cl:hover{transform:rotate(0) translateY(-8px)}}
@media (max-width:820px){.board{grid-template-columns:1fr;gap:34px;padding:0 6px}.cl p{columns:1}}
</style></head><body>
<section class="sec alt" id="press">
  <div class="hd"><div class="sh"><div class="k">En los medios</div><h2>Prensa</h2></div></div>
  <div class="board" id="bd"></div>
</section>

<script src="player.js"></script><script src="kit.js"></script><script src="bind.js"></script><script>
const R=['-2deg','1.5deg','-1deg']
bd.innerHTML=PRESS.map((p,i)=>`<a class="cl" href="${p.u}" target="_blank" rel="noopener" style="--r:${R[i%3]}" aria-label="Leer en ${p.medio}: ${p.t}"><div class="tp"><img src="${p.logo}" alt=""><b>${p.medio}</b><span>${p.d}</span></div><h3>${p.t}</h3><p>${p.x}</p><span class="go">Leer la nota ↗</span></a>`).join('')
</script>
</body></html>
