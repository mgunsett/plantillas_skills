<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Navbar 5 · Índice a pantalla completa</title>
<link rel="stylesheet" href="base.css">
<style>
.mini{position:fixed;top:0;left:0;right:0;z-index:80;display:flex;align-items:center;justify-content:space-between;padding:22px 48px;color:#fff;mix-blend-mode:difference}
.mini .mk{font-weight:700;font-size:24px;text-decoration:none;letter-spacing:.04em}
.mini .r{display:flex;align-items:center;gap:26px}
.mini .r a{font-size:11px;font-weight:500;letter-spacing:.2em;text-transform:uppercase;text-decoration:none}
.mb{display:flex;align-items:center;gap:12px;font-size:11px;font-weight:700;letter-spacing:.24em;text-transform:uppercase}
.mb span{position:relative;width:30px;height:12px}
.mb span i{position:absolute;left:0;right:0;height:2px;background:currentColor;transition:transform .5s var(--ease)}
.mb span i:nth-child(1){top:0}.mb span i:nth-child(2){bottom:0;left:10px}
.open .mb span i:nth-child(1){transform:translateY(5px) rotate(45deg)}.open .mb span i:nth-child(2){transform:translate(-10px,-5px) rotate(-45deg);left:10px}
.ov{position:fixed;inset:0;z-index:70;display:grid;grid-template-columns:1.25fr 1fr;background:var(--bg2);visibility:hidden;transition:visibility 0s .7s}
.open .ov{visibility:visible;transition:none}
.ov .sh{position:absolute;inset:0;background:var(--acc);transform:translateY(-100%);transition:transform .7s var(--ease)}
.open .ov .sh{transform:translateY(100%);transition-delay:.05s}
.ix{position:relative;padding:120px 48px 40px;display:flex;flex-direction:column;justify-content:center;background:var(--bg2)}
.ix a.l{display:flex;align-items:baseline;gap:22px;text-decoration:none;color:var(--acc);font-weight:700;text-transform:uppercase;font-size:clamp(40px,5.6vw,92px);line-height:1.02;overflow:hidden}
.ix a.l span{display:inline-block;transform:translateY(105%);transition:transform .8s var(--ease)}
.ix a.l small{font-size:12px;letter-spacing:.16em;color:var(--acc2);font-weight:500;width:28px;flex-shrink:0;opacity:0;transition:opacity .6s}
.open .ix a.l span{transform:none}.open .ix a.l small{opacity:1}
.ix a.l[aria-current] span{color:transparent;-webkit-text-stroke:1.5px var(--acc)}
@media (hover:hover) and (pointer:fine){.ix a.l span{transition:transform .8s var(--ease),color .3s}.ix a.l:hover span{color:var(--acc2)}}
.ix .ct{margin-top:34px;display:flex;flex-wrap:wrap;gap:10px 28px;font-size:12px;letter-spacing:.08em;color:var(--gray)}
.ix .ct a{text-decoration:none;color:var(--acc);font-weight:700}
.ix .ct div small{display:block;font-size:9px;letter-spacing:.24em;text-transform:uppercase;margin-bottom:4px}
.pic{position:relative;overflow:hidden;background:var(--deep)}
.pic img.p{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 20%;transform:scale(1.12);transition:transform 1.4s var(--ease)}
.open .pic img.p{transform:none}
.pic:after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,#0A1226e6 0%,transparent 45%)}
.pic .cap{position:absolute;left:32px;right:32px;bottom:30px;z-index:2;color:#fff;display:flex;align-items:flex-end;justify-content:space-between}
.pic .cap b{display:block;font-size:56px;line-height:.9;font-weight:700;text-transform:uppercase}
.pic .cap small{font-size:11px;letter-spacing:.24em;text-transform:uppercase;opacity:.8}
.pic .cap img{height:64px}
@media (max-width:900px){
  .mini{padding:16px 20px}.mini .r>a{display:none}
  .ov{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  .pic{order:-1;height:30vh;min-height:190px}
  .pic .cap{left:20px;right:20px;bottom:16px}.pic .cap b{font-size:34px}.pic .cap img{height:40px}
  .ix{padding:22px 20px 30px;justify-content:flex-start}
  .ix a.l{font-size:11vw;gap:14px}
  .ix .ct{margin-top:22px}
}
</style></head><body>
<header class="mini">
  <a class="mk" href="#hero" aria-label="Inicio · {{full}}">{{initials}}_{{number}}</a>
  <div class="r"><a href="#contact">Contacto</a><button class="mb" id="mb" aria-expanded="false" aria-controls="ov"><span aria-hidden="true"><i></i><i></i></span><em id="mbl" style="font-style:normal">Menú</em></button></div>
</header>
<div class="ov" id="ov" role="dialog" aria-label="Menú">
  <div class="sh"></div>
  <nav class="ix" aria-label="Principal"><div id="ixl"></div>
    <div class="ct" id="ct"></div>
  </nav>
  <div class="pic"><img class="p" src="{{photos.portrait}}" alt="{{alts.portrait}}" loading="lazy"><div class="cap"><div><small>{{position}} · #{{number}}</small><b>{{first}}<br>{{last}}</b></div><img src="{{crest}}" alt="{{club}}"></div></div>
</div>
<main id="demo"></main>
<script src="player.js"></script><script src="kit.js"></script><script src="demo.js"></script><script src="navkit.js"></script>
<script>
const mb=document.getElementById('mb'),mbl=document.getElementById('mbl')
NK.links(document.getElementById('ixl'),(l,h,i)=>`<a class="l" href="${h}"><small>0${i+1}</small><span style="transition-delay:${.25+i*.05}s">${l}</span></a>`)
document.getElementById('ct').innerHTML=CONTACT.reps.map(r=>`<div><small>${r.role}</small><a href="${r.u}" target="_blank" rel="noopener">${r.n}</a></div>`).join('')+`<div><small>Instagram</small><a href="${P.instagram.u}" target="_blank" rel="noopener">${P.instagram.h}</a></div>`
NK.spy(h=>document.querySelectorAll('.ix a.l').forEach(a=>a.getAttribute('href')===h?a.setAttribute('aria-current','true'):a.removeAttribute('aria-current')))
function tog(v){document.body.classList.toggle('open',v);mb.setAttribute('aria-expanded',v);mbl.textContent=v?'Cerrar':'Menú';document.documentElement.style.overflow=v?'hidden':''}
mb.onclick=()=>tog(!document.body.classList.contains('open'))
document.addEventListener('click',e=>{if(e.target.closest('a[href^="#"]')){tog(false);NK.go(e)}})
addEventListener('keydown',e=>e.key==='Escape'&&tog(false))
NK.autoOpen(()=>tog(true))
</script>
<script src="bind.js"></script>
</body></html>
