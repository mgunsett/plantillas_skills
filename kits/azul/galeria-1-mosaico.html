<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Galería 1 · Mosaico</title>
<link rel="stylesheet" href="base.css">
<style>
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;margin-bottom:28px}
.top .sh{margin:0}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{font:700 11px/1 Nippo,sans-serif;letter-spacing:.16em;text-transform:uppercase;padding:11px 16px;border-radius:999px;border:1px solid var(--line);background:none;color:var(--gray);cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--lime);color:#050b14;border-color:var(--lime)}
.tabs button span{opacity:.6;margin-left:6px}
.tabs button:focus-visible,.more:focus-visible,.m button:focus-visible{outline:2px solid var(--mag);outline-offset:2px}
.m{display:grid;grid-auto-flow:dense;grid-template-columns:repeat(4,1fr);grid-auto-rows:clamp(150px,15vw,230px);gap:8px}
.m button{position:relative;padding:0;border:0;background:#000;overflow:hidden;cursor:zoom-in;animation:rv .7s var(--ease) both}
.m img{width:100%;height:100%;object-fit:cover;object-position:50% 25%;transition:transform .7s var(--ease)}
.m button:after{content:"";position:absolute;inset:0;box-shadow:inset 0 0 0 0 var(--lime);transition:box-shadow .3s var(--ease)}
@media (hover:hover) and (pointer:fine){.m button:hover img{transform:scale(1.05)}.m button:hover:after{box-shadow:inset 0 0 0 3px var(--lime)}}
.foot{display:flex;justify-content:space-between;align-items:center;margin-top:22px;font-size:12px;color:var(--gray);letter-spacing:.12em}
.more{font:700 12px/1 Nippo,sans-serif;letter-spacing:.18em;text-transform:uppercase;padding:14px 22px;border-radius:999px;border:1.5px solid var(--lime);color:var(--lime);background:none;cursor:pointer}
@media (max-width:820px){.m{grid-template-columns:repeat(2,1fr);grid-auto-rows:42vw;gap:6px}}
</style></head><body>
<section class="sec" id="galeria">
  <div class="top"><div class="sh"><div class="k">Fotos</div><h2>Galería</h2></div><div class="tabs" role="tablist" id="tabs"></div></div>
  <div class="m" id="m"></div>
  <div class="foot"><span id="cnt"></span><button class="more" id="more" aria-expanded="false">Ver más fotos</button></div>
</section>
<script src="player.js"></script><script src="kit.js"></script><script src="bind.js"></script><script src="lb.js"></script>
<script>
let cat='all',open=false
const cols=()=>matchMedia('(max-width:820px)').matches?2:4
// Formas que cierran la grilla sin huecos: grupos de 5 (una grande 2x2 + 4 chicas) y el resto ajustado
function shapesFor(n,c){const out=[];let g=0
 while(n-out.length>=5){const big=[2,2];out.push(big,[1,1],[1,1],[1,1],[1,1]);g++}
 const r=n-out.length
 if(c===4){({1:[[4,1]],2:[[2,1],[2,1]],3:[[2,1],[1,1],[1,1]],4:[[1,1],[1,1],[1,1],[1,1]]})[r]?.forEach(s=>out.push(s))}
 else{({1:[[2,1]],2:[[1,1],[1,1]],3:[[2,1],[1,1],[1,1]],4:[[1,1],[1,1],[1,1],[1,1]]})[r]?.forEach(s=>out.push(s))}
 return out}
function render(){const list=GAL.filter(g=>cat==='all'||g.c===cat),c=cols(),first=c===4?10:5
 const show=open?list:list.slice(0,first),sh=shapesFor(show.length,c)
 m.innerHTML=show.map((g,i)=>{const[w,h]=sh[i];const flip=c===4&&Math.floor(i/5)%2&&i%5===0?'grid-column-end:-1;':'';return `<button style="grid-column:span ${w};grid-row:span ${h};${flip}animation-delay:${(i%10)*.04}s" aria-label="Ampliar: ${g.a}"><img src="${g.s}" alt="${g.a}" loading="lazy"></button>`}).join('')
 ;[...m.children].forEach((b,i)=>b.onclick=()=>openLB(list,i))
 cnt.textContent=`${show.length} de ${list.length} fotos`;more.hidden=list.length<=first;more.textContent=open?'Ver menos':'Ver más fotos';more.setAttribute('aria-expanded',open)}
tabs.innerHTML=CATS.map(([k,l])=>`<button role="tab" data-k="${k}">${l}<span>${GAL.filter(g=>k==='all'||g.c===k).length}</span></button>`).join('')
;[...tabs.children].forEach(b=>b.onclick=()=>{cat=b.dataset.k;open=false;[...tabs.children].forEach(x=>x.setAttribute('aria-selected',x===b));render()})
tabs.children[0].setAttribute('aria-selected',true);more.onclick=()=>{open=!open;render()};addEventListener('resize',render);render()
</script>
</body></html>
