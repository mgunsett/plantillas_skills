<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Galería 4 · Hoja de contactos</title>
<link rel="stylesheet" href="base.css">
<style>
.wrap{display:grid;grid-template-columns:1fr 300px;gap:24px;align-items:stretch}
.view{position:relative;background:#000;height:clamp(420px,44vw,640px);overflow:hidden}
.view img{width:100%;height:100%;object-fit:contain;animation:rv .6s var(--ease) both}
.view .bg{position:absolute;inset:0;object-fit:cover;filter:blur(30px) brightness(.35);transform:scale(1.2);animation:none}
.view .fg{position:relative}
.meta{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:flex-end;align-items:flex-end;padding:18px 22px;background:linear-gradient(0deg,#050b14e6,transparent);gap:16px}
.meta .f{white-space:nowrap;font-weight:700;font-size:13px;letter-spacing:.18em;color:var(--lime)}
.meta p{font-size:13px;color:#d6e0ec;line-height:1.4}
.zoom{position:absolute;top:16px;right:16px;font:700 11px/1 Nippo,sans-serif;letter-spacing:.16em;text-transform:uppercase;padding:10px 14px;border-radius:999px;border:1.5px solid var(--lime);color:var(--lime);background:#050b14aa;cursor:zoom-in}
.film{background:#020509;padding:0 18px;position:relative;height:clamp(420px,44vw,640px);overflow-y:auto;scrollbar-width:none}
.film::-webkit-scrollbar{display:none}
.film:before,.film:after{content:"";position:absolute;top:0;bottom:0;width:8px;background:repeating-linear-gradient(180deg,transparent 0 6px,#16202e 6px 14px);z-index:1}
.film:before{left:4px}.film:after{right:4px}
.film ol{list-style:none;display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px 0}
.film button{position:relative;width:100%;aspect-ratio:4/5;padding:0;border:0;background:#000;cursor:pointer;overflow:hidden}
.film img{width:100%;height:100%;object-fit:cover;object-position:50% 25%;filter:grayscale(1) brightness(.6);transition:filter .3s var(--ease)}
.film b{position:absolute;left:5px;bottom:4px;font-size:10px;letter-spacing:.1em;color:#d6e0ec}
.film button[aria-current="true"] img{filter:none}
.film button[aria-current="true"]:after{content:"";position:absolute;inset:0;box-shadow:inset 0 0 0 2px var(--lime)}
.film button[aria-current="true"] b{color:var(--lime)}
@media (hover:hover) and (pointer:fine){.film button:hover img{filter:grayscale(0) brightness(.85)}}
.film button:focus-visible,.zoom:focus-visible,.ar:focus-visible{outline:2px solid var(--mag);outline-offset:-2px}
.hd{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.ctr{display:flex;align-items:center;gap:10px;margin-bottom:44px}
.ctr .c{font-weight:700;font-size:14px;letter-spacing:.14em;min-width:76px;text-align:center}
.ar{width:46px;height:46px;border-radius:50%;border:1.5px solid var(--lime);background:none;color:var(--lime);font-size:18px;cursor:pointer}
@media (max-width:820px){.wrap{grid-template-columns:1fr;gap:10px}.view{height:auto;aspect-ratio:4/5}
 .film{height:auto;overflow-x:auto;overflow-y:hidden;padding:16px 0;scroll-snap-type:x mandatory}
 .film:before,.film:after{left:0;right:0;width:auto;height:8px;background:repeating-linear-gradient(90deg,transparent 0 6px,#16202e 6px 14px)}
 .film:before{top:4px;bottom:auto}.film:after{bottom:4px;top:auto}
 .film ol{display:flex;gap:6px;padding:0 6px}.film li{flex:0 0 74px;scroll-snap-align:center}.ctr{margin-bottom:28px}}
</style></head><body>
<section class="sec" id="galeria">
  <div class="hd"><div class="sh"><div class="k">Fotos</div><h2>Galería</h2></div>
  <div class="ctr"><button class="ar" id="pv" aria-label="Foto anterior">←</button><span class="c tab" id="ct"></span><button class="ar" id="nv" aria-label="Foto siguiente">→</button></div></div>
  <div class="wrap">
    <div class="view" id="view"></div>
    <div class="film" id="film"><ol id="ol"></ol></div>
  </div>
</section>
<script src="player.js"></script><script src="kit.js"></script><script src="bind.js"></script><script src="lb.js"></script>
<script>
let cur=0;const pad=n=>String(n).padStart(2,'0')
ol.innerHTML=GAL.map((g,i)=>`<li><button data-i="${i}" aria-label="Ver foto ${i+1}: ${g.a}"><img src="${g.s}" alt="" loading="lazy"><b>${pad(i+1)}</b></button></li>`).join('')
const btns=[...ol.querySelectorAll('button')]
function show(i){cur=(i+GAL.length)%GAL.length;const g=GAL[cur]
 view.innerHTML=`<img class="bg" src="${g.s}" alt=""><img class="fg" src="${g.s}" alt="${g.a}"><button class="zoom" aria-label="Ampliar foto">Ampliar ⤢</button><div class="meta"><span class="f tab">FOTO ${pad(cur+1)}</span></div>`
 view.querySelector('.zoom').onclick=()=>openLB(GAL,cur)
 ct.textContent=`${pad(cur+1)} / ${pad(GAL.length)}`
 btns.forEach((b,k)=>b.setAttribute('aria-current',k===cur))
 const b=btns[cur],horiz=film.scrollWidth>film.clientWidth+2
 if(horiz)film.scrollTo({left:b.offsetLeft-film.clientWidth/2+b.offsetWidth/2,behavior:'smooth'})
 else film.scrollTo({top:b.offsetTop-film.clientHeight/2+b.offsetHeight/2,behavior:'smooth'})}
btns.forEach(b=>b.onclick=()=>show(+b.dataset.i));pv.onclick=()=>show(cur-1);nv.onclick=()=>show(cur+1);show(0)
</script>
</body></html>
