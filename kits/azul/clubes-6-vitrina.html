<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Clubes 6 · Vitrina</title>
<link rel="stylesheet" href="base.css">
<style>
/* Vitrina: lista de clubes a la izquierda y una ficha que cambia al elegir.
   Movimiento según la guía de Emil Kowalski: curvas propias, menos de 300 ms,
   indicador que se desliza (no aparece), cambio de ficha con blur corto,
   teclado sin animación, hover solo con mouse y swipe con velocidad en mobile. */
.vt{--out:cubic-bezier(.23,1,.32,1);--io:cubic-bezier(.77,0,.175,1);--card:#0b1626;--line2:rgba(255,255,255,.08)}
.vt .head{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;margin-bottom:40px}
.vt .head .sh{margin-bottom:0}
.vt .sum{display:flex;gap:28px}
.vt .sum div{text-align:right}
.vt .sum b{display:block;font-size:40px;font-weight:700;line-height:1;color:var(--bone);font-variant-numeric:tabular-nums}
.vt .sum small{font-size:10px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--gray)}
.vt .wrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:48px;align-items:start}

/* Lista */
.vt .list{position:relative;list-style:none;border-top:1px solid var(--line2)}
.vt .ind{position:absolute;left:0;top:0;width:100%;height:0;border-radius:12px;background:var(--card);box-shadow:inset 3px 0 0 var(--mag);pointer-events:none;transition:transform 260ms var(--io)}
.vt .ind.now{transition:none}
.vt .row{position:relative;width:100%;display:grid;grid-template-columns:44px 36px minmax(0,1fr) auto;align-items:center;gap:16px;padding:0 18px;height:62px;border:0;border-bottom:1px solid var(--line2);background:none;color:var(--gray);text-align:left;cursor:pointer;transition:transform 140ms var(--out),color 160ms ease}
.vt .row:active{transform:scale(.985)}
.vt .row:focus-visible{outline:2px solid var(--lime);outline-offset:-2px;border-radius:12px}
.vt .row .yr{font-size:12px;font-weight:700;letter-spacing:.08em;font-variant-numeric:tabular-nums}
.vt .row img{width:32px;height:32px;object-fit:contain;filter:grayscale(1);opacity:.55;transition:filter 200ms ease,opacity 200ms ease}
.vt .row .nm{font-size:17px;font-weight:700;color:inherit;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vt .row .ct{font-size:11px;font-weight:700;letter-spacing:.18em;text-transform:uppercase}
.vt .row .ct i{font-style:normal;color:var(--mag);margin-left:8px}
.vt .row[aria-selected=true]{color:var(--bone)}
.vt .row[aria-selected=true] img{filter:none;opacity:1}
@media (hover:hover) and (pointer:fine){
 .vt .row:hover{color:#c9d5e3}
 .vt .row:hover img{filter:grayscale(.3);opacity:.85}
}

/* Ficha */
.vt .card{position:sticky;top:32px;border:1px solid var(--line2);border-radius:20px;background:linear-gradient(160deg,#0e1d33,#08111f 60%);overflow:hidden;touch-action:pan-y}
.vt .glow{position:absolute;right:-80px;top:-80px;width:360px;height:360px;border-radius:50%;background:radial-gradient(circle,rgba(77,147,214,.28),transparent 68%);pointer-events:none}
.vt .inner{position:relative;padding:36px 40px 32px;will-change:transform,opacity,filter}
.vt .top{display:flex;justify-content:space-between;align-items:flex-start;gap:20px}
.vt .count{font-size:11px;font-weight:700;letter-spacing:.24em;text-transform:uppercase;color:var(--gray)}
.vt .count b{color:var(--bone)}
.vt .tag{font-size:10px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;padding:7px 12px;border-radius:999px;border:1px solid var(--line);color:var(--lime)}
.vt .tag.cur{background:var(--mag);border-color:var(--mag);color:#050b14}
.vt .crest{width:150px;height:150px;margin:26px 0 22px;object-fit:contain;filter:drop-shadow(0 18px 40px rgba(0,0,0,.5))}
.vt .cn{font-size:clamp(40px,4.2vw,64px);font-weight:700;line-height:.92;text-transform:uppercase;color:var(--bone)}
.vt .meta{display:flex;gap:10px 22px;flex-wrap:wrap;margin-top:14px;font-size:13px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--gray)}
.vt .meta b{color:var(--lime)}
.vt .tl{margin-top:30px}
.vt .track{position:relative;height:6px;border-radius:3px;background:var(--line2);overflow:hidden}
.vt .span{position:absolute;inset:0;background:var(--lime);border-radius:3px;transform-origin:left;transition:transform 260ms var(--io)}
.vt .span.now{transition:none}
.vt .axis{display:flex;justify-content:space-between;margin-top:8px;font-size:10px;font-weight:700;letter-spacing:.16em;color:var(--gray)}
.vt .tt{margin-top:26px;padding-top:20px;border-top:1px solid var(--line2)}
.vt .tt small{font-size:10px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--gray)}
.vt .tt ul{list-style:none;display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.vt .tt li{font-size:13px;font-weight:700;padding:8px 12px;border-radius:10px;background:rgba(212,168,75,.12);color:var(--mag)}
.vt .tt p{margin-top:10px;font-size:14px;color:var(--gray)}
.vt .sw{display:none}

/* Entrada: escalonada, corta y sin escala desde cero */
.vt .rv{opacity:0;transform:translateY(8px)}
.vt.in .rv{opacity:1;transform:none;transition:opacity 300ms var(--out),transform 300ms var(--out);transition-delay:calc(var(--i,0)*40ms)}

/* Mobile: los escudos pasan a ser un riel deslizable y la ficha se puede swipear */
@media (max-width:820px){
 .vt .head{flex-direction:column;align-items:flex-start;margin-bottom:24px}
 .vt .sum{gap:22px}.vt .sum div{text-align:left}.vt .sum b{font-size:30px}
 .vt .wrap{grid-template-columns:1fr;gap:18px}
 .vt .list{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;border:0;padding:4px 2px 8px;margin:0 -20px;padding-left:20px;padding-right:20px;scrollbar-width:none}
 .vt .list::-webkit-scrollbar{display:none}
 .vt .list li{flex:none;scroll-snap-align:center}
 .vt .row{width:64px;height:64px;padding:0;display:grid;place-items:center;grid-template-columns:1fr;border:1px solid var(--line2);border-radius:50%}
 .vt .row .yr,.vt .row .nm,.vt .row .ct{display:none}
 .vt .row img{width:36px;height:36px}
 .vt .row:focus-visible{border-radius:50%}
 .vt .ind{border-radius:50%;box-shadow:0 0 0 2px var(--mag)}
 .vt .card{position:relative;top:0}
 .vt .inner{padding:26px 22px 22px}
 .vt .crest{width:110px;height:110px;margin:20px 0 16px}
 .vt .cn{font-size:40px}
 .vt .sw{display:flex;justify-content:space-between;align-items:center;margin-top:20px}
 .vt .sw button{width:44px;height:44px;border-radius:50%;border:1px solid var(--line2);background:none;color:var(--bone);font-size:18px;transition:transform 140ms var(--out)}
 .vt .sw button:active{transform:scale(.94)}
 .vt .sw span{font-size:10px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--gray)}
}
@media (prefers-reduced-motion:reduce){
 .vt .ind,.vt .span{transition:none}
 .vt .rv{transform:none}.vt.in .rv{transition:opacity 200ms ease}
}
</style></head><body>
<section class="sec vt" id="clubes">
  <div class="head">
    <div class="sh rv"><div class="k">Trayectoria</div><h2>Clubes</h2></div>
    <div class="sum rv" style="--i:1" id="sum"></div>
  </div>
  <div class="wrap">
    <ol class="list" id="list" role="tablist" aria-label="Clubes de su carrera"><div class="ind" id="ind"></div></ol>
    <div class="card rv" style="--i:3" id="card" role="tabpanel" aria-live="polite">
      <div class="glow"></div>
      <div class="inner" id="inner"></div>
    </div>
  </div>
</section>
<script src="player.js"></script><script src="kit.js"></script><script src="bind.js"></script><script>
(()=>{
const CL=CLUBS, sec=document.querySelector('.vt'), list=document.getElementById('list'), ind=document.getElementById('ind'), inner=document.getElementById('inner'), card=document.getElementById('card')
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches
const endY=c=>{const m=String(c.y).match(/(\d{4})\s*$/);return c.cur||/act/i.test(c.y)?2026:(m?+m[1]:c.y0)}
const MIN=Math.min(...CL.map(c=>c.y0)), MAX=2026, SPAN=MAX-MIN+1
const tie=c=>c.cur?'Actual':(c.i||'Club')
const titles=CL.reduce((a,c)=>a+c.t.length,0), countries=new Set(CL.map(c=>c.c)).size
document.getElementById('sum').innerHTML=[[CL.length,'Clubes'],[countries,'Países'],[titles,'Títulos']].map(([b,s])=>`<div><b>${b}</b><small>${s}</small></div>`).join('')

list.insertAdjacentHTML('beforeend',CL.map((c,i)=>`<li class="rv" style="--i:${i+2}"><button class="row" role="tab" id="t${i}" aria-controls="card" aria-selected="false" aria-label="${c.n}, ${c.y}" data-i="${i}">
<span class="yr">${c.y0}</span><img src="${c.l}" alt="" loading="lazy"><span class="nm">${c.n}</span><span class="ct">${c.c}${c.t.length?`<i>★ ${c.t.length}</i>`:''}</span></button></li>`).join(''))
const rows=[...list.querySelectorAll('.row')]

const body=(c,i)=>`<div class="top"><span class="count">Club <b>${String(i+1).padStart(2,'0')}</b> / ${String(CL.length).padStart(2,'0')}</span><span class="tag${c.cur?' cur':''}">${tie(c)}</span></div>
<img class="crest" src="${c.l}" alt="Escudo de ${c.n}">
<div class="cn">${c.n}</div>
<div class="meta"><span><b>${c.y.replace('Act.','Actualidad')}</b></span><span>${c.c}</span></div>
<div class="tl"><div class="track"><div class="span" id="span"></div></div><div class="axis"><span>${MIN}</span><span>${MAX}</span></div></div>
<div class="tt"><small>Títulos</small>${c.t.length?`<ul>${c.t.map(t=>`<li>★ ${t}</li>`).join('')}</ul>`:`<p>Sin títulos en esta etapa.</p>`}</div>
<div class="sw"><button type="button" data-d="-1" aria-label="Club anterior">←</button><span>Deslizá para cambiar</span><button type="button" data-d="1" aria-label="Club siguiente">→</button></div>`

let cur=-1, busy=null
function placeInd(instant){
  const r=rows[cur], lr=list.getBoundingClientRect(), b=r.getBoundingClientRect()
  ind.classList.toggle('now',!!instant)
  ind.style.width=b.width+'px';ind.style.height=b.height+'px'
  ind.style.transform=`translate(${b.left-lr.left+list.scrollLeft}px,${b.top-lr.top}px)`
}
function placeSpan(c,instant){
  const s=document.getElementById('span'); if(!s)return
  s.classList.add('now'); s.style.transform=`translateX(${(c.y0-MIN)/SPAN*100}%) scaleX(${(endY(c)-c.y0+1)/SPAN})`
  if(!instant){ // arranca desde la posición del club anterior para que se deslice
    const p=CL[prev]; s.style.transform=`translateX(${(p.y0-MIN)/SPAN*100}%) scaleX(${(endY(p)-p.y0+1)/SPAN})`
    s.offsetWidth; s.classList.remove('now'); s.style.transform=`translateX(${(c.y0-MIN)/SPAN*100}%) scaleX(${(endY(c)-c.y0+1)/SPAN})`
  }
}
let prev=0
function select(i,{instant=false,dir=1}={}){
  if(i===cur||i<0||i>=CL.length)return
  prev=cur<0?i:cur; cur=i
  rows.forEach((r,k)=>{r.setAttribute('aria-selected',k===i);r.tabIndex=k===i?0:-1})
  placeInd(instant||reduce)
  if(matchMedia('(max-width:820px)').matches) rows[i].scrollIntoView({block:'nearest',inline:'center',behavior:instant||reduce?'auto':'smooth'})
  const c=CL[i]
  if(instant||reduce||!inner.animate){inner.innerHTML=body(c,i);placeSpan(c,true);return}
  // Cambio de ficha: sale rápido (110 ms) y entra con ease-out (220 ms); el blur une los dos estados.
  if(busy)busy.cancel()
  const x=8*dir
  busy=inner.animate([{opacity:1,filter:'blur(0)',transform:'none'},{opacity:0,filter:'blur(4px)',transform:`translateX(${-x}px)`}],{duration:110,easing:'ease-in-out',fill:'forwards'})
  busy.onfinish=()=>{
    inner.innerHTML=body(c,i); placeSpan(c,false)
    busy=inner.animate([{opacity:0,filter:'blur(4px)',transform:`translateX(${x}px)`},{opacity:1,filter:'blur(0)',transform:'none'}],{duration:220,easing:'cubic-bezier(.23,1,.32,1)',fill:'forwards'})
  }
}
list.addEventListener('click',e=>{const r=e.target.closest('.row');if(r)select(+r.dataset.i,{dir:+r.dataset.i>cur?1:-1})})
// Teclado: se usa muchas veces seguidas, así que cambia sin animación.
list.addEventListener('keydown',e=>{
  const k={ArrowDown:1,ArrowRight:1,ArrowUp:-1,ArrowLeft:-1}[e.key]; if(e.key==='Home')k0(0); if(e.key==='End')k0(CL.length-1)
  if(!k)return; e.preventDefault(); k0(Math.max(0,Math.min(CL.length-1,cur+k)))
  function k0(n){select(n,{instant:true});rows[n].focus({preventScroll:true})}
})
card.addEventListener('click',e=>{const b=e.target.closest('.sw button');if(b){const d=+b.dataset.d;select(cur+d,{dir:d})}})
// Swipe en la ficha: alcanza con un gesto rápido, no hace falta arrastrar lejos.
let sx=null,st=0
card.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse')return;sx=e.clientX;st=performance.now()})
card.addEventListener('pointerup',e=>{if(sx===null)return;const dx=e.clientX-sx,v=Math.abs(dx)/(performance.now()-st);sx=null
  if(Math.abs(dx)>60||(v>0.11&&Math.abs(dx)>16)){const d=dx<0?1:-1;select(cur+d,{dir:d})}})
card.addEventListener('pointercancel',()=>sx=null)
addEventListener('resize',()=>placeInd(true))

select(0,{instant:true})
const io=new IntersectionObserver(([en])=>{if(en.isIntersecting){sec.classList.add('in');io.disconnect();setTimeout(()=>placeInd(true),reduce?250:750)}},{rootMargin:'0px 0px -15% 0px'})
io.observe(sec)
})()
</script>
</body></html>
