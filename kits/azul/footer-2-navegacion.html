<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Footer 2 · Con navegación</title>
<link rel="stylesheet" href="base.css">
<style>
footer{background:#03070d;border-top:2px solid var(--lime);padding:64px 60px 28px}
.cols{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:40px}
.logo{font-weight:700;font-size:44px;letter-spacing:.08em;color:var(--lime);text-decoration:none}.logo span{color:var(--mag)}
.brand p{margin-top:14px;font-size:14px;line-height:1.55;color:var(--gray);max-width:30ch}
h4{font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--mag);margin-bottom:18px}
ul{list-style:none;display:grid;gap:12px}
ul a{color:#fff;text-decoration:none;font-size:14px;letter-spacing:.06em;transition:color .25s var(--ease)}
ul small{display:block;color:var(--gray);font-size:12px;margin-top:3px}
.bot{display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap;margin-top:56px;padding-top:22px;border-top:1px solid var(--line)}
.cp{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--gray)}
a:focus-visible{outline:2px solid var(--mag);outline-offset:3px}
@media (hover:hover) and (pointer:fine){ul a:hover{color:var(--lime)}}
@media (max-width:820px){footer{padding:48px 20px 24px}.cols{grid-template-columns:1fr 1fr;gap:32px 20px}.brand{grid-column:1/-1}.bot{flex-direction:column;align-items:flex-start;margin-top:40px}}
</style></head><body>
<div class="pre">· fin de contacto ·</div>
<footer>
  <div class="cols">
    <div class="brand"><a class="logo" href="#hero" aria-label="Volver al inicio">{{initials}}<span>_</span></a><p>{{full}} · {{position}} · {{clubFull}}{{loanText}}.</p></div>
    <div><h4>Secciones</h4><ul id="nav"></ul></div>
    <div><h4>Contacto</h4><ul id="rep"></ul></div>
    <div><h4>Seguilo</h4><ul id="soc"></ul></div>
  </div>
  <div class="bot"><span class="cp">© {{year}} {{full}} · Todos los derechos reservados</span><span id="dev"></span></div>
</footer>

<script src="player.js"></script><script src="kit.js"></script><script src="bind.js"></script><script>
nav.innerHTML=NAVL.map(([l,h])=>`<li><a href="${h}">${l}</a></li>`).join('')
rep.innerHTML=CONTACT.reps.map(r=>`<li><a href="${r.u}" target="_blank" rel="noopener">${r.n}<small>${r.role}</small></a></li>`).join('')
soc.innerHTML=CONTACT.social.map(s=>`<li><a href="${s.u}" target="_blank" rel="noopener">${s.l} ↗<small>${s.h}</small></a></li>`).join('')
dev.outerHTML=DEV
</script>
</body></html>
