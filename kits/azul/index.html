:root[data-theme="light"]{--bg:#F4F6FB;--panel:#FFFFFF;--line:#D5DCEA;--fg:#0D1730;--muted:#5C6A88;--acc:#123E7A;--acc2:#A8771C;color-scheme:light}
*,*:before,*:after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,'Segoe UI',sans-serif}
.wrap{max-width:1560px;margin:0 auto;padding-block:28px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#copyTxt{display:block;width:100%;margin-top:10px;min-height:150px;font:12px/1.5 ui-monospace,monospace;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:8px}
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:18px}
.k{font:700 11px/1.2 var(--display);letter-spacing:.24em;text-transform:uppercase;color:var(--muted)}
h1{font:700 clamp(28px,4vw,46px)/1 var(--display);text-transform:uppercase;margin-top:8px;color:var(--acc)}h1 span{color:var(--acc2)}
.tabs,.secs,.styles{display:flex;flex-wrap:wrap;gap:8px}
button{font-family:inherit}
.tabs button,.secs button,.styles button{font:700 12px/1 var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);background:var(--panel);border:1px solid var(--line);padding:11px 15px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.tabs button b{color:var(--acc2)}
.tabs button i{font-style:normal;font-size:10px;letter-spacing:.1em;padding:3px 6px;border-radius:4px;border:1px solid currentColor;opacity:.75}
.tabs button.pick{border-color:var(--acc2)}
.tabs button.pick:after{content:"★";color:var(--acc2)}
.tabs button[aria-selected="true"]{background:var(--acc);color:#fff;border-color:var(--acc)}.tabs button[aria-selected="true"] b{color:#fff}
.secs button[aria-selected="true"]{background:var(--acc2);color:#050B14;border-color:var(--acc2)}
.secs button.done:after{content:"★";color:var(--acc2)}.secs button.done[aria-selected="true"]:after{color:#050B14}
.styles{margin-bottom:12px}.styles button[aria-pressed="true"]{color:var(--fg);border-color:var(--fg)}
button:focus-visible,a:focus-visible{outline:2px solid var(--acc2);outline-offset:2px}
#tabs{margin-bottom:20px}
.stage{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:20px;align-items:start}
.stage.three{grid-template-columns:minmax(0,1fr) 240px 240px}
.dev{min-width:0}.dev .lbl{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:8px}
.frame{position:relative;width:100%;overflow:hidden;border:1px solid var(--line);border-radius:10px;background:#000}
.frame.d{aspect-ratio:1440/900}.frame.m{aspect-ratio:390/844;border-radius:26px;border-width:6px;border-color:#1C2B44}
.frame iframe{position:absolute;top:0;left:0;border:0;transform-origin:0 0}
#mo{display:none}.three #mo{display:block}
.info{margin-top:22px;border-top:1px solid var(--line);padding-top:22px;display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:28px}
.info h2{font:700 28px/1 var(--display);text-transform:uppercase;color:var(--acc);margin-top:8px}
.info p{color:var(--muted);line-height:1.6;margin-top:10px;max-width:72ch}
.info ul{margin-top:10px;padding-left:18px;color:var(--muted);line-height:1.6}
.choose{margin-top:16px;font:700 12px/1 var(--display);letter-spacing:.14em;text-transform:uppercase;background:transparent;color:var(--acc2);border:1.5px solid var(--acc2);padding:12px 18px;border-radius:999px;cursor:pointer}
.choose[aria-pressed="true"]{background:var(--acc2);color:#050B14}
.note{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;font-size:14px;line-height:1.55;color:var(--muted)}
.note b{color:var(--fg)}
.sum{margin-top:14px}.sum ol{padding-left:18px;margin-top:8px}.sum li{margin:2px 0}.sum li span{color:var(--fg)}
.sum .copy{margin-top:10px;font:700 11px/1 var(--display);letter-spacing:.14em;text-transform:uppercase;background:var(--acc);color:#fff;border:0;padding:10px 14px;border-radius:999px;cursor:pointer}
a.open{color:var(--acc2);font:700 11px/1 var(--display);letter-spacing:.14em;text-transform:uppercase;text-decoration:none}
@media (max-width:1000px){.stage,.stage.three{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.dev.d{grid-column:1/-1}.stage:not(.three) .dev.m{grid-column:1/-1;max-width:300px;margin:0 auto;width:100%}.info{grid-template-columns:1fr}}

  D('footer-3-firma','Firma','Escudo, posición y club, links, Volver arriba y MARTÍNEZ gigante a todo el ancho.',['Ya existe en React.']),
  D('footer-4-escudos','Escudos','Franja con los escudos de sus 9 clubes en gris (Vélez a color) y debajo logo, derechos, crédito y Volver arriba.')],
  c:[
  D('footer-1-pulido','Pulido','Versión clara del footer en una línea.'),
  D('footer-2-navegacion','Con navegación','Versión clara del footer con columnas.'),
  D('footer-3-firma','Firma','Versión clara de la firma gigante.',['Ya existe en React.']),
  D('footer-4-escudos','Escudos','Versión clara de la franja de escudos.')]}],
}
// Lista plana por sección: [estilo, archivo, título, desc, notas, código]
const LIST={};for(const k in SECS){LIST[k]=[];for(const s of ['o'])(SECS[k][1][s]||[]).forEach((o,i)=>LIST[k].push({s,f:o[0],t:o[1],d:o[2],l:o[3]||[],code:(s==='o'?'O':'C')+(i+1)}))}
for(const k in SECS)if(!LIST[k].length){delete SECS[k];delete LIST[k]}
const ORDER=Object.keys(SECS),$=id=>document.getElementById(id)
let sec='hero',cur={},picks={},filt='all'
try{const v=JSON.parse(localStorage.getItem('cmpRonaldo')||'{}');if(SECS[v.sec])sec=v.sec;cur=v.cur||{};picks=v.picks||{}}catch(e){}
const save=()=>{try{localStorage.setItem('cmpRonaldo',JSON.stringify({sec,cur,picks}))}catch(e){}}
ORDER.forEach(k=>{const b=document.createElement('button');b.setAttribute('role','tab');b.textContent=SECS[k][0];b.onclick=()=>pickSec(k);$('secs').appendChild(b)})
;[['all','Todas'],['o','Oscuro'],['c','Claro']].forEach(([v,t])=>{const b=document.createElement('button');b.textContent=t;b.setAttribute('aria-pressed',v===filt);b.onclick=()=>{filt=v;[...$('styles').children].forEach(x=>x.setAttribute('aria-pressed',x===b));renderTabs()};$('styles').appendChild(b)})
function renderTabs(){const L=LIST[sec];$('tabs').innerHTML='';L.forEach((o,i)=>{if(filt!=='all'&&o.s!==filt)return;const b=document.createElement('button');b.setAttribute('role','tab');b.dataset.i=i
 b.innerHTML='<b>'+o.code+'</b>'+o.t+' <i>'+ST[o.s][0]+'</i>';b.onclick=()=>sel(i);$('tabs').appendChild(b)});mark()}
function pickSec(k){sec=k;[...$('secs').children].forEach((b,j)=>b.setAttribute('aria-selected',ORDER[j]===k));$('h1s').textContent=SECS[k][0];$('cnt').textContent=LIST[k].length
 $('stage').classList.toggle('three',k==='navbar');$('note').innerHTML=NOTE[k]||NOTE._;renderTabs();sel(cur[k]||0)}
function sel(i){cur[sec]=i;save();const o=LIST[sec][i],src=ST[o.s][1]+'/'+o.f+'.html'
 $('fd').src=$('fm').src=$('openD').href=src;$('fo').src=sec==='navbar'?src+'#open':'about:blank'
 $('iNum').textContent=SECS[sec][0]+' · '+o.code+' · estilo '+ST[o.s][0].toLowerCase();$('iTitle').textContent=o.t;$('iDesc').textContent=o.d;$('iList').innerHTML=o.l.map(x=>'<li>'+x+'</li>').join('');mark();fit()}
function mark(){const i=cur[sec]||0;[...$('tabs').children].forEach(b=>{b.setAttribute('aria-selected',+b.dataset.i===i);b.classList.toggle('pick',picks[sec]===LIST[sec][+b.dataset.i].code)})
 const o=LIST[sec][i],on=picks[sec]===o.code;$('choose').setAttribute('aria-pressed',on);$('choose').textContent=on?'★ Elegida para '+SECS[sec][0]:'★ Elegir esta opción'
 ;[...$('secs').children].forEach((b,j)=>b.classList.toggle('done',!!picks[ORDER[j]]))
 $('sum').innerHTML=ORDER.map(k=>{const c=picks[k],o=c&&LIST[k].find(x=>x.code===c);return '<li>'+SECS[k][0]+': <span>'+(o?o.code+' '+o.t+' ('+ST[o.s][0].toLowerCase()+')':'—')+'</span></li>'}).join('')}
$('choose').onclick=()=>{const o=LIST[sec][cur[sec]||0];picks[sec]=picks[sec]===o.code?undefined:o.code;save();mark()}
$('copy').onclick=()=>{const t='Mis elecciones:\n'+ORDER.map(k=>{const c=picks[k],o=c&&LIST[k].find(x=>x.code===c);return '- '+SECS[k][0]+': '+(o?o.code+' '+o.t+' ('+ST[o.s][0].toLowerCase()+')':'sin elegir')}).join('\n')
 const done=()=>{$('copy').textContent='¡Copiado!';setTimeout(()=>$('copy').textContent='Copiar para pegar en el chat',1600)}
 const fb=()=>{const a=$('copyTxt');a.value=t;a.hidden=false;a.focus();a.select()}
 try{navigator.clipboard.writeText(t).then(done,fb)}catch(e){fb()}}
function fit(){[[$('fd'),1440],[$('fm'),390],[$('fo'),390]].forEach(([f,w])=>{const c=f.parentElement.clientWidth;if(c)f.style.transform='scale('+(c/w)+')'})}
new ResizeObserver(fit).observe($('stage'));pickSec(sec)
</script>
