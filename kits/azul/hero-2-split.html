<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hero 2 · Split editorial</title>
<link rel="stylesheet" href="base.css">
<style>
.hero{position:relative;height:calc(100 * var(--sv));min-height:600px;overflow:hidden;display:grid;grid-template-columns:1.05fr 1fr}
.txt{position:relative;z-index:5;display:flex;flex-direction:column;justify-content:center;padding:90px 0 40px 60px}
.tag{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.tag .dot{width:8px;height:8px;border-radius:50%;background:var(--mag)}
h1{font-weight:700;text-transform:uppercase;line-height:.86}
h1 .n1{display:block;font-size:clamp(34px,4.4vw,76px);color:var(--bone)}
h1 .n2{display:block;font-size:clamp(70px,10.4vw,190px);color:var(--lime);margin-left:-.04em;white-space:nowrap}
.bio{max-width:430px;margin-top:22px;color:#c3cfdd;font-size:15px;line-height:1.6;font-weight:300}
.stats{display:grid;grid-template-columns:repeat(4,auto);justify-content:start;gap:0;margin-top:30px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.stats div{padding:14px 26px 14px 0;margin-right:26px;border-right:1px solid var(--line)}
.stats div:last-child{border:0;margin:0}
.stats b{display:block;font-size:26px;color:var(--bone);font-weight:700}
.stats small{font-size:10px;letter-spacing:.22em;color:var(--gray);text-transform:uppercase}
.ctas{display:flex;gap:14px;margin-top:30px}
.btn{font-weight:700;font-size:12px;letter-spacing:.2em;text-transform:uppercase;padding:15px 26px;border-radius:999px;border:1.5px solid var(--lime);color:var(--lime);text-decoration:none}
.btn.solid{background:var(--lime);color:#050b14}
@media (hover:hover) and (pointer:fine){.btn{transition:transform .25s var(--ease)}.btn:hover{transform:translateY(-2px)}}
.vis{position:relative}
.panel{position:absolute;inset:0 0 0 -8%;background:var(--lime);clip-path:polygon(22% 0,100% 0,100% 100%,0 100%);
  animation:pn 1.2s var(--ease) both}
@keyframes pn{from{transform:translateX(30%);opacity:0}}
.panel:before{content:attr(data-n);position:absolute;right:-2%;top:-6%;font-weight:700;font-size:70vh;line-height:1;color:#050b14;opacity:.12}
.panel .crest{position:absolute;right:40px;bottom:36px;width:70px;opacity:.9}
.player{position:absolute;bottom:0;left:50%;transform:translateX(-50%);height:96%;z-index:3;filter:drop-shadow(-24px 20px 40px #0008);
  animation:pl 1.4s var(--ease) .3s both}
@keyframes pl{from{opacity:0;transform:translate(-40%,0)}}
.badge{position:absolute;z-index:4;left:6%;top:24%;background:var(--mag);color:#fff;font-weight:700;padding:10px 14px;line-height:1;transform:rotate(-4deg)}
.badge b{display:block;font-size:44px}.badge small{font-size:10px;letter-spacing:.2em}
.nav .links:last-child a{color:#050b14}.nav .links:last-child .cta{border-color:#050b14;color:#050b14}
.eyebrow .s{display:none}
@media (max-width:820px){
  .nav .logo{color:#050b14}.nav .burger,.nav .burger:after{border-color:#050b14}
  .eyebrow .l{display:none}.eyebrow .s{display:inline}
  .hero{grid-template-columns:1fr;grid-template-rows:56% 44%;min-height:700px}
  .vis{grid-row:1}
  .panel{inset:0;clip-path:polygon(0 0,100% 0,100% 82%,0 100%)}
  .panel:before{font-size:52vh;right:-6%}
  .panel .crest{width:40px;left:20px;right:auto;bottom:auto;top:78px}
  .player{height:100%;bottom:-2%}
  .badge{left:20px;top:auto;bottom:16%}.badge b{font-size:30px}
  .txt{grid-row:2;padding:0 20px 28px;justify-content:center}
  .tag{margin-bottom:10px}
  h1 .n1{font-size:8vw}h1 .n2{font-size:14.5vw}
  .bio{display:none}
  .stats{grid-template-columns:repeat(4,1fr);margin-top:16px}
  .stats div{padding:10px 0;margin:0;text-align:center}
  .stats b{font-size:18px}.stats small{font-size:8px;letter-spacing:.12em}
  .ctas{margin-top:18px}.btn{flex:1;text-align:center;padding:13px 10px;font-size:11px}
}
</style></head><body>
<header class="nav"><div class="links"><a>Home</a><a>Estadísticas</a></div><div class="logo">{{initials}}<span>_</span></div><div class="links"><a>Videos</a><a>Galería</a><a class="cta">Contacto</a></div><div class="burger"></div></header>
<section class="hero" id="hero">
  <div class="txt">
    <div class="tag rv" style="animation-delay:.2s"><span class="dot"></span><span class="eyebrow"><span class="l">{{position}} · {{club}} ({{clubCountryCode}})</span><span class="s">{{position}} · #{{number}}</span></span></div>
    <h1><span class="n1 rv" style="animation-delay:.3s">{{first}}</span><span class="n2 rv" style="animation-delay:.4s">{{last}}</span></h1>
    <p class="bio rv" style="animation-delay:.5s">{{bio}}</p>
    <div class="stats rv" style="animation-delay:.6s">
      <div><b>{{age}}</b><small>Edad</small></div><div><b>{{height}}</b><small>Altura</small></div><div><b>{{s.pj}}</b><small>Partidos</small></div><div><b>{{s.val}}</b><small>Valoración</small></div>
    </div>
    <div class="ctas rv" style="animation-delay:.7s"><a class="btn solid" href="#">Ver jugadas</a><a class="btn" href="#">Contacto</a></div>
  </div>
  <div class="vis">
    <div class="panel" data-n="{{number}}"><img class="crest" src="{{crest}}" alt=""></div>
    <img class="player" src="{{photos.heroBall}}" alt="{{alts.heroBall}}" fetchpriority="high">
    <div class="badge rv" style="animation-delay:.9s"><small>DORSAL</small><b>{{number2}}</b></div>
  </div>
</section>
<script src="player.js"></script><script src="kit.js"></script><script src="bind.js"></script>
</body></html>
