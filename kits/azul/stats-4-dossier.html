<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Estadísticas 4 · Dossier</title>
<link rel="stylesheet" href="base.css">
<style>
/* Dossier: informe de revista. Portada con el número que lo define, lecturas cruzadas, tablero y ranking de atributos; ficha como pie de página. */
.dos{--A:var(--lime);--B:var(--mag);--T:var(--bone);--S:#c3cfdd}
.dos .top{margin-bottom:40px}
.dos .sh{margin-bottom:0}
.dos .folio{display:flex;gap:18px;align-items:center;font-size:11px;font-weight:700;letter-spacing:.24em;text-transform:uppercase;color:var(--gray);margin-bottom:14px}
.dos .folio b{color:var(--B)}
.dos .folio i{flex:1;height:1px;background:var(--line)}
.dos .stand{font-size:clamp(18px,1.6vw,24px);line-height:1.45;font-weight:300;color:var(--S);max-width:46ch}
.dos .stand b{color:var(--T);font-weight:700}.dos .stand em{font-style:normal;color:var(--A);font-weight:700}
.dos .body{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr) minmax(0,1fr);border-top:2px solid var(--T)}
.dos .body>*{padding:26px 28px 30px;min-width:0}.dos .body>*+*{border-left:1px solid var(--line)}
.dos .body>:first-child{padding-left:0}.dos .body>:last-child{padding-right:0}
.dos .lbl{font-size:11px;font-weight:700;letter-spacing:.24em;text-transform:uppercase;color:var(--gray)}
/* Portada */
.feat .big{display:flex;align-items:flex-end;gap:14px;margin-top:14px}
.feat .big b{font-size:clamp(120px,13vw,220px);font-weight:700;line-height:.78;letter-spacing:-.04em;color:var(--B)}
.feat .big span{font-size:15px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--T);padding-bottom:10px;line-height:1.3}
.feat ul{list-style:none;margin-top:28px;border-top:1px solid var(--line)}
.feat li{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:baseline;padding:13px 0;border-bottom:1px solid var(--line);font-size:14px;color:var(--S);line-height:1.35}
.feat li b{font-size:26px;font-weight:700;color:var(--A);min-width:84px}
/* Tablero */
.nums{display:grid;grid-template-columns:1fr 1fr;margin-top:14px}
.nums div{padding:18px 0 20px;border-bottom:1px solid var(--line)}
.nums div:nth-child(even){padding-left:20px;border-left:1px solid var(--line)}
.nums div:last-child:nth-child(odd){grid-column:1/-1;padding-left:0;border-left:0}
.tabc{display:flex;flex-direction:column}
.tabc .nums{flex:1;grid-template-rows:auto auto 1fr}
.nums .hl{grid-column:1/-1;padding:0!important;border-left:0!important;border-bottom:0;display:flex;align-items:stretch}
.hl .in{flex:1;margin-top:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:12px 0;text-align:center}
.nums .hl .in div{padding:0!important;border:0!important}
.hl .in>small{margin:0}
.ring{position:relative;width:clamp(150px,13vw,190px);aspect-ratio:1}
.ring svg{width:100%;height:100%;transform:rotate(-90deg);overflow:visible}
.ring circle{fill:none;stroke-width:9}
.ring .bg{stroke:var(--line)}
.ring .fg{stroke:var(--B);stroke-linecap:round;stroke-dasharray:var(--c);stroke-dashoffset:var(--o);animation:ring 1.4s var(--ease) both .35s;filter:drop-shadow(0 0 10px color-mix(in srgb,var(--B) 45%,transparent))}
@keyframes ring{from{stroke-dashoffset:var(--c)}}
.nums .ring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;line-height:1;padding-top:.06em;font-size:clamp(48px,4.4vw,68px)!important;color:var(--T)}
@media (prefers-reduced-motion:reduce){.ring .fg{animation:none}}
.nums b{display:block;font-size:clamp(40px,3.6vw,60px);font-weight:700;line-height:.85;letter-spacing:-.02em;color:var(--T)}
.nums small{display:block;margin-top:9px;font-size:10px;letter-spacing:.2em;color:var(--gray);text-transform:uppercase}
/* Ranking */
.rank{margin-top:14px}
.rk{display:grid;grid-template-columns:26px minmax(0,1fr) 44px;grid-template-areas:"n l v" "n u v";gap:6px 12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
.rk i{grid-area:n;font-style:normal;font-size:11px;color:var(--gray)}
.rk span{grid-area:l;font-size:15px;font-weight:500;color:var(--T)}
.rk b{grid-area:v;justify-self:end;font-size:22px;font-weight:700;color:var(--A);font-variant-numeric:tabular-nums}
.rk u{grid-area:u;display:block;height:4px;background:var(--line);border-radius:2px;overflow:hidden;text-decoration:none}
.rk u:after{content:"";display:block;height:100%;width:var(--w);background:var(--A);border-radius:2px;transform-origin:left;animation:w 1.1s var(--ease) both;animation-delay:var(--d)}
.rk.first{padding:14px 0 16px}.rk.first span{font-weight:700;font-size:18px}.rk.first b{color:var(--B);font-size:30px}.rk.first u{height:6px}.rk.first u:after{background:var(--B)}
.rk.first em{display:block;font-style:normal;font-size:10px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--B);margin-bottom:4px}
.media{display:flex;justify-content:space-between;align-items:baseline;margin-top:16px;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--gray)}
.media b{font-size:20px;color:var(--T);letter-spacing:0}
@keyframes w{from{transform:scaleX(0)}}
/* Ficha al pie */
.ficha{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));border-top:1px solid var(--line);border-bottom:2px solid var(--T);margin-top:0}
.ficha div{padding:16px 16px 18px 0}.ficha div+div{padding-left:16px;border-left:1px solid var(--line)}
.ficha small{display:block;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--gray)}
.ficha b{display:block;margin-top:6px;font-size:15px;color:var(--T)}
@media (max-width:1100px){.dos .body{grid-template-columns:1fr 1fr}.dos .body>.rankc{grid-column:1/-1;border-left:0;border-top:1px solid var(--line);padding-left:0}}
@media (max-width:820px){.dos .top{grid-template-columns:1fr;gap:22px;margin-bottom:28px}
 .dos .body{grid-template-columns:1fr}.dos .body>*{padding:22px 0!important;border-left:0!important}.dos .body>*+*{border-top:1px solid var(--line)}
 .feat .big b{font-size:34vw}.ficha{grid-template-columns:repeat(2,1fr)}.ficha div{padding:14px 0!important;border-left:0!important;border-bottom:1px solid var(--line)}.ficha div:nth-child(even){padding-left:16px!important;border-left:1px solid var(--line)!important}}
@media (prefers-reduced-motion:reduce){.rk u:after{animation:none}}
</style></head><body>
<section class="sec dos" id="estadisticas">
  <div class="folio"><span>Dossier N.º <b>{{number}}</b></span><i></i><span>Temporada {{seasonLabel}}</span></div>
  <div class="top">
    <div class="sh"><div class="k">Informe de la temporada</div><h2>Estadísticas</h2></div>
  </div>
  <div class="body">
    <div class="feat rv"><div class="lbl">La cifra que lo define</div><div class="big"><b class="tab" id="bigV"></b><span id="bigL"></span></div><ul id="reads"></ul></div>
    <div class="tabc rv" style="animation-delay:.1s"><div class="lbl">Tablero</div><div class="nums" id="nums"></div></div>
    <div class="rankc rv" style="animation-delay:.2s"><div class="lbl">Atributos, de mayor a menor</div><div class="rank" id="rank"></div><div class="media">Media general <b class="tab">{{media}}</b></div></div>
  </div>
  <div class="ficha" id="ficha"></div>
</section>
<script src="player.js"></script><script src="kit.js"></script><script src="bind.js"></script><script>
const S=SEASON_ORDER(['goles','pj','asis','tiros','min','val']),[M,...R]=S
bigV.textContent=M.v;bigL.innerHTML=M.l.replace(' ','<br>')+'<br>en {{seasonShort}}'.replace('{{seasonShort}}',P.seasonShort)
// Lecturas que salen de cruzar los números (si falta un dato, no se muestra)
const n=k=>parseFloat(String(SEASON_BY(k).v).replace(/[^\d.]/g,''))||0
const G=n('goles'),PJ=n('pj'),T=n('tiros'),MIN=n('min'),A=n('asis')
const reads=[MIN&&G&&[Math.round(MIN/G)+"'",'minutos en cancha por cada gol'],PJ&&G&&[(G/PJ).toFixed(2).replace('.',','),'goles por partido jugado'],T&&G&&[Math.round(G/T*100)+'%','de sus tiros al arco terminan en gol'],G&&A&&[G+A,'goles y asistencias en total']].filter(Boolean)
document.getElementById('reads').innerHTML=reads.map(([b,t])=>`<li><b class="tab">${b}</b><span>${t}</span></li>`).join('')
const V=R.find(s=>s.k==='val')||(R.length%2?R[R.length-1]:null),RS=R.filter(s=>s!==V)
const vn=V?parseFloat(String(V.v).replace(',','.'))||0:0
document.getElementById('nums').innerHTML=RS.map(s=>`<div><b class="tab">${s.v}</b><small>${s.l}</small></div>`).join('')+(V?`<div class="hl"><div class="in"><small>${V.l}</small><div class="ring" style="--c:339.3;--o:${(339.3*(1-Math.min(vn,10)/10)).toFixed(1)}"><svg viewBox="0 0 120 120" aria-hidden="true"><circle class="bg" cx="60" cy="60" r="54"/><circle class="fg" cx="60" cy="60" r="54"/></svg><b class="tab">${V.v}</b></div></div></div>`:'')
const AT=[...ATTRS].sort((a,b)=>b[1]-a[1])
document.getElementById('rank').innerHTML=AT.map(([l,v],i)=>`<div class="rk${i?'':' first'}"><i>${String(i+1).padStart(2,'0')}</i><span>${i?'':'<em>Su mejor arma</em>'}${l}</span><b>${v}</b><u style="--w:${v}%;--d:${.3+i*.08}s"></u></div>`).join('')
document.getElementById('ficha').innerHTML=[['Posición',P.position],['Pie hábil',P.foot],['Edad',P.age+' años'],['Altura',P.height+' m'],['Peso',P.weight+' kg'],['Origen',P.birthPlaceShort]].map(([k,v])=>`<div><small>${k}</small><b>${v}</b></div>`).join('')
</script>
</body></html>
