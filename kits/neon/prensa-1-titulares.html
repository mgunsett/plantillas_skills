<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prensa 1 · Titulares</title>
<link rel="stylesheet" href="base.css">
<style>
.hd{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:44px}.hd .sh{margin:0}
.ej{font-size:10px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--mag);border:1px dashed var(--mag);padding:7px 10px;border-radius:4px}
ul{list-style:none;border-top:1px solid var(--line)}
li a{display:grid;grid-template-columns:64px 170px 1fr 56px;gap:28px;align-items:center;padding:26px 8px;border-bottom:1px solid var(--line);color:inherit;text-decoration:none;position:relative;transition:background .3s var(--ease),padding .3s var(--ease)}
li img{width:64px;height:64px;border-radius:12px;object-fit:cover;background:#fff}
.m b{display:block;font-size:12px;letter-spacing:.18em;text-transform:uppercase}
.m span{display:block;margin-top:6px;font-size:11px;letter-spacing:.16em;color:var(--gray);text-transform:uppercase}
h3{font-size:clamp(20px,2.1vw,32px);line-height:1.12;font-weight:700;text-transform:uppercase;max-width:30ch}
.ar{width:52px;height:52px;border-radius:50%;border:1.5px solid var(--lime);color:var(--lime);display:grid;place-items:center;font-size:20px;transition:transform .3s var(--ease)}
li a:focus-visible{outline:2px solid var(--mag);outline-offset:-2px}
@media (hover:hover) and (pointer:fine){li a:hover{background:var(--lime);color:#0C0E0A;padding-left:24px;padding-right:24px}li a:hover .m span{color:#0C0E0A}li a:hover .ar{border-color:#0C0E0A;color:#0C0E0A;transform:rotate(45deg)}}
@media (max-width:820px){li a{grid-template-columns:48px 1fr 40px;gap:14px 16px;padding:20px 0}li img{width:48px;height:48px}
 h3{grid-column:1/-1;grid-row:2;font-size:20px}.ar{width:40px;height:40px;font-size:16px}}
</style></head><body>
<section class="sec" id="press">
  <div class="hd"><div class="sh"><div class="k">En los medios</div><h2>Prensa</h2></div></div>
  <ul id="ul"></ul>
</section>

<script src="player.js"></script><script src="kit.js"></script><script src="bind.js"></script><script>
ul.innerHTML=PRESS.map((p,i)=>`<li class="rv" style="animation-delay:${i*.08}s"><a href="${p.u}" target="_blank" rel="noopener" aria-label="Leer en ${p.medio}: ${p.t}"><img src="${p.logo}" alt=""><div class="m"><b>${p.medio}</b><span>${p.d}</span></div><h3>${p.t}</h3><span class="ar" aria-hidden="true">↗</span></a></li>`).join('')
</script>
</body></html>
