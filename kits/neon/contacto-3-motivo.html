<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Contacto 3 · Para qué escribís</title>
<link rel="stylesheet" href="base.css">
<style>
.g{display:grid;grid-template-columns:1fr 1fr;gap:60px;align-items:start}
.q{font-size:clamp(28px,3vw,44px);font-weight:700;text-transform:uppercase;line-height:1}
.chips{display:flex;flex-direction:column;gap:10px;margin-top:28px}
.chips button{display:flex;justify-content:space-between;align-items:center;text-align:left;font-size:15px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:20px 22px;background:none;border:1.5px solid var(--line);color:#fff;cursor:pointer;transition:border-color .25s var(--ease),background .25s var(--ease)}
.chips button span{font-size:11px;letter-spacing:.2em;color:var(--gray);font-weight:400}
.chips button[aria-pressed="true"]{background:var(--lime);border-color:var(--lime);color:#0C0E0A}
.chips button[aria-pressed="true"] span{color:#0C0E0A}
.chips button:focus-visible,.card a:focus-visible{outline:2px solid var(--mag);outline-offset:2px}
@media (hover:hover) and (pointer:fine){.chips button:hover{border-color:var(--lime)}}
.card{position:relative;background:var(--bg2);padding:40px;min-height:420px;display:flex;flex-direction:column;overflow:hidden}
.card .bgl{position:absolute;right:-60px;bottom:-60px;width:300px;opacity:.07;filter:grayscale(1)}
.card .in{animation:rv .55s var(--ease) both;display:flex;flex-direction:column;flex:1;position:relative}
.card .to{font-size:11px;font-weight:700;letter-spacing:.24em;text-transform:uppercase;color:var(--mag)}
.card .who{display:flex;align-items:center;gap:18px;margin-top:22px}
.card .who .lg{width:78px;height:78px;border-radius:50%;background:#0C0E0A;display:grid;place-items:center;flex-shrink:0;color:var(--lime);font-size:34px}
.card .who img{width:80%;height:80%;object-fit:contain}
.card h3{font-size:clamp(24px,2.4vw,36px);text-transform:uppercase;line-height:1}
.card .h{margin-top:6px;color:var(--gray);font-size:14px}
.card p{margin-top:26px;font-size:15px;line-height:1.55;color:#d6dccd;max-width:40ch;flex:1}
.card a{margin-top:28px;display:flex;justify-content:center;align-items:center;gap:10px;font-size:13px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#0C0E0A;background:var(--lime);padding:18px;border-radius:999px;text-decoration:none}
.tm{margin-top:20px;font-size:12px;color:var(--gray);letter-spacing:.12em;text-transform:uppercase}.tm a{color:#fff}
@media (max-width:820px){.g{grid-template-columns:1fr;gap:24px}.card{padding:26px;min-height:0}.chips button{padding:16px 18px;font-size:14px}.card a{font-size:12px;letter-spacing:.08em}}
</style></head><body>
<section class="sec" id="contact">
  <div class="sh"><div class="k">Hablemos</div><h2>Contacto</h2></div>
  <div class="g">
    <div><p class="q">¿Para qué escribís?</p><div class="chips" id="chips"></div><p class="tm">Ficha en <a id="tm" target="_blank" rel="noopener">Transfermarkt ↗</a></p></div>
    <div class="card" aria-live="polite" id="card"></div>
  </div>
</section>

<script src="player.js"></script><script src="kit.js"></script><script src="bind.js"></script><script>
const [moon,led]=CONTACT.reps,ig=CONTACT.social[0];tm.href=CONTACT.social[1].u
const OPTS=[
 {k:'Soy de un club',s:'Fichajes',r:moon,txt:'Propuestas deportivas, préstamos y transferencias. Lo maneja su representante.'},
 {k:'Soy una marca',s:'Sponsors',r:led,txt:'Patrocinios, campañas y acciones comerciales. Lo maneja su agencia de marketing.'},
 {k:'Prensa o fan',s:'Notas y saludos',r:{role:'Directo con '+P.first,n:'Instagram personal',h:ig.h,u:ig.u},txt:'Entrevistas, notas o un saludo. Escribile directo por mensaje en Instagram.'}]
chips.innerHTML=OPTS.map(o=>`<button aria-pressed="false">${o.k}<span>${o.s}</span></button>`).join('')
function pick(i){const o=OPTS[i],r=o.r;[...chips.children].forEach((b,k)=>b.setAttribute('aria-pressed',k===i))
 const lg=r.img?`<img src="${r.img}" alt="">`:IG
 card.innerHTML=`${r.img?`<img class="bgl" src="${r.img}" alt="">`:''}<div class="in"><div class="to">${r.role}</div><div class="who"><span class="lg">${lg}</span><div><h3>${r.n}</h3><div class="h">${r.h}</div></div></div><p>${o.txt}</p><a href="${r.u}" target="_blank" rel="noopener">${IG} Escribir a ${r.h}</a></div>`}
;[...chips.children].forEach((b,i)=>b.onclick=()=>pick(i));pick(0)
</script>
</body></html>
