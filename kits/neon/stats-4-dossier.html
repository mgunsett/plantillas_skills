<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Estadísticas 4 · Dossier</title>
<link rel="stylesheet" href="base.css">
<style>
.lead{font-size:clamp(22px,2.4vw,36px);line-height:1.3;font-weight:300;max-width:34ch;color:#d6dccd}
.lead b{color:var(--bone);font-weight:700}
.lead em{font-style:normal;color:var(--lime);font-weight:700}
.grid{display:grid;grid-template-columns:1.25fr 1fr;gap:64px;align-items:start}
.lead{margin-top:56px}
.nums{display:grid;grid-template-columns:repeat(3,1fr);border-top:2px solid var(--lime)}
.nums div{padding:22px 0 26px;border-bottom:1px solid var(--line)}
.nums div:nth-child(3n+2),.nums div:nth-child(3n){padding-left:24px;border-left:1px solid var(--line)}
.nums b{display:block;font-size:clamp(46px,4.6vw,80px);font-weight:700;line-height:.85;letter-spacing:-.02em}
.nums small{display:block;margin-top:10px;font-size:11px;letter-spacing:.22em;color:var(--gray);text-transform:uppercase}
.nums .hl b{color:var(--mag)}
.attrs{border-top:2px solid var(--bone)}
.attrs h3{font-size:11px;letter-spacing:.26em;color:var(--gray);text-transform:uppercase;padding:14px 0 6px;font-weight:700}
.row{display:grid;grid-template-columns:28px 1fr auto;align-items:center;gap:14px;padding:13px 0;border-bottom:1px solid var(--line)}
.row i{font-style:normal;font-size:11px;color:var(--gray)}
.row span{font-size:17px;font-weight:500;position:relative}
.row span:after{content:"";position:absolute;left:0;bottom:-7px;height:2px;width:var(--w);background:var(--lime);transform-origin:left;animation:w 1s var(--ease) both}
@keyframes w{from{transform:scaleX(0)}}
.row b{font-size:26px;font-weight:700;color:var(--lime)}
.row.top b{color:var(--mag)}
@media (max-width:900px){.grid{grid-template-columns:1fr;gap:40px}.lead{margin-top:36px}.nums{grid-template-columns:repeat(2,1fr)}
 .nums div{padding-left:0!important;border-left:0!important}.nums div:nth-child(even){padding-left:18px!important;border-left:1px solid var(--line)!important}.nums b{font-size:52px}.lead{font-size:21px}}
</style></head><body>
<section class="sec" id="estadisticas">
  <div class="sh"><div class="k">Temporada {{seasonLabel}}</div><h2>Estadísticas</h2></div>
  <div class="grid">
    <div class="nums" id="nums"></div>
    <div class="attrs"><h3>Atributos, de mayor a menor</h3><div id="rows"></div></div>
  </div>
  <p class="lead"><b>{{position}}</b> de pie <b style="text-transform:lowercase">{{foot}}</b>, {{height}} m y {{weight}} kg. Nació en <b>{{birthPlace}}</b> hace {{age}} años y {{dossierLead}} <em>{{club}}</em>.</p>
</section>
<script src="player.js"></script><script src="kit.js"></script><script src="bind.js"></script><script>
const A=[...ATTRS].sort((a,b)=>b[1]-a[1])
nums.innerHTML=SEASON_ORDER(['pj','pases','val','goles','tiros','min']).map(s=>`<div${s.hl?' class="hl"':''}><b class="tab">${s.v}</b><small>${s.l}</small></div>`).join('')
document.getElementById('rows').innerHTML=A.map(([l,v],i)=>`<div class="row${i?'':' top'}"><i>${String(i+1).padStart(2,'0')}</i><span style="--w:${v}%">${l}</span><b class="tab">${v}</b></div>`).join('')
</script>
</body></html>
