<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Footer 3 · Firma</title>
<link rel="stylesheet" href="base.css">
<style>
footer{background:#090806;padding:56px 60px 0;overflow:hidden;position:relative}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:24px;flex-wrap:wrap}
.top p{font-size:clamp(22px,2.4vw,34px);font-weight:700;text-transform:uppercase;line-height:1.05;max-width:20ch}
.top p em{font-style:normal;color:var(--lime)}
.id{display:flex;align-items:center;gap:18px}.id img{width:clamp(52px,4.6vw,68px);height:clamp(52px,4.6vw,68px);object-fit:contain}
.up{display:flex;align-items:center;gap:12px;font-size:12px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--lime);background:none;border:0;cursor:pointer}
.up i{font-style:normal;width:54px;height:54px;border-radius:50%;border:1.5px solid var(--lime);display:grid;place-items:center;font-size:20px;transition:transform .35s var(--ease),background .35s var(--ease),color .35s var(--ease)}
.lk{display:flex;gap:26px;margin-top:30px;flex-wrap:wrap}
.lk a{color:#fff;font-size:12px;letter-spacing:.18em;text-transform:uppercase;text-decoration:none;border-bottom:1px solid var(--line);padding-bottom:4px}
.word{font-weight:700;font-size:23.5vw;line-height:.74;letter-spacing:-.02em;color:var(--lime);text-transform:uppercase;margin:44px -.04em 0;white-space:nowrap;user-select:none;transform:translateY(8%)}
.word span{color:transparent;-webkit-text-stroke:2px var(--lime)}
.bar{position:relative;z-index:1;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:18px 0 22px;border-top:1px solid #0F0D0A;margin:0 -60px;padding-left:60px;padding-right:60px;background:#090806;color:var(--gray);border-top:2px solid var(--lime)}
.bar .cp{font-size:12px;letter-spacing:.12em;text-transform:uppercase}

a:focus-visible,.up:focus-visible{outline:2px solid var(--mag);outline-offset:3px}
@media (hover:hover) and (pointer:fine){.up:hover i{transform:translateY(-4px);background:#090806;color:var(--gray);border-top:2px solid var(--lime)}}
@media (max-width:820px){footer{padding:44px 20px 0}.bar{margin:0 -20px;padding:16px 20px 20px;flex-direction:column}.lk{gap:18px}.word{margin-top:32px}}
</style></head><body>
<div class="pre">· fin de contacto ·</div>
<footer>
  <div class="top"><div class="id"><img src="{{clubs.0.l}}" alt="Escudo de {{club}}"><p>{{position}}<br><em>{{club}}</em></p></div><button class="up" id="up">Volver arriba <i aria-hidden="true">↑</i></button></div>
  <div class="lk" id="lk"></div>
  <div class="word" id="word" aria-hidden="true"></div>
  <div class="bar"><span class="cp">© {{year}} {{full}} · Todos los derechos reservados</span><span id="dev"></span></div>
</footer>

<script src="player.js"></script><script src="kit.js"></script><script src="bind.js"></script><script>
lk.innerHTML=CONTACT.social.map(s=>`<a href="${s.u}" target="_blank" rel="noopener">${s.l} ↗</a>`).join('')+CONTACT.reps.map(r=>`<a href="${r.u}" target="_blank" rel="noopener">${r.n} ↗</a>`).join('')
const L=P.last;word.innerHTML=L.slice(0,-2)+'<span>'+L.slice(-2)+'</span>';word.style.fontSize=(164.5/L.length)+'vw'
up.onclick=()=>scrollTo({top:0,behavior:'smooth'});dev.outerHTML=DEV
</script>
</body></html>
