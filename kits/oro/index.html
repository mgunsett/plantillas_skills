<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Comparador kit oro</title>
<!-- Comparador del kit oro: elegís sección y opción, y se ve en desktop 1440 y mobile 390 (en Navbar, también con el menú abierto).
     Se abre directo (doble clic) o publicando la salida de empaquetar.mjs junto con este archivo. -->
<style>
@font-face{font-family:Nippo;font-weight:700;src:url(fonts/Nippo-Bold.woff2) format('woff2')}
:root{--bg:#F6F1E6;--panel:#FFFDF8;--line:#E2D6BC;--fg:#1A1712;--muted:#6E6452;--acc:#8A6A1F;--acc2:#B4482F;--display:Nippo,'Arial Narrow',system-ui,sans-serif;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F0D0A;--panel:#1A1712;--line:#3A3324;--fg:#F4EDE0;--muted:#A39A86;--acc:#D6AE4E;--acc2:#D2603F;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0F0D0A;--panel:#1A1712;--line:#3A3324;--fg:#F4EDE0;--muted:#A39A86;--acc:#D6AE4E;--acc2:#D2603F;color-scheme:dark}
*,*:before,*:after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,'Segoe UI',sans-serif}
.wrap{max-width:1560px;margin:0 auto;padding:28px 16px 48px}
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px}
.k{font:700 11px/1.2 var(--display);letter-spacing:.24em;text-transform:uppercase;color:var(--muted)}
h1{font:700 clamp(30px,4vw,48px)/1 var(--display);text-transform:uppercase;margin-top:8px;color:var(--acc)}h1 span{color:var(--acc2)}
.tabs,.secs{display:flex;flex-wrap:wrap;gap:8px}
.tabs button,.secs button{font:700 12px/1 var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);background:var(--panel);border:1px solid var(--line);padding:12px 16px;border-radius:999px;cursor:pointer}
.tabs button b{color:var(--acc2);margin-right:8px}
.tabs button[aria-selected="true"]{background:var(--acc);color:var(--bg);border-color:var(--acc)}.tabs button[aria-selected="true"] b{color:var(--bg)}
.secs button[aria-selected="true"]{background:var(--acc2);color:#fff;border-color:var(--acc2)}
button:focus-visible,a:focus-visible{outline:2px solid var(--acc2);outline-offset:2px}
#tabs{margin-bottom:20px}
.stage{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:20px;align-items:start}
.stage.three{grid-template-columns:minmax(0,1fr) 240px 240px}
.dev{min-width:0}.dev .lbl{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:8px}
.frame{position:relative;width:100%;overflow:hidden;border:1px solid var(--line);border-radius:10px;background:#000}
.frame.d{aspect-ratio:1440/900}.frame.m{aspect-ratio:390/844;border-radius:26px;border-width:6px;border-color:#2A251C}
.frame iframe{position:absolute;top:0;left:0;border:0;transform-origin:0 0}
#mo{display:none}.three #mo{display:block}
.info{margin-top:22px;border-top:1px solid var(--line);padding-top:22px;display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:28px}
.info h2{font:700 28px/1 var(--display);text-transform:uppercase;color:var(--acc);margin-top:8px}
.info p{color:var(--muted);line-height:1.6;margin-top:10px;max-width:72ch}
.info ul{margin-top:10px;padding-left:18px;color:var(--muted);line-height:1.6}
.note{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;font-size:14px;line-height:1.55;color:var(--muted)}
.note b{color:var(--fg)}
a.open{color:var(--acc2);font:700 11px/1 var(--display);letter-spacing:.14em;text-transform:uppercase;text-decoration:none}
@media (max-width:1000px){.stage,.stage.three{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.dev.d{grid-column:1/-1}.stage:not(.three) .dev.m{grid-column:1/-1;max-width:300px;margin:0 auto;width:100%}.info{grid-template-columns:1fr}}
</style></head><body>
<div class="wrap">
  <header class="top" style="align-items:flex-start"><div><div class="k">{{full}} · rediseño · kit oro</div><h1><span id="h1s">Navbar</span> · <span id="cnt" style="color:inherit"></span> opciones</h1></div><div class="secs" role="tablist" id="secs" aria-label="Sección"></div></header>
  <div class="tabs" role="tablist" id="tabs" aria-label="Opción"></div>
  <div class="stage" id="stage">
    <div class="dev d"><div class="lbl"><span class="k">Desktop 1440</span><a class="open" id="openD" target="_blank">Abrir completo ↗</a></div><div class="frame d"><iframe id="fd" title="Vista desktop" width="1440" height="900"></iframe></div></div>
    <div class="dev m"><div class="lbl"><span class="k">Mobile 390</span></div><div class="frame m"><iframe id="fm" title="Vista mobile" width="390" height="844"></iframe></div></div>
    <div class="dev m" id="mo"><div class="lbl"><span class="k">Menú abierto</span></div><div class="frame m"><iframe id="fo" title="Vista mobile con el menú abierto" width="390" height="844"></iframe></div></div>
  </div>
  <section class="info" aria-live="polite"><div><div class="k" id="iNum"></div><h2 id="iTitle"></h2><p id="iDesc"></p><ul id="iList"></ul></div>
    <div class="note" id="note"></div></section>
</div>
<script>
const SW='<div style="display:flex;gap:6px;margin:10px 0 12px">'+[['#0F0D0A','Fondo'],['#1A1712','Superficie'],['#D6AE4E','Oro'],['#D2603F','Terracota'],['#F4EDE0','Hueso'],['#A39A86','Gris']].map(([c,n])=>'<span title="'+n+' '+c+'" style="flex:1;height:34px;border-radius:6px;background:'+c+';border:1px solid var(--line)"></span>').join('')+'</div>'
const NOTE={_:'<b>Paleta "Oro y piedra inca".</b>'+SW+'Negro cálido, oro del Cusco FC y terracota para los números destacados. <b>Datos reales de Nicolás:</b> clubes, videos, fotos, contactos y números salen de su landing actual; en React la temporada sigue llegando de API-Football.',
 navbar:'<b>Probalo con scroll.</b> Abrí cada opción completa: abajo del hero hay secciones de relleno para ver el estado al bajar y cómo marca la sección activa. La tercera vista muestra el menú mobile abierto.',
 hero:'<b>Partidos de ejemplo.</b> El último resultado y el próximo partido son de prueba: en la landing salen del panel <b>/admin</b>, como hoy. Falta una foto de cancha horizontal en alta: con una, se suma la opción Transmisión TV.',
 prensa:'<b>Notas de ejemplo.</b> La landing actual no tiene prensa. Si querés la sección, pasame 3 o 4 notas (medio, titular, fecha y link); los logos de ESPN, Infobae y Libertadores ya están.'}
const SECS={
 navbar:['Navbar',[
  ['navbar-1-capsula','Cápsula con dorsal','Cápsula flotante centrada arriba: el 26 en un círculo dorado con el apellido, los links con una píldora que se desliza hasta la sección activa y Contacto en terracota.',['Se esconde al bajar y vuelve al subir.','Mobile: el menú es una hoja que sube desde abajo.']],
  ['navbar-2-escudo','Escudo al centro','Barra a todo el ancho con el escudo de Cusco y el nombre al centro, y los links repartidos a los lados. Transparente sobre el hero; al bajar se vuelve oscura con una línea dorada y terracota.',['Mobile: cajón lateral con los links grandes y el dorsal de fondo.']],
  ['navbar-3-riel','Riel lateral','Riel vertical fijo a la izquierda con las iniciales, el dorsal, un índice 01 a 06 (el activo se estira y muestra el nombre), Instagram y bandera.',['Deja libre todo el ancho para el hero.','Mobile: cabecera mínima arriba y barra de secciones abajo, tipo app.']],
  ['navbar-4-zocalo','Zócalo de partido','Franja dorada arriba con el último resultado, el próximo partido y la temporada corriendo; debajo la barra con dorsal, nombre, posición y club.',['Al bajar la franja se esconde.','Mobile: el menú trae los links en grilla y una tarjeta con los dos partidos.']],
  ['navbar-5-indice','Índice a pantalla completa','Barra mínima (NS + 26, Contacto y MENÚ). El menú abre a pantalla completa con los links gigantes numerados y el retrato con la cinta de capitán.',['Abajo de los links, Moon Sports, LED Sports e Instagram.']]]],
 hero:['Hero',[
  ['hero-1-dorsal','Dorsal gigante','El 26 en contorno ocupa toda la altura y Nicolás aparece de espaldas con los brazos en alto y el mismo número. Nombre abajo a la izquierda y ficha a la derecha (club, nacionalidad, temporada).',['Aprovecha el recorte de espaldas que ya tenés.']],
  ['hero-2-split','Split editorial','Texto, bio corta, 4 datos y dos botones a la izquierda; a la derecha un panel dorado en diagonal con el recorte saliendo de él.',['El más comercial: deja claro quién es y a quién escribirle.']],
  ['hero-3-marquesina','Marquesina','Bandas inclinadas con SILVA y la posición que corren en sentidos opuestos detrás del recorte, y un zócalo de partidos abajo.',['Reemplaza a la pestaña Partidos actual.']],
  ['hero-4-portada','Portada de revista','Como la tapa de una revista: cabecera "Edición 2026 · N.º 26", una frase en terracota, el nombre enorme y tres titulares con números; a la derecha el retrato con la cinta de capitán.',['Más de marca personal que de ficha.']],
  ['hero-5-split-ficha','Split con ficha','Píldora con el dorsal y la posición, apellido gigante, club y nacionalidad con escudo y bandera, 4 números grandes y botones. Abajo a la derecha la tarjeta de partidos; a la derecha el panel con el 26 en contorno y el recorte.'],
  ['hero-6-muro','Muro inca (nuevo)','Diseñado para Nicolás: un muro de piedras encajadas, como los de Cusco, se arma piedra por piedra detrás del recorte. Una sola piedra es dorada, la de los 12 ángulos, con el 26 tallado. A la izquierda, Cusco · 3.399 m s. n. m., el apellido grande, tres números de la temporada y los botones.',['El más ligado a la ciudad y al club: nadie más puede tener este hero.','Mobile: el muro y la piedra dorada quedan arriba, detrás del recorte, y el texto abajo.']],
  ['hero-7-cromo','Cromo dorado (nuevo)','Diseñado para Nicolás: el jugador como una figurita de colección con borde de foil dorado, la media (84), el 26, escudo, bandera y los 6 atributos. En desktop la carta se inclina siguiendo el mouse, con inercia, y el brillo del foil acompaña. A la izquierda, nombre, bio, botones y la tarjeta de partidos.',['Probalo moviendo el mouse sobre la carta en "Abrir completo".','Mobile: la carta queda arriba, quieta, y el texto abajo.']],
  ['hero-8-capas','Split en capas (nuevo)','Split con una escena en profundidad a la derecha: atrás, el 26 enorme relleno con una foto de cancha en tono dorado y un segundo 26 en contorno corrido; adelante, el recorte. A la izquierda, nombre, bio, su atributo más alto (Velocidad 94) en una barra segmentada, 3 números y botones.',['El número entra con una escala suave y la barra se enciende segmento por segmento.','Mobile: la escena arriba y el texto abajo.']]]],
 stats:['Estadísticas',[
  ['stats-1-marcador','Marcador','Los 60 partidos en un bloque gigante y el resto de la temporada en un tablero. Debajo, la ficha en una fila y los atributos en barras segmentadas.'],
  ['stats-2-ficha','Ficha de scouting','Informe en tres paneles: perfil, cancha con la zona de influencia (extremo derecho) y atributos en barras con la velocidad resaltada. Abajo, la temporada en 6 números.'],
  ['stats-3-radar','Radar central','Los 6 atributos en un radar con la media en el centro, rodeado por los números de la temporada. Al pie, la ficha en una franja.',['Es lo más parecido a la sección actual, pero más limpio.']],
  ['stats-4-dossier','Dossier','Estilo revista: la temporada en una grilla tipográfica, los atributos en un ranking de mayor a menor y una frase de presentación al pie.'],
  ['stats-5-odometro','Odómetro','La sección se queda fija mientras scrolleás y cada tramo cambia de número: los dígitos giran como un odómetro, con una lectura que cruza los datos.',['Probalo con scroll en "Abrir completo".']]]],
 clubes:['Clubes',[
  ['clubes-1-linea','Línea de tiempo','Los 11 clubes del debut en Las Parejas a Cusco sobre una línea que se ilumina hacia el presente. Cada parada con escudo, años, país y vínculo.'],
  ['clubes-2-grilla','Grilla de escudos','Una baldosa por club con el escudo en gris de fondo. Cusco en dorado y una baldosa final con clubes, países y títulos.',['Buena para carreras largas como la suya.']],
  ['clubes-3-planilla','Planilla','Tabla tipo ficha de transferencias: temporada, club, país, vínculo y títulos (Serie A 2022 con Aucas). El club actual marcado con una barra.'],
  ['clubes-4-escalera','Escalera','Cada club es un escalón que sube del debut al club actual, con el año en contorno. Cusco arriba de todo, en dorado.'],
  ['clubes-5-pasaporte','Pasaporte','La carrera como un pasaporte abierto: hoja de datos con foto, nacionalidad, posición, clubes y países, y un sello por club estampado al entrar en pantalla.',['Argentina, Ecuador y Perú: tres países le dan sentido a los sellos.']]]],
 videos:['Videos',[
  ['videos-1-programa','Programa','Un reel grande y, al lado, título, club y la lista "Más videos" para cambiarlo. Para pocos videos como hoy (3).'],
  ['videos-2-stories','Stories','Los reels como historias de Instagram, con barras de progreso y avance automático.'],
  ['videos-3-temporadas','Temporadas','Cada video bajo su año gigante en contorno con el escudo del club.',['Luce más con videos de distintos años o clubes.']],
  ['videos-4-paneles','Paneles','Paneles a todo el ancho: el activo se abre grande a color y los otros quedan finos en blanco y negro.'],
  ['videos-5-mazo','Mazo de reels','Los reels apilados como cartas 9:16 que se arrastran o deslizan; al costado, el título cambia con la carta.',['Pensado para el celular.']]]],
 galeria:['Galería',[
  ['galeria-1-mosaico','Mosaico con pestañas','Grilla con una foto grande cada cinco, filtros Cusco FC y Entrenamiento, "Ver más fotos" sin huecos y visor a pantalla completa.'],
  ['galeria-2-carriles','Carriles','Dos filas de fotos que corren solas en sentidos opuestos. Se frenan al pasar el mouse y cualquier foto se abre grande.'],
  ['galeria-3-album','Álbum editorial','Una foto destacada y cuatro al costado; "Siguientes" pasa de a cinco y "Ver todas" abre el visor.'],
  ['galeria-4-hoja','Hoja de contactos','Visor grande con la foto completa y una tira de película numerada en blanco y negro.']]],
 prensa:['Prensa',[
  ['prensa-1-titulares','Titulares','Un renglón por nota: logo del medio, fecha y titular grande. El renglón se pinta al pasar el mouse.'],
  ['prensa-2-recortes','Recortes','Cada nota como un recorte de diario pegado con cinta, levemente torcido.'],
  ['prensa-3-destacada','Nota destacada','La nota más importante grande con una foto de fondo y las otras al costado.'],
  ['prensa-4-publicaron','Lo publicaron','Franja con los logos de los medios y, debajo, los titulares como citas.']]],
 contacto:['Contacto',[
  ['contacto-1-directorio','Directorio','Título a la izquierda y un renglón por contacto: Moon Sports, LED Sports e Instagram, con para qué escribirle a cada uno.'],
  ['contacto-2-cierre','Cierre con foto','Media pantalla con una foto y del otro lado "¿Jugamos juntos?" con las agencias y un botón grande a Instagram.'],
  ['contacto-3-motivo','¿Para qué escribís?','El visitante elige si es de un club, una marca o prensa/fan, y la tarjeta le muestra a quién escribirle.'],
  ['contacto-4-tarjetas','Tarjetas grandes','Cuatro tarjetas 2x2 (Instagram, Transfermarkt, representante en dorado y marketing) con el logo en gris de fondo.',['La más parecida a la actual, más grande y clara.']]]],
 footer:['Footer',[
  ['footer-1-pulido','Pulido','Una sola línea: logo, redes, derechos y el crédito de desarrollo.'],
  ['footer-2-navegacion','Con navegación','Columnas con logo y bajada, secciones, contactos y redes.'],
  ['footer-3-firma','Firma','Escudo, posición y club, links, Volver arriba y SILVA gigante a todo el ancho.'],
  ['footer-4-escudos','Escudos','Franja con los escudos de todos sus clubes en gris (Cusco a color) y debajo logo, derechos, crédito y Volver arriba.']]],
}
const ORDER=Object.keys(SECS),tabs=document.getElementById('tabs'),secs=document.getElementById('secs'),stage=document.getElementById('stage')
let sec='navbar',cur={};try{const v=JSON.parse(localStorage.getItem('kitOro')||'{}');if(SECS[v.sec])sec=v.sec;cur=v.cur||{}}catch(e){}
ORDER.forEach(k=>{const b=document.createElement('button');b.setAttribute('role','tab');b.textContent=SECS[k][0];b.onclick=()=>pickSec(k);secs.appendChild(b)})
function pickSec(k){sec=k;[...secs.children].forEach((b,j)=>b.setAttribute('aria-selected',ORDER[j]===k));h1s.textContent=SECS[k][0];cnt.textContent=SECS[k][1].length
 stage.classList.toggle('three',k==='navbar');note.innerHTML=NOTE[k]||NOTE._
 tabs.innerHTML='';SECS[k][1].forEach((o,i)=>{const b=document.createElement('button');b.setAttribute('role','tab');b.innerHTML='<b>'+(i+1)+'</b>'+o[1];b.onclick=()=>sel(i);tabs.appendChild(b)});sel(cur[k]||0)}
function sel(i){cur[sec]=i;try{localStorage.setItem('kitOro',JSON.stringify({sec,cur}))}catch(e){}const [f,t,d,l]=SECS[sec][1][i]
 ;[...tabs.children].forEach((b,j)=>b.setAttribute('aria-selected',j===i));fd.src=fm.src=openD.href=f+'.html';fo.src=sec==='navbar'?f+'.html#open':'about:blank'
 iNum.textContent=SECS[sec][0]+' · opción '+(i+1);iTitle.textContent=t;iDesc.textContent=d;iList.innerHTML=(l||[]).map(x=>'<li>'+x+'</li>').join('');fit()}
function fit(){[[fd,1440],[fm,390],[fo,390]].forEach(([f,w])=>{const c=f.parentElement.clientWidth;if(c)f.style.transform='scale('+(c/w)+')'})}
new ResizeObserver(fit).observe(stage);pickSec(sec)
</script>
<script src="player.js"></script><script src="bind.js"></script>
</body></html>
