<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Navbar 1 · Cápsula con dorsal</title>
<link rel="stylesheet" href="base.css">
<style>
.cap{position:fixed;top:18px;left:50%;z-index:60;transform:translateX(-50%);transition:transform .5s var(--ease);
  display:flex;align-items:center;gap:6px;padding:6px 6px 6px 6px;border-radius:999px;background:#1a1712d9;border:1px solid var(--line);
  backdrop-filter:blur(14px) saturate(160%);-webkit-backdrop-filter:blur(14px) saturate(160%);box-shadow:0 10px 40px #07060522}
.cap.hide{transform:translate(-50%,-140%)}
.id{display:flex;align-items:center;gap:10px;padding-right:14px;text-decoration:none}
.id .n{width:40px;height:40px;border-radius:50%;background:var(--acc);color:var(--on-acc);display:grid;place-items:center;font-weight:700;font-size:18px;position:relative}
.id .n:after{content:"";position:absolute;right:-1px;bottom:-1px;width:12px;height:12px;border-radius:50%;background:var(--acc2);border:2px solid #fff}
.id b{font-weight:700;font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--acc)}
.id b span{color:var(--gray);font-weight:400}
.lk{position:relative;display:flex}
.lk a{position:relative;z-index:1;padding:11px 16px;font-size:11px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;text-decoration:none;color:var(--gray);transition:color .3s}
.lk a[aria-current]{color:var(--on-acc)}
.lk .pill{position:absolute;top:0;left:0;height:100%;border-radius:999px;background:var(--acc);transition:transform .5s var(--ease),width .5s var(--ease);z-index:0}
.lk a[href="#hero"]{display:none}
.cta{margin-left:4px;padding:12px 18px;border-radius:999px;background:var(--acc2);color:#fff;font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;text-decoration:none}
@media (hover:hover) and (pointer:fine){.lk a:not([aria-current]):hover{color:var(--acc)}.cta{transition:transform .25s var(--ease)}.cta:hover{transform:translateY(-1px)}}
.burger{display:none;width:44px;height:44px;border-radius:50%;background:var(--acc);position:relative}
.burger i{position:absolute;left:14px;right:14px;height:2px;background:#fff;transition:transform .4s var(--ease),opacity .3s}
.burger i:nth-child(1){top:17px}.burger i:nth-child(2){top:25px}
.burger[aria-expanded=true] i:nth-child(1){transform:translateY(4px) rotate(45deg)}.burger[aria-expanded=true] i:nth-child(2){transform:translateY(-4px) rotate(-45deg)}
/* Hoja inferior (mobile) */
.scrim{position:fixed;inset:0;z-index:55;background:#07060566;opacity:0;pointer-events:none;transition:opacity .4s}
.sheet{position:fixed;left:10px;right:10px;bottom:10px;z-index:58;background:var(--bg2);border-radius:24px;padding:10px 10px 14px;transform:translateY(110%);transition:transform .55s var(--ease);box-shadow:0 -10px 50px #07060533}
.open .scrim{opacity:1;pointer-events:auto}.open .sheet{transform:none}
.sheet .grab{width:44px;height:4px;border-radius:4px;background:var(--line);margin:4px auto 10px}
.sheet a.l{display:flex;align-items:baseline;gap:14px;padding:13px 14px;border-radius:14px;text-decoration:none;font-weight:700;font-size:26px;text-transform:uppercase;color:var(--acc)}
.sheet a.l small{font-size:11px;color:var(--acc2);letter-spacing:.1em;font-weight:500}
.sheet a.l[aria-current]{background:var(--acc-l)}
.sheet .row{display:flex;gap:8px;margin-top:8px}
.sheet .row a{flex:1;text-align:center;padding:14px;border-radius:999px;font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;text-decoration:none;background:var(--acc);color:var(--on-acc)}
.sheet .row a+a{background:var(--acc-l);color:var(--acc)}
@media (max-width:980px){
  .cap{left:12px;right:12px;transform:none;justify-content:space-between;padding:6px 6px 6px 6px}.cap.hide{transform:translateY(-140%)}
  .lk,.cta{display:none}.burger{display:block}
}
</style></head><body>
<nav class="cap" id="cap" aria-label="Principal">
  <a class="id" href="#hero"><span class="n">{{number}}</span><b>{{last}} <span>· {{positionShort}}</span></b></a>
  <div class="lk" id="lk"><span class="pill" id="pill"></span></div>
  <a class="cta" href="#contact">Contacto</a>
  <button class="burger" id="bg" aria-label="Abrir menú" aria-expanded="false" aria-controls="sheet"><i></i><i></i></button>
</nav>
<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-label="Menú"><div class="grab"></div><div id="sl"></div>
  <div class="row"><a href="#contact">Contacto</a><a href="{{instagram.u}}" target="_blank" rel="noopener">{{instagram.h}}</a></div></div>
<main id="demo"></main>
<script src="player.js"></script><script src="kit.js"></script><script src="demo.js"></script><script src="navkit.js"></script>
<script>
const lk=document.getElementById('lk'),pill=document.getElementById('pill'),cap=document.getElementById('cap'),bg=document.getElementById('bg')
lk.insertAdjacentHTML('beforeend',NAVL.filter(([,h])=>h!=='#contact').map(([l,h])=>`<a href="${h}">${l}</a>`).join(''))
NK.links(document.getElementById('sl'),(l,h,i)=>`<a class="l" href="${h}"><small>0${i+1}</small>${l}</a>`)
function mark(h){document.querySelectorAll('nav a,.sheet a.l').forEach(a=>a.getAttribute('href')===h?a.setAttribute('aria-current','true'):a.removeAttribute('aria-current'))
  const a=lk.querySelector(`a[href="${h}"]`);if(a&&a.offsetParent){pill.style.opacity=1;pill.style.width=a.offsetWidth+'px';pill.style.transform=`translateX(${a.offsetLeft}px)`}else pill.style.opacity=0}
NK.spy(mark)
NK.scroll((y,down)=>cap.classList.toggle('hide',down&&y>400&&!document.body.classList.contains('open')))
function tog(v){document.body.classList.toggle('open',v);bg.setAttribute('aria-expanded',v)}
bg.onclick=()=>tog(!document.body.classList.contains('open'));document.getElementById('scrim').onclick=()=>tog(false)
document.addEventListener('click',e=>{if(e.target.closest('a[href^="#"]')){tog(false);NK.go(e)}})
addEventListener('keydown',e=>e.key==='Escape'&&tog(false))
NK.autoOpen(()=>tog(true))
</script>
<script src="bind.js"></script>
</body></html>
