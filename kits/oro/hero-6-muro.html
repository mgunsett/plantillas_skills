<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hero 6 · Muro inca</title>
<link rel="stylesheet" href="base.css">
<style>
/* Muro inca: un paramento de piedras encajadas (como los muros de Cusco) se arma piedra por piedra detrás del recorte.
   Una sola piedra es dorada, la "piedra de los 12 ángulos", y lleva el dorsal tallado. */
.hero{position:relative;height:calc(100 * var(--sv));min-height:600px;overflow:hidden;background:#090806}
.wall{position:absolute;inset:0;width:100%;height:100%;z-index:0}
.wall .st{opacity:0;transform:translateY(14px);transform-box:fill-box;transform-origin:center;animation:st .9s var(--ease) both;animation-delay:calc(var(--d) * 1ms)}
@keyframes st{to{opacity:1;transform:none}}
.wall .key{animation-duration:1.2s}
.wall.done .st{animation:none;opacity:1;transform:none} /* al redimensionar no se vuelve a armar */
.veil{position:absolute;inset:0;z-index:1;pointer-events:none;
  background:linear-gradient(90deg,#090806f2 0%,#090806d9 30%,#09080633 58%,#09080600 70%),linear-gradient(0deg,#090806 0%,#09080600 34%)}
.player{position:absolute;right:16%;bottom:0;height:90%;z-index:3;filter:drop-shadow(0 30px 50px #000c);animation:pl 1.3s var(--ease) .55s both}
@keyframes pl{from{opacity:0;transform:translateY(6%)}}
.txt{position:absolute;left:60px;top:50%;transform:translateY(-46%);z-index:5;max-width:600px}
.alt{display:flex;align-items:center;gap:14px;font-size:11px;font-weight:700;letter-spacing:.3em;text-transform:uppercase;color:var(--gray)}
.alt b{color:var(--mag)}
.alt i{flex:0 0 36px;height:1px;background:var(--mag)}
h1{margin-top:22px;text-transform:uppercase;font-weight:700;line-height:.84}
h1 .n1{display:block;font-size:clamp(26px,2.6vw,42px);letter-spacing:.12em;color:var(--bone)}
h1 .n2{display:block;font-size:clamp(88px,11vw,190px);letter-spacing:-.01em;color:var(--lime);
  text-shadow:0 1px 0 #f5d98a,0 -2px 0 #5a4517,0 18px 40px #000}
.pos{margin-top:18px;font-size:14px;letter-spacing:.24em;text-transform:uppercase;color:var(--bone)}
.pos span{color:var(--gray)}
.stats{margin-top:34px;display:flex;gap:0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.stats div{padding:14px 26px 14px 0;margin-right:26px;border-right:1px solid var(--line)}
.stats div:last-child{border-right:0;margin-right:0}
.stats b{display:block;font-size:34px;font-weight:700;color:var(--bone);font-variant-numeric:tabular-nums}
.stats small{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--gray)}
.stats .hl b{color:var(--mag)}
.cta{margin-top:30px;display:flex;gap:12px;flex-wrap:wrap}
.btn{font-size:11px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;text-decoration:none;padding:15px 22px;border-radius:2px;border:1.5px solid var(--lime);color:var(--lime);transition:transform .16s ease-out,background-color .2s ease,color .2s ease}
.btn.solid{background:var(--lime);color:var(--on-acc)}
.btn:active{transform:scale(.97)}
@media (hover:hover) and (pointer:fine){.btn:hover{background:var(--lime);color:var(--on-acc)}.btn.solid:hover{background:transparent;color:var(--lime)}}
.club{position:absolute;right:60px;bottom:40px;z-index:5;display:flex;align-items:center;gap:12px;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--gray)}
.club img{width:38px;height:38px;object-fit:contain}
.club strong{display:block;color:var(--bone);font-size:13px}
@media (max-width:820px){
  .player{right:auto;left:50%;transform:translateX(-50%);height:47%;bottom:auto;top:7%;animation-name:plm}
  @keyframes plm{from{opacity:0;transform:translate(-50%,6%)}}
  .veil{background:linear-gradient(0deg,#090806 0%,#090806f5 42%,#09080600 64%),linear-gradient(180deg,#090806aa,#09080600 18%)}
  .txt{left:20px;right:20px;top:auto;bottom:28px;transform:none}
  h1{margin-top:12px}
  h1 .n2{font-size:25vw}
  .pos{font-size:11px;margin-top:10px}
  .stats{margin-top:18px}.stats div{padding:10px 14px 10px 0;margin-right:14px}.stats b{font-size:24px}.stats small{font-size:9px;letter-spacing:.14em}
  .cta{margin-top:18px}.btn{flex:1;text-align:center;padding:14px 10px}
  .club{display:none}
}
</style></head><body>
<header class="nav"><div class="links"><a>Inicio</a><a>Estadísticas</a></div><div class="logo">{{initials}}<span>_</span></div><div class="links"><a>Videos</a><a>Galería</a><a class="cta">Contacto</a></div><div class="burger"></div></header>
<section class="hero" id="hero">
  <svg class="wall" id="wall" aria-hidden="true"></svg>
  <div class="veil"></div>
  <img class="player" src="{{photos.heroFront}}" alt="{{alts.heroFront}}" fetchpriority="high">
  <div class="txt">
    <div class="alt rv" style="animation-delay:.9s"><i></i><span>{{homeCity}} · <b>{{homeAltitude}} m</b> s. n. m.</span></div>
    <h1><span class="n1 rv" style="animation-delay:1s">{{first}}</span><span class="n2 rv" style="animation-delay:1.08s">{{last}}</span></h1>
    <p class="pos rv" style="animation-delay:1.16s">{{position}} <span>· #{{number}} · {{club}}</span></p>
    <div class="stats rv" id="stats" style="animation-delay:1.24s"></div>
    <div class="cta rv" style="animation-delay:1.32s"><a class="btn solid" href="#videos">Ver jugadas</a><a class="btn" href="#contact">Contacto</a></div>
  </div>
  <div class="club rv" style="animation-delay:1.3s"><img src="{{crest}}" alt=""><span><strong>{{club}}</strong>{{league}}</span></div>
</section>
<script src="player.js"></script><script src="kit.js"></script><script src="bind.js"></script><script>
// Temporada: 3 cifras, la destacada (hl) en terracota
document.getElementById('stats').innerHTML=SEASON_ORDER(['pj','asis','val']).slice(0,3).map(s=>`<div class="${s.hl?'hl':''}"><b>${s.v}</b><small>${s.l}</small></div>`).join('')

// Muro: hiladas de piedras con bordes levemente irregulares (semilla fija: siempre el mismo muro)
const svg=document.getElementById('wall'),NS='http://www.w3.org/2000/svg'
let seed=26;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647
function build(){
  const W=innerWidth,H=Math.max(innerHeight,600),mob=W<=820,G=mob?5:7
  svg.setAttribute('viewBox',`0 0 ${W} ${H}`);svg.innerHTML=''
  const defs=document.createElementNS(NS,'defs')
  defs.innerHTML=`<radialGradient id="rock" cx="40%" cy="35%" r="75%"><stop offset="0" stop-color="#3a3125"/><stop offset=".7" stop-color="#211c15"/><stop offset="1" stop-color="#110f0b"/></radialGradient>
  <radialGradient id="gold" cx="38%" cy="30%" r="80%"><stop offset="0" stop-color="#f0cf78"/><stop offset=".55" stop-color="#d6ae4e"/><stop offset="1" stop-color="#7d5f22"/></radialGradient>`
  svg.appendChild(defs)
  // Piedra clave (12 ángulos) detrás del recorte
  const kx=mob?W*.5:W*.6,ky=mob?H*.27:H*.42,kr=mob?Math.min(W*.4,180):Math.min(H*.3,280)
  seed=26;let y=-10,row=0
  while(y<H){
    const h=(mob?56:78)+rnd()*(mob?36:56);let x=-rnd()*80
    while(x<W){
      const w=(mob?70:110)+rnd()*(mob?90:150)
      const cx=x+w/2,cy=y+h/2
      if(Math.hypot((cx-kx)/1.1,cy-ky)>kr+40){ // sin piedras comunes encima de la clave
        const j=()=>(rnd()-.5)*(mob?8:12),x0=x+G/2,y0=y+G/2,x1=x+w-G/2,y1=y+h-G/2
        const pts=[[x0+j(),y0+j()],[cx+j(),y0+j()*.4],[x1+j(),y0+j()],[x1+j()*.4,cy+j()],[x1+j(),y1+j()],[cx+j(),y1+j()*.4],[x0+j(),y1+j()],[x0+j()*.4,cy+j()]]
        const p=document.createElementNS(NS,'polygon');p.setAttribute('points',pts.map(q=>q.map(Math.round).join(',')).join(' '))
        p.setAttribute('fill','url(#rock)');p.setAttribute('stroke','#4a3f2c');p.setAttribute('stroke-width','1');p.setAttribute('stroke-linejoin','round')
        p.setAttribute('class','st');p.style.setProperty('--d',Math.round(row*70+(cx/W)*260+rnd()*120))
        svg.appendChild(p)
      }
      x+=w
    }
    y+=h;row++
  }
  // 12 ángulos: un polígono de 12 vértices con escalones, como la piedra de Hatun Rumiyoq
  const k=[[-.78,-.62],[-.30,-.80],[-.22,-.66],[.34,-.84],[.80,-.50],[.70,-.22],[.92,.08],[.76,.62],[.12,.86],[.02,.70],[-.66,.80],[-.94,.10]]
  const key=document.createElementNS(NS,'polygon')
  key.setAttribute('points',k.map(([a,b])=>`${Math.round(kx+a*kr*1.1)},${Math.round(ky+b*kr)}`).join(' '))
  key.setAttribute('fill','url(#gold)');key.setAttribute('stroke','#f5d98a');key.setAttribute('stroke-width','1.5');key.setAttribute('stroke-linejoin','round')
  key.setAttribute('class','st key');key.style.setProperty('--d',260);svg.appendChild(key)
  const t=document.createElementNS(NS,'text');t.textContent=P.number
  t.setAttribute('x',kx-(mob?0:kr*.5));t.setAttribute('y',ky+kr*.38);t.setAttribute('text-anchor','middle')
  t.setAttribute('font-family','Nippo, sans-serif');t.setAttribute('font-weight','700');t.setAttribute('font-size',Math.round(kr*1.15))
  t.setAttribute('fill','#7d5f2255');t.setAttribute('stroke','#5a451788');t.setAttribute('stroke-width','2')
  t.setAttribute('class','st key');t.style.setProperty('--d',520);svg.appendChild(t)
}
build();setTimeout(()=>svg.classList.add('done'),2600);let rt;addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(build,150)})
</script>
</body></html>
