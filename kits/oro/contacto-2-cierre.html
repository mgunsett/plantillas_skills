<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Contacto 2 · Cierre con foto</title>
<link rel="stylesheet" href="base.css">
<style>
.sec{padding:0;min-height:calc(100 * var(--sv));display:grid;grid-template-columns:1fr 1fr}
.ph{position:relative;overflow:hidden}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 20%;filter:grayscale(.3)}
.ph:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent 55%,var(--bg))}
.bx{display:flex;flex-direction:column;justify-content:center;padding:96px 60px 96px 40px}
.big{font-weight:700;font-size:clamp(56px,7.4vw,124px);line-height:.86;text-transform:uppercase}
.big em{font-style:normal;color:var(--lime);display:block}
.lead{margin-top:22px;font-size:16px;color:#e6dcc8;line-height:1.5;max-width:40ch}
.reps{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:36px}
.reps a{display:block;background:var(--bg2);border:1px solid var(--line);padding:20px;color:#fff;text-decoration:none;transition:border-color .3s var(--ease),transform .3s var(--ease)}
.reps img{width:44px;height:44px;object-fit:contain}
.reps .r{margin-top:14px;font-size:10px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--mag)}
.reps b{display:block;margin-top:6px;font-size:17px;text-transform:uppercase;line-height:1.1}
.reps span{display:block;margin-top:10px;font-size:12px;color:var(--lime);letter-spacing:.06em}
.ig{display:inline-flex;align-items:center;gap:12px;margin-top:22px;font-size:13px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#0F0D0A;background:var(--lime);padding:16px 22px;border-radius:999px;text-decoration:none;align-self:flex-start}
.ig svg{font-size:18px}
.tm{margin-top:14px;font-size:12px;color:var(--gray);letter-spacing:.12em;text-transform:uppercase}.tm a{color:#fff}
a:focus-visible{outline:2px solid var(--mag);outline-offset:2px}
@media (hover:hover) and (pointer:fine){.reps a:hover{border-color:var(--lime);transform:translateY(-4px)}}
@media (max-width:820px){.sec{grid-template-columns:1fr;min-height:0}.ph{height:62vw;min-height:280px}.ph:after{background:linear-gradient(0deg,var(--bg),transparent 50%)}.bx{padding:0 20px 64px;margin-top:-24px;position:relative}.reps{grid-template-columns:1fr}}
</style></head><body>
<section class="sec" id="contact">
  <div class="ph"><img src="{{photos.contact}}" alt="{{alts.contact}}"></div>
  <div class="bx">
    <div class="eyebrow" style="color:var(--mag)">Contacto</div>
    <h2 class="big" style="margin-top:12px">¿Jugamos<em>juntos?</em></h2>
    <p class="lead">Clubes, marcas o prensa: escribí a quien corresponda y te responden por Instagram.</p>
    <div class="reps" id="reps"></div>
    <a class="ig" id="ig" target="_blank" rel="noopener"></a>
    <p class="tm">Ficha completa en <a id="tm" target="_blank" rel="noopener">Transfermarkt ↗</a></p>
  </div>
</section>

<script src="player.js"></script><script src="kit.js"></script><script src="bind.js"></script><script>
reps.innerHTML=CONTACT.reps.map(r=>`<a href="${r.u}" target="_blank" rel="noopener"><img src="${r.img}" alt=""><div class="r">${r.role}</div><b>${r.n}</b><span>${r.h} ↗</span></a>`).join('')
const s=CONTACT.social;ig.href=s[0].u;ig.innerHTML=IG+' Escribile a '+s[0].h;tm.href=s[1].u
</script>
</body></html>
