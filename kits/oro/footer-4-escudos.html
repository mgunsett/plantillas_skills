<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Footer 4 · Escudos</title>
<link rel="stylesheet" href="base.css">
<style>
footer{background:#090806;border-top:1px solid var(--line)}
.cr{display:flex;align-items:center;justify-content:center;gap:clamp(18px,3.4vw,56px);padding:34px 60px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.cr li{list-style:none;position:relative}
.cr img{width:clamp(36px,3.6vw,54px);height:clamp(36px,3.6vw,54px);object-fit:contain;filter:grayscale(1) brightness(1.2);opacity:.55;transition:filter .35s var(--ease),opacity .35s var(--ease),transform .35s var(--ease)}
.cr li.cur img{filter:none;opacity:1}
.cr li.cur:after{content:"";position:absolute;left:20%;right:20%;bottom:-12px;height:2px;background:var(--lime)}
.cr .tt{position:absolute;bottom:calc(100% + 10px);left:50%;transform:translateX(-50%);white-space:nowrap;font-size:10px;letter-spacing:.16em;text-transform:uppercase;background:var(--lime);color:#0F0D0A;padding:5px 8px;opacity:0;pointer-events:none;transition:opacity .25s var(--ease)}
@media (hover:hover) and (pointer:fine){.cr li:hover img{filter:none;opacity:1;transform:translateY(-3px)}.cr li:hover .tt{opacity:1}}
.mid{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:24px;padding:30px 60px}
.logo{font-weight:700;font-size:32px;letter-spacing:.08em;color:var(--lime);text-decoration:none}.logo span{color:var(--mag)}
.cp{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--gray);text-align:center}
.r{display:flex;justify-content:flex-end;align-items:center;gap:22px;flex-wrap:wrap}
.up{width:46px;height:46px;border-radius:50%;border:1.5px solid var(--lime);background:none;color:var(--lime);font-size:18px;cursor:pointer;transition:transform .3s var(--ease)}
.up:focus-visible,a:focus-visible{outline:2px solid var(--mag);outline-offset:3px}
@media (hover:hover) and (pointer:fine){.up:hover{transform:translateY(-4px)}}
@media (max-width:820px){.cr{padding:26px 16px;gap:12px}.cr img{width:34px;height:34px}.cr .tt{display:none}.mid{grid-template-columns:1fr auto;padding:26px 20px;gap:18px}.cp{grid-column:1/-1;grid-row:2;text-align:left}.r{grid-column:1/-1;grid-row:3;justify-content:space-between}}
</style></head><body>
<div class="pre">· fin de contacto ·</div>
<footer>
  <ul class="cr" id="cr" aria-label="Clubes de su carrera"></ul>
  <div class="mid">
    <a class="logo" href="#hero" aria-label="Volver al inicio">{{initials}}<span>_</span></a>
    <span class="cp">© {{year}} {{full}} · Todos los derechos reservados</span>
    <div class="r"><span id="dev"></span><button class="up" id="up" aria-label="Volver arriba">↑</button></div>
  </div>
</footer>

<script src="player.js"></script><script src="kit.js"></script><script src="bind.js"></script><script>
cr.innerHTML=CLUBS.map(c=>`<li class="${c.cur?'cur':''}"><img src="${c.l}" alt="${c.n}" loading="lazy"><span class="tt" aria-hidden="true">${c.n} · ${c.y}</span></li>`).join('')
up.onclick=()=>scrollTo({top:0,behavior:'smooth'});dev.outerHTML=DEV
</script>
</body></html>
