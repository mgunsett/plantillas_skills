<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Navbar 2 · Escudo al centro</title>
<link rel="stylesheet" href="base.css">
<style>
.bar{position:fixed;top:0;left:0;right:0;z-index:60;height:84px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 48px;color:#fff;transition:color .35s,height .45s var(--ease)}
.bar:before{content:"";position:absolute;inset:0;background:var(--bg2);box-shadow:0 6px 30px #07060514;opacity:0;transition:opacity .35s;z-index:-1}
.bar:after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:linear-gradient(90deg,var(--acc) 0 50%,var(--acc2) 50% 100%);transform:scaleX(0);transition:transform .7s var(--ease)}
.bar.solid{color:var(--acc);height:70px}.bar.solid:before{opacity:1}.bar.solid:after{transform:scaleX(1)}
.side{display:flex;gap:6px;align-items:center}.side.r{justify-content:flex-end}
.side a{position:relative;padding:10px 14px;font-size:11px;font-weight:500;letter-spacing:.18em;text-transform:uppercase;text-decoration:none}
.side a:after{content:"";position:absolute;left:14px;right:14px;bottom:4px;height:2px;background:var(--acc2);transform:scaleX(0);transform-origin:left;transition:transform .4s var(--ease)}
.side a[aria-current]:after{transform:scaleX(1)}
@media (hover:hover) and (pointer:fine){.side a:hover:after{transform:scaleX(1)}}
.side .cta{margin-left:10px;border:1.5px solid currentColor;border-radius:4px;padding:10px 16px}.side .cta:after{display:none}
.mid{display:flex;align-items:center;gap:14px;text-decoration:none}
.mid img{height:50px;width:auto;transition:transform .45s var(--ease);filter:drop-shadow(0 4px 12px #0003)}
.bar.solid .mid img{transform:scale(.82);filter:none}
.mid span{display:flex;flex-direction:column;line-height:1;font-weight:700;text-transform:uppercase}
.mid small{font-size:10px;letter-spacing:.3em;font-weight:500;opacity:.75}
.mid b{font-size:20px;letter-spacing:.06em}
.mid b i{font-style:normal;color:var(--acc2)}
.num{display:none}
.burger{display:none;justify-self:end;width:44px;height:44px;position:relative}
.burger i{position:absolute;left:10px;right:10px;height:2px;background:currentColor;transition:transform .4s var(--ease),opacity .3s}
.burger i:nth-child(1){top:16px}.burger i:nth-child(2){top:22px}.burger i:nth-child(3){top:28px}
/* Cajón lateral (mobile) */
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(88vw,420px);z-index:70;background:var(--bg2);color:#fff;padding:90px 28px 28px;display:flex;flex-direction:column;transform:translateX(100%);transition:transform .6s var(--ease)}
.drawer:before{content:attr(data-n);position:absolute;right:-10px;bottom:-40px;font-weight:700;font-size:320px;line-height:1;color:#ffffff0d}
.drawer .x{position:absolute;top:20px;right:20px;width:44px;height:44px;border-radius:50%;border:1px solid #ffffff33;font-size:22px;color:#fff}
.drawer a.l{display:flex;justify-content:space-between;align-items:center;padding:16px 0;border-bottom:1px solid #ffffff1f;font-weight:700;font-size:30px;text-transform:uppercase;text-decoration:none;opacity:0;transform:translateX(30px);transition:transform .6s var(--ease),opacity .6s}
.drawer a.l small{font-size:11px;color:#ffffff80;letter-spacing:.14em;font-weight:500}
.drawer a.l[aria-current]{color:#fff}.drawer a.l[aria-current] small{color:var(--acc2)}
.drawer .foot{margin-top:auto;display:flex;align-items:center;gap:12px;font-size:12px;letter-spacing:.1em;color:#ffffffb3}
.drawer .foot img{height:34px}
.scrim{position:fixed;inset:0;z-index:65;background:#07060580;opacity:0;pointer-events:none;transition:opacity .4s}
.open .drawer{transform:none}.open .scrim{opacity:1;pointer-events:auto}
.open .drawer a.l{opacity:1;transform:none}
@media (max-width:980px){
  .bar{padding:0 14px;height:70px;grid-template-columns:1fr auto 1fr}
  .side{display:none}
  .num{display:block;font-weight:700;font-size:13px;letter-spacing:.14em}
  .num b{font-size:22px;color:var(--acc2);margin-right:4px}
  .mid img{height:40px}.mid span{display:none}
  .burger{display:block}
}
</style></head><body>
<nav class="bar" id="bar" aria-label="Principal">
  <div class="side" id="sl"></div>
  <div class="num"><b>{{number}}</b>{{positionShort}}</div>
  <a class="mid" href="#hero" aria-label="Inicio · {{full}}"><img src="{{crest}}" alt=""><span><small>{{first}}</small><b>{{last}}<i>.</i></b></span></a>
  <div class="side r" id="sr"></div>
  <button class="burger" id="bg" aria-label="Abrir menú" aria-expanded="false" aria-controls="dr"><i></i><i></i><i></i></button>
</nav>
<div class="scrim" id="scrim"></div>
<div class="drawer" id="dr" data-n="{{number}}" role="dialog" aria-label="Menú">
  <button class="x" id="x" aria-label="Cerrar menú">×</button>
  <div id="dl"></div>
  <div class="foot"><img src="{{crest}}" alt="">{{club}} · {{instagram.h}}</div>
</div>
<main id="demo"></main>
<script src="player.js"></script><script src="kit.js"></script><script src="demo.js"></script><script src="navkit.js"></script>
<script>
const L=NAVL.filter(([,h])=>h!=='#hero'&&h!=='#contact'),half=Math.ceil(L.length/2),bar=document.getElementById('bar'),bg=document.getElementById('bg')
document.getElementById('sl').innerHTML=L.slice(0,half).map(([l,h])=>`<a href="${h}">${l}</a>`).join('')
document.getElementById('sr').innerHTML=L.slice(half).map(([l,h])=>`<a href="${h}">${l}</a>`).join('')+'<a class="cta" href="#contact">Contacto</a>'
NK.links(document.getElementById('dl'),(l,h,i)=>`<a class="l" href="${h}" style="transition-delay:${.08+i*.05}s">${l}<small>0${i+1}</small></a>`)
NK.spy(h=>document.querySelectorAll('.side a,.drawer a.l').forEach(a=>a.getAttribute('href')===h?a.setAttribute('aria-current','true'):a.removeAttribute('aria-current')))
NK.scroll(y=>bar.classList.toggle('solid',y>innerHeight*.6))
function tog(v){document.body.classList.toggle('open',v);bg.setAttribute('aria-expanded',v)}
bg.onclick=()=>tog(true);document.getElementById('x').onclick=document.getElementById('scrim').onclick=()=>tog(false)
document.addEventListener('click',e=>{if(e.target.closest('a[href^="#"]')){tog(false);NK.go(e)}})
addEventListener('keydown',e=>e.key==='Escape'&&tog(false))
NK.autoOpen(()=>tog(true))
</script>
<script src="bind.js"></script>
</body></html>
