<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Videos 3 · Temporadas</title>
<link rel="stylesheet" href="base.css">
<style>
.cols{display:grid;grid-template-columns:repeat(3,1fr);gap:28px}
.col{position:relative;animation:rv .9s var(--ease) both}
.yr{display:flex;align-items:flex-end;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:18px}
.yr b{font-size:clamp(90px,10vw,150px);line-height:.78;font-weight:700;color:transparent;-webkit-text-stroke:1.5px var(--lime)}
.col:first-child .yr b{color:var(--lime);-webkit-text-stroke:0}
.yr div{text-align:right}
.yr img{width:40px;height:40px;object-fit:contain;margin-left:auto}
.yr small{display:block;margin-top:8px;font-size:11px;letter-spacing:.2em;color:var(--gray);text-transform:uppercase}
.card{position:relative;display:block;aspect-ratio:4/5;overflow:hidden;background:#000;text-decoration:none;color:inherit}
.card img{width:100%;height:100%;object-fit:cover}
.card:after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 50%,#0F0D0Af0)}
.card .p{position:absolute;right:16px;top:16px;z-index:2;width:54px;height:54px;border-radius:50%;background:#0F0D0Acc;color:var(--lime);display:grid;place-items:center;border:1.5px solid var(--lime)}
.card .t{position:absolute;left:18px;right:18px;bottom:16px;z-index:2}
.card .t b{display:block;font-size:22px;font-weight:700;text-transform:uppercase;line-height:1}
.card .t small{font-size:12px;color:#e6dcc8}
.card:focus-visible{outline:2px solid var(--mag);outline-offset:4px}
@media (hover:hover) and (pointer:fine){.card img{transition:transform .6s var(--ease)}.card:hover img{transform:scale(1.05)}.card .p{transition:transform .3s var(--ease)}.card:hover .p{transform:scale(1.1)}}
@media (max-width:900px){.cols{grid-template-columns:1fr;gap:40px}.card{aspect-ratio:4/4.4}.yr b{font-size:96px}}
</style></head><body>
<section class="sec" id="videos">
  <div class="sh"><div class="k">Highlights por temporada</div><h2>Videos</h2></div>
  <div class="cols" id="cols"></div>
</section>

<script src="player.js"></script><script src="kit.js"></script><script src="bind.js"></script><script>
cols.innerHTML=VIDS.map((v,i)=>`<div class="col" style="animation-delay:${i*.1}s"><div class="yr"><b>'${v.yr}</b><div><img src="${v.crest}" alt="Escudo de ${v.club}"><small>${v.club}</small></div></div>
<a class="card" href="https://www.instagram.com/reel/${v.ig}/" aria-label="Ver ${v.t} en Instagram"><img src="${v.img}" alt="" loading="lazy"><span class="p">${PLAY}</span><span class="t"><b>${v.f}</b><small>${v.lg}</small></span></a></div>`).join('')
</script>
</body></html>
