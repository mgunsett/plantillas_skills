<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Navbar 4 · Zócalo de partido</title>
<link rel="stylesheet" href="base.css">
<style>
.hd{position:fixed;top:0;left:0;right:0;z-index:60;transition:transform .5s var(--ease)}
.hd.min{transform:translateY(-36px)}
.strip{height:36px;background:var(--acc);color:var(--on-acc);display:flex;align-items:center;font-size:11px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;overflow:hidden}
.strip .lb{height:100%;display:flex;align-items:center;gap:8px;padding:0 16px;background:var(--acc2);font-weight:700;flex-shrink:0}
.strip .lb:before{content:"";width:6px;height:6px;border-radius:50%;background:#fff;animation:bl 1.4s infinite}
@keyframes bl{50%{opacity:.25}}
.strip .rw{flex:1;overflow:hidden}
.strip .run{display:flex;white-space:nowrap;width:max-content}
.strip .run span{padding:0 26px;border-right:1px solid #ffffff33}
.strip .run em{font-style:normal;opacity:.6;margin-right:8px}
.strip .run b{font-weight:700}
.strip .ig{flex-shrink:0;padding:0 18px;display:flex;align-items:center;gap:8px;text-decoration:none;font-weight:700}
.main{height:72px;background:var(--bg2);border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 48px;gap:28px;box-shadow:0 8px 30px #0706050f}
.lg{display:flex;align-items:center;gap:12px;text-decoration:none;margin-right:auto}
.lg .n{font-weight:700;font-size:40px;line-height:1;color:var(--acc2);letter-spacing:-.02em}
.lg span{display:flex;flex-direction:column;line-height:1.05;font-weight:700;text-transform:uppercase;color:var(--acc)}
.lg span b{font-size:18px;letter-spacing:.04em}.lg span small{font-size:10px;letter-spacing:.24em;color:var(--gray);font-weight:500}
.lk{display:flex;gap:4px}
.lk a{padding:10px 14px;font-size:11px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;text-decoration:none;color:var(--gray);border-radius:4px;transition:color .25s}
.lk a[aria-current]{color:var(--acc);background:var(--acc-l)}
@media (hover:hover) and (pointer:fine){.lk a:hover{color:var(--acc)}}
.cta{padding:12px 20px;border-radius:4px;background:var(--acc);color:var(--on-acc);font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;text-decoration:none}
.burger{display:none;width:44px;height:44px;border-radius:4px;background:var(--acc);position:relative}
.burger i{position:absolute;left:12px;right:12px;height:2px;background:#fff;transition:transform .4s var(--ease),opacity .3s}
.burger i:nth-child(1){top:16px}.burger i:nth-child(2){top:21px}.burger i:nth-child(3){top:26px}
.burger[aria-expanded=true] i:nth-child(1){transform:translateY(5px) rotate(45deg)}.burger[aria-expanded=true] i:nth-child(2){opacity:0}.burger[aria-expanded=true] i:nth-child(3){transform:translateY(-5px) rotate(-45deg)}
.panel{position:absolute;left:0;right:0;top:100%;background:var(--bg2);border-bottom:3px solid var(--acc2);padding:18px 20px 22px;transform:translateY(-12px);opacity:0;pointer-events:none;transition:transform .5s var(--ease),opacity .35s;box-shadow:0 20px 40px #0706051f}
.open .panel{transform:none;opacity:1;pointer-events:auto}
.panel .g{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.panel .g a{display:flex;flex-direction:column;gap:6px;padding:14px;border-radius:8px;background:var(--bg);text-decoration:none;font-weight:700;font-size:16px;text-transform:uppercase;color:var(--acc)}
.panel .g a small{font-size:10px;color:var(--acc2);letter-spacing:.14em}
.panel .g a[aria-current]{background:var(--acc);color:var(--on-acc)}
.panel .mt{margin-top:12px;display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.panel .mt div{padding:12px 14px;font-size:12px;font-weight:700;color:var(--acc);text-transform:uppercase}
.panel .mt div+div{border-left:1px solid var(--line)}
.panel .mt small{display:block;font-size:9px;letter-spacing:.2em;color:var(--gray);font-weight:500;margin-bottom:6px}
.hd .panel{display:none}
@media (max-width:980px){
  .hd .panel{display:block}
  .strip .ig{display:none}
  .main{padding:0 14px;height:64px}
  .lk,.cta{display:none}.burger{display:block}
  .lg .n{font-size:34px}
}
@media (prefers-reduced-motion:no-preference){.strip .run{animation:mq 26s linear infinite}}
@keyframes mq{to{transform:translateX(-50%)}}
</style></head><body>
<header class="hd" id="hd">
  <div class="strip">
    <span class="lb">Partidos</span>
    <div class="rw"><div class="run" id="run"></div></div>
    <a class="ig" href="{{instagram.u}}" target="_blank" rel="noopener" id="ig">{{instagram.h}}</a>
  </div>
  <nav class="main" aria-label="Principal">
    <a class="lg" href="#hero" aria-label="Inicio · {{full}}"><span class="n">{{number}}</span><span><b>{{full}}</b><small>{{position}} · {{club}}</small></span></a>
    <div class="lk" id="lk"></div>
    <a class="cta" href="#contact">Contacto</a>
    <button class="burger" id="bg" aria-label="Abrir menú" aria-expanded="false" aria-controls="pn"><i></i><i></i><i></i></button>
  </nav>
  <div class="panel" id="pn">
    <div class="g" id="pg"></div>
    <div class="mt"><div><small>Último</small>{{lastMatch.home}} {{lastMatch.hs}}–{{lastMatch.as}} {{lastMatch.away}}</div><div><small>Próximo · {{nextMatch.date}}</small>{{nextMatch.home}} vs {{nextMatch.away}}</div></div>
  </div>
</header>
<main id="demo"></main>
<script src="player.js"></script><script src="kit.js"></script><script src="demo.js"></script><script src="navkit.js"></script>
<script>
const P_=window.P,hd=document.getElementById('hd'),bg=document.getElementById('bg')
const items=`<span><em>Último</em><b>${P_.lastMatch.homeName} ${P_.lastMatch.hs}–${P_.lastMatch.as} ${P_.lastMatch.awayName}</b></span><span><em>Próximo</em><b>${P_.nextMatch.homeName} vs ${P_.nextMatch.awayName}</b> · ${P_.nextMatch.date} · ${P_.nextMatch.venue}</span><span><em>Temporada ${P_.seasonLabel}</em><b>${P_.s.pj} PJ · ${P_.s.goles} goles</b></span>`
document.getElementById('run').innerHTML=items+items
document.getElementById('ig').insertAdjacentHTML('afterbegin',IG)
document.getElementById('lk').innerHTML=NAVL.filter(([,h])=>h!=='#hero'&&h!=='#contact').map(([l,h])=>`<a href="${h}">${l}</a>`).join('')
NK.links(document.getElementById('pg'),(l,h,i)=>`<a href="${h}"><small>0${i+1}</small>${l}</a>`)
NK.spy(h=>document.querySelectorAll('.lk a,.panel .g a').forEach(a=>a.getAttribute('href')===h?a.setAttribute('aria-current','true'):a.removeAttribute('aria-current')))
NK.scroll(y=>hd.classList.toggle('min',y>200&&!document.body.classList.contains('open')))
function tog(v){document.body.classList.toggle('open',v);bg.setAttribute('aria-expanded',v);if(v)hd.classList.remove('min')}
bg.onclick=()=>tog(!document.body.classList.contains('open'))
document.addEventListener('click',e=>{if(e.target.closest('a[href^="#"]')){tog(false);NK.go(e)}})
addEventListener('keydown',e=>e.key==='Escape'&&tog(false))
NK.autoOpen(()=>tog(true))
</script>
<script src="bind.js"></script>
</body></html>
