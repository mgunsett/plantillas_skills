/* Kit claro: fondo blanco azulado, acento del club (--acc) y segundo acento (--acc2).
   Para otro club se cambian solo --acc, --acc2 y, si hace falta, --deep (superficie oscura). */
:root{
  --bg:#F4F6FB; --bg2:#FFFFFF; --ink:#0D1730; --gray:#5C6A88; --line:#17285a26;
  --acc:#17285A; --acc-l:#17285a14; --acc2:#E23744; --deep:#0A1226; --on-acc:#FFFFFF;
  --ease:cubic-bezier(0.23,1,0.32,1);
  --sv:1vh;
}
@supports (height:1svh){:root{--sv:1svh}}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font-family:Nippo,system-ui,sans-serif;overflow-x:hidden}
img{display:block;max-width:none}
a{color:inherit}
button{font-family:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--acc2);outline-offset:3px}
/* Navbar neutro para las previews de hero (el navbar real se elige aparte) */
.nav{position:absolute;top:0;left:0;right:0;z-index:50;display:flex;align-items:center;justify-content:space-between;padding:22px 60px}
.nav a{color:var(--ink);text-decoration:none;font-size:12px;font-weight:500;letter-spacing:.18em;text-transform:uppercase;opacity:.75}
.nav .links{display:flex;gap:32px;align-items:center}
.nav .logo{font-weight:700;font-size:22px;color:var(--acc);letter-spacing:.05em;opacity:1}
.nav .logo span{color:var(--acc2)}
.nav .cta{background:var(--acc);color:var(--on-acc);padding:9px 16px;border-radius:4px;opacity:1}
.nav .burger{display:none;width:26px;height:14px;border-top:2px solid currentColor;border-bottom:2px solid currentColor}
.nav.inv a,.nav.inv{color:#fff}.nav.inv .logo{color:#fff}.nav.inv .cta{background:#fff;color:var(--acc)}
@media (max-width:820px){.nav{padding:18px 20px}.nav .links,.nav .cta{display:none}.nav .burger{display:block}}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.28em;text-transform:uppercase;color:var(--gray)}
.rv{opacity:0;transform:translateY(28px);animation:rv 1s var(--ease) forwards}
@keyframes rv{to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}}
.tab{font-variant-numeric:tabular-nums}
/* Página de relleno para probar los navbar con scroll */
.demo-hero{position:relative;height:calc(100 * var(--sv));min-height:560px;overflow:hidden;background:var(--deep)}
.demo-hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 30%;filter:brightness(.62) saturate(.85)}
.demo-hero:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#0A122699 0%,transparent 30%,transparent 60%,#0A1226cc 100%)}
.demo-hero h1{position:absolute;left:60px;bottom:64px;z-index:2;color:#fff;font-weight:700;text-transform:uppercase;line-height:.85;font-size:clamp(64px,10vw,170px)}
.demo-hero h1 small{display:block;font-size:.28em;letter-spacing:.14em;font-weight:500;opacity:.8}
.demo-sec{min-height:80vh;padding:110px 60px;border-top:1px solid var(--line)}
.demo-sec:nth-child(even){background:var(--bg2)}
.demo-sec .k{font-size:11px;font-weight:700;letter-spacing:.28em;text-transform:uppercase;color:var(--acc2)}
.demo-sec h2{font-weight:700;font-size:clamp(44px,5.4vw,84px);line-height:.9;color:var(--acc);text-transform:uppercase;margin-top:8px}
.demo-sec .ph{margin-top:36px;display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.demo-sec .ph i{display:block;height:180px;border-radius:6px;background:var(--acc-l)}
@media (max-width:820px){.demo-hero h1{left:20px;bottom:40px}.demo-sec{padding:80px 20px}.demo-sec .ph{grid-template-columns:1fr}.demo-sec .ph i{height:120px}}
</style>
<style>
.mini{position:fixed;top:0;left:0;right:0;z-index:80;display:flex;align-items:center;justify-content:space-between;padding:22px 48px;color:#fff;mix-blend-mode:difference}
.mini .mk{font-weight:700;font-size:24px;text-decoration:none;letter-spacing:.04em}
.mini .r{display:flex;align-items:center;gap:26px}
.mini .r a{font-size:11px;font-weight:500;letter-spacing:.2em;text-transform:uppercase;text-decoration:none}
.mb{display:flex;align-items:center;gap:12px;font-size:11px;font-weight:700;letter-spacing:.24em;text-transform:uppercase}
.mb span{position:relative;width:30px;height:12px}
.mb span i{position:absolute;left:0;right:0;height:2px;background:currentColor;transition:transform .5s var(--ease)}
.mb span i:nth-child(1){top:0}.mb span i:nth-child(2){bottom:0;left:10px}
.open .mb span i:nth-child(1){transform:translateY(5px) rotate(45deg)}.open .mb span i:nth-child(2){transform:translate(-10px,-5px) rotate(-45deg);left:10px}
.ov{position:fixed;inset:0;z-index:70;display:grid;grid-template-columns:1.25fr 1fr;background:var(--bg2);visibility:hidden;transition:visibility 0s .7s}
.open .ov{visibility:visible;transition:none}
.ov .sh{position:absolute;inset:0;background:var(--acc);transform:translateY(-100%);transition:transform .7s var(--ease)}
.open .ov .sh{transform:translateY(100%);transition-delay:.05s}
.ix{position:relative;padding:120px 48px 40px;display:flex;flex-direction:column;justify-content:center;background:var(--bg2)}
.ix a.l{display:flex;align-items:baseline;gap:22px;text-decoration:none;color:var(--acc);font-weight:700;text-transform:uppercase;font-size:clamp(40px,5.6vw,92px);line-height:1.02;overflow:hidden}
.ix a.l span{display:inline-block;transform:translateY(105%);transition:transform .8s var(--ease)}
.ix a.l small{font-size:12px;letter-spacing:.16em;color:var(--acc2);font-weight:500;width:28px;flex-shrink:0;opacity:0;transition:opacity .6s}

  P.nav.slice(1).forEach(([l, href]) => { h += `<section class="demo-sec" id="${href.slice(1)}"><div class="k">Sección</div><h2>${l}</h2><div class="ph"><i></i><i></i><i></i></div></section>` })

// Ayudas comunes de los navbar del kit: links desde player.js, sección activa, estado de scroll
// y apertura automática del menú con #open (lo usa el comparador para mostrar el menú abierto en mobile).
window.NK = {
  links(el, tpl) { el.innerHTML = window.NAVL.map(([l, h], i) => tpl(l, h, i)).join('') },
  spy(cb) {
    const ids = window.NAVL.map(([, h]) => h.slice(1)), seen = {}
    const io = new IntersectionObserver(es => {
      es.forEach(e => { seen[e.target.id] = e.isIntersecting ? e.intersectionRatio : 0 })
      let best = ids[0], r = -1; ids.forEach(id => { if ((seen[id] || 0) > r) { r = seen[id] || 0; best = id } })
      cb('#' + best)
    }, { threshold: [0, .25, .5, .75, 1], rootMargin: '-20% 0px -40% 0px' })
    ids.forEach(id => { const s = document.getElementById(id); if (s) io.observe(s) })
  },
  scroll(cb) { let last = 0; const f = () => { const y = scrollY; cb(y, y > last); last = y }; addEventListener('scroll', f, { passive: true }); f() },
  go(e) { const a = e.target.closest('a[href^="#"]'); if (!a) return; const t = document.querySelector(a.getAttribute('href')); if (!t) return; e.preventDefault(); t.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' }) },
  autoOpen(fn) { if (location.hash === '#open') setTimeout(fn, 400) },
};
</script>

NK.spy(h=>document.querySelectorAll('.ix a.l').forEach(a=>a.getAttribute('href')===h?a.setAttribute('aria-current','true'):a.removeAttribute('aria-current')))
function tog(v){document.body.classList.toggle('open',v);mb.setAttribute('aria-expanded',v);mbl.textContent=v?'Cerrar':'Menú';document.documentElement.style.overflow=v?'hidden':''}

</script>
