:root{
  --bg:#0C0E0A; --bg2:#141810; --lime:#B4F32A; --lime-d:#7FA800; --mag:#FF2E9A;
  --bone:#fff; --gray:#98A388; --line:#b4f32a40; --ease:cubic-bezier(0.23,1,0.32,1);
  --sv:1vh;
}
@supports (height:1svh){:root{--sv:1svh}}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--bone);font-family:Nippo,system-ui,sans-serif;overflow-x:hidden}
img{display:block;max-width:none}
button{font-family:inherit}
.nav{position:absolute;top:0;left:0;right:0;z-index:50;display:flex;align-items:center;justify-content:space-between;padding:22px 60px}
.nav a{color:var(--gray);text-decoration:none;font-size:12px;font-weight:700;letter-spacing:.18em;text-transform:uppercase}
.nav .links{display:flex;gap:32px;align-items:center}
.nav .logo{font-weight:700;font-size:22px;color:var(--lime);letter-spacing:.05em}
.nav .logo span{color:var(--mag)}
.nav .cta{border:1.5px solid var(--lime);color:var(--lime);padding:8px 16px;border-radius:999px}
.nav .burger{display:none;width:26px;height:16px;border-top:2px solid #fff;border-bottom:2px solid #fff;position:relative}
.nav .burger:after{content:"";position:absolute;left:0;right:0;top:5px;border-top:2px solid #fff}
@media (max-width:820px){.nav{padding:18px 20px}.nav .links,.nav .cta{display:none}.nav .burger{display:block}}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.28em;text-transform:uppercase;color:var(--gray)}
.rv{opacity:0;transform:translateY(28px);animation:rv 1s var(--ease) forwards}
@keyframes rv{to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}}
.sec{position:relative;padding:96px 60px;background:var(--bg);overflow:hidden}
.sh{margin-bottom:44px}
.sh .k{font-size:11px;font-weight:700;letter-spacing:.28em;text-transform:uppercase;color:var(--mag)}
.sh h2{font-weight:700;font-size:clamp(44px,5.4vw,84px);line-height:.9;color:var(--lime);text-transform:uppercase;margin-top:8px}
.tab{font-variant-numeric:tabular-nums}
@media (max-width:820px){.sec{padding:64px 20px}.sh{margin-bottom:28px}}
</style>
<style>
.sec{padding:0;min-height:calc(100 * var(--sv));display:grid;grid-template-columns:1fr 1fr}
.ph{position:relative;overflow:hidden}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 20%;filter:grayscale(.3)}
.ph:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent 55%,var(--bg))}
.bx{display:flex;flex-direction:column;justify-content:center;padding:96px 60px 96px 40px}
.big{font-weight:700;font-size:clamp(56px,7.4vw,124px);line-height:.86;text-transform:uppercase}
.big em{font-style:normal;color:var(--lime);display:block}
.lead{margin-top:22px;font-size:16px;color:#d6dccd;line-height:1.5;max-width:40ch}
.reps{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:36px}
.reps a{display:block;background:var(--bg2);border:1px solid var(--line);padding:20px;color:#fff;text-decoration:none;transition:border-color .3s var(--ease),transform .3s var(--ease)}
.reps img{width:44px;height:44px;object-fit:contain}
.reps .r{margin-top:14px;font-size:10px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--mag)}
.reps b{display:block;margin-top:6px;font-size:17px;text-transform:uppercase;line-height:1.1}
.reps span{display:block;margin-top:10px;font-size:12px;color:var(--lime);letter-spacing:.06em}
.ig{display:inline-flex;align-items:center;gap:12px;margin-top:22px;font-size:13px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#0C0E0A;background:var(--lime);padding:16px 22px;border-radius:999px;text-decoration:none;align-self:flex-start}
.ig svg{font-size:18px}
.tm{margin-top:14px;font-size:12px;color:var(--gray);letter-spacing:.12em;text-transform:uppercase}.tm a{color:#fff}
a:focus-visible{outline:2px solid var(--mag);outline-offset:2px}
@media (hover:hover) and (pointer:fine){.reps a:hover{border-color:var(--lime);transform:translateY(-4px)}}
@media (max-width:820px){.sec{grid-template-columns:1fr;min-height:0}.ph{height:62vw;min-height:280px}.ph:after{background:linear-gradient(0deg,var(--bg),transparent 50%)}.bx{padding:0 20px 64px;margin-top:-24px;position:relative}.reps{grid-template-columns:1fr}}
