<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Contacto — Opción 3: ¿Para qué escribís?</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@400;500;600;700&family=Barlow:wght@300;400;500;600&display=swap" rel="stylesheet" />
<style>
  :root { --dark: #151212; --panel: #1c1818; --line: rgba(243,238,227,0.10); --line-2: rgba(243,238,227,0.18); --red: #EF2D38; --red-deep: #C4151F; --gold: #D9BE7E; --bone: #F3EEE3; --gray: #A39B92; --ease-out: cubic-bezier(0.23, 1, 0.32, 1); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--dark); color: var(--bone); font-family: 'Barlow', sans-serif; -webkit-font-smoothing: antialiased; }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; text-align: left; }
  .preview-note { font: 500 12px 'Barlow Condensed', sans-serif; color: var(--gray); padding: 14px 24px; border-bottom: 1px solid var(--line); }
  .preview-note b { color: var(--bone); font-weight: 600; }
  section { max-width: 1400px; margin: 0 auto; padding: 110px 40px; }
  .eyebrow { font: 500 10px 'Barlow Condensed', sans-serif; letter-spacing: .2em; text-transform: uppercase; color: var(--bone); }
  h2 { font: 400 clamp(56px, 7vw, 104px)/.88 'Bebas Neue', sans-serif; color: var(--red); margin-top: 4px; }
  .k { font: 500 13px 'Barlow Condensed', sans-serif; color: var(--gray); }

  .layout { margin-top: 48px; display: grid; grid-template-columns: 1fr 1.15fr; gap: 16px; }
  .reasons { list-style: none; display: grid; gap: 10px; align-content: start; }
  .reason { width: 100%; display: flex; align-items: center; gap: 18px; padding: 22px 24px; border-radius: 16px; border: 1px solid var(--line-2);
            transition: border-color .2s ease, background-color .2s ease; }
  .reason .n { font: 600 14px 'Barlow Condensed', sans-serif; color: var(--gray); width: 22px; }
  .reason strong { font: 400 34px/1 'Bebas Neue', sans-serif; flex: 1; }
  .reason .dot { width: 14px; height: 14px; border-radius: 50%; border: 1.5px solid var(--line-2); transition: background-color .2s ease, border-color .2s ease; }
  .reason[aria-checked="true"] { border-color: var(--red); background: rgba(239,45,56,.07); }
  .reason[aria-checked="true"] .dot { background: var(--red); border-color: var(--red); box-shadow: 0 0 0 4px rgba(239,45,56,.2); }
  @media (hover: hover) and (pointer: fine) { .reason:hover { border-color: rgba(239,45,56,.5); } }
  .reason:focus-visible, .cta:focus-visible, .soc:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }

  .answer { position: relative; border-radius: 20px; background: var(--panel); padding: 40px; overflow: hidden; display: flex; flex-direction: column; min-height: 420px; }
  .answer .glow { position: absolute; right: -120px; top: -120px; width: 380px; height: 380px; border-radius: 50%; background: radial-gradient(circle, rgba(239,45,56,.18), transparent 70%); pointer-events: none; }
  .answer-in { position: relative; transition: opacity .18s ease, transform .25s var(--ease-out); display: flex; flex-direction: column; height: 100%; }
  .answer-in.swap { opacity: 0; transform: translateY(6px); }
  .answer .lbl { font: 600 14px 'Barlow Condensed', sans-serif; color: var(--gold); }
  .answer .who { display: flex; align-items: center; gap: 18px; margin-top: 14px; }
  .answer .who img { width: 84px; height: 84px; object-fit: contain; }
  .answer .who strong { font: 400 clamp(40px, 4vw, 58px)/.92 'Bebas Neue', sans-serif; }
  .answer p { color: var(--gray); font-size: 16px; line-height: 1.55; margin-top: 18px; max-width: 44ch; }
  .cta { margin-top: auto; align-self: flex-start; display: inline-flex; align-items: center; gap: 10px; padding: 15px 22px; border-radius: 999px; background: var(--red); color: #fff; font: 700 16px 'Barlow Condensed', sans-serif; transition: background-color .2s ease, transform .16s var(--ease-out); }
  .cta svg { width: 18px; height: 18px; }
  .cta:active { transform: scale(.97); }
  @media (hover: hover) and (pointer: fine) { .cta:hover { background: var(--red-deep); } }
  .answer .handle { margin-top: 10px; }
  .socs { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 8px; }
  .soc { display: inline-flex; align-items: center; gap: 10px; padding: 12px 16px 12px 12px; border-radius: 12px; border: 1px solid var(--line-2); font: 600 16px 'Barlow Condensed', sans-serif; transition: border-color .2s ease; }
  .soc svg { width: 20px; height: 20px; }
  .soc span { color: var(--gray); font-weight: 500; }
  @media (hover: hover) and (pointer: fine) { .soc:hover { border-color: var(--gold); } }

  @media (max-width: 1000px) { .layout { grid-template-columns: 1fr; } .answer { min-height: 360px; } }
  @media (max-width: 600px) {
    section { padding: 72px 20px 80px; }
    .reason { padding: 18px; gap: 14px; } .reason strong { font-size: 28px; }
    .answer { padding: 26px 22px; border-radius: 16px; }
    .answer .who img { width: 64px; height: 64px; }
    .cta { align-self: stretch; justify-content: center; margin-top: 26px; }
  }
  @media (prefers-reduced-motion: reduce) { .answer-in, .reason, .cta { transition: none; } }
</style>
</head>

  ig: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg>',

}

    { label: 'Propuesta deportiva', to: 'rep', text: 'Clubes, intermediarios y todo lo relacionado con su carrera deportiva lo maneja su representación.' },

  ]
  const list = document.getElementById('reasons'), answer = document.getElementById('answer')
  list.innerHTML = REASONS.map((r, i) => `<li><button class="reason" role="radio" aria-checked="false" tabindex="-1" data-i="${i}"><strong>${r.label}</strong><span class="dot" aria-hidden="true"></span></button></li>`).join('')
  const render = (r) => {
    if (r.to === 'social') return `<div class="lbl">Sus redes</div><p>${r.text}</p><div class="socs">${SOCIALS.map(s => `<a class="soc" href="${s.url}" target="_blank" rel="noopener" aria-label="${s.label} de Keki Piovi, ${s.handle}. Se abre en otra pestaña">${ICONS[s.key]}${s.label}<span>${s.handle}</span></a>`).join('')}</div>`
    const c = CONTACTS.find(x => x.key === r.to)
    return `<div class="lbl">${c.role}</div>
      <div class="who"><img src="${c.logo}" alt="" /><strong>${c.who}</strong></div>
      <p>${r.text}</p>
      <a class="cta" href="${c.url}" target="_blank" rel="noopener" aria-label="${c.cta} por Instagram, ${c.handle}. Se abre en otra pestaña">${ICONS.ig}${c.cta}</a>
      <span class="k handle">Por mensaje directo en Instagram, ${c.handle}</span>`
  }
  let cur = -1
  const select = (i, focus) => {
    if (i === cur) return; cur = i
    ;[...list.querySelectorAll('.reason')].forEach((b, j) => { b.setAttribute('aria-checked', j === i); b.tabIndex = j === i ? 0 : -1; if (j === i && focus) b.focus() })

    answer.classList.add('swap')
    setTimeout(() => { answer.innerHTML = render(REASONS[i]); answer.classList.remove('swap') }, reduce ? 0 : 140)
  }
  list.addEventListener('click', (e) => { const b = e.target.closest('.reason'); if (b) select(+b.dataset.i) })
  list.addEventListener('keydown', (e) => { const d = { ArrowDown: 1, ArrowRight: 1, ArrowUp: -1, ArrowLeft: -1 }[e.key]; if (d) { e.preventDefault(); select((cur + d + REASONS.length) % REASONS.length, true) } })
