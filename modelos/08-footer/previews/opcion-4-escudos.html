<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Footer · Opción 4 · Escudos</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700&family=Barlow:wght@400;500&family=Bebas+Neue&display=swap"><style>
:root{
  --bg:#1c1d1e; --foot:#141516; --line:rgba(255,255,255,.08);
  --amber:#bda78e; --amberSoft:rgba(189,167,142,.28); --amberFaint:rgba(189,167,142,.08);
  --granate:#7A1F1F; --granate2:#884545; --dorado:#c0ab32; --bone:#ffffff; --cream:#efe6da; --gray:#9b948c;
  --devGreen:#2D5A47; --devCream:#E8D5A3;
  --display:'Bebas Neue',Impact,'Arial Narrow',sans-serif; --cond:'Barlow Condensed','Arial Narrow',sans-serif; --text:'Barlow',system-ui,sans-serif;
  --ease:cubic-bezier(.23,1,.32,1); color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--bone);font-family:var(--text);-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--amber);outline-offset:3px;border-radius:6px}
.pad{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.in{max-width:1240px;margin:0 auto}
.intro{border-bottom:1px solid var(--line);padding-block:28px}
.intro .in{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:16px 32px}
.intro h1{margin:0;font:400 clamp(30px,4vw,44px)/1 var(--display);letter-spacing:.02em}
.intro h1 span{color:var(--amber)}
.intro p{margin:6px 0 0;color:var(--gray);font-size:14px;max-width:62ch;line-height:1.5}
.jump{display:flex;flex-wrap:wrap;gap:8px}
.jump a{font:600 13px var(--cond);letter-spacing:.1em;text-transform:uppercase;color:var(--cream);padding:9px 14px;border:1px solid var(--amberSoft);border-radius:999px}
.jump a.new{border-color:var(--dorado);color:var(--dorado)}
@media (hover:hover) and (pointer:fine){.jump a:hover{background:var(--amberFaint)}}

/* Cada opción: un trozo de "fin de Contacto" y el footer debajo */
.opt{padding-top:56px}
.badge{display:flex;flex-wrap:wrap;align-items:center;gap:10px;font:600 12px var(--cond);letter-spacing:.14em;text-transform:uppercase;color:var(--dorado);margin:0 0 18px}
.badge b{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--dorado);color:#1a1410;font-weight:700;letter-spacing:0}
.badge span{color:var(--gray);letter-spacing:.06em;text-transform:none;font-weight:500;font-size:13px}
.badge i{font-style:normal;padding:3px 8px;border-radius:999px;border:1px solid var(--dorado);font-size:11px}
.prev{padding-block:6px 40px;font:500 13px var(--cond);letter-spacing:.06em;color:rgba(255,255,255,.3)}
footer{background:var(--foot);border-top:1px solid var(--line);overflow:hidden}
.opt+.opt{margin-top:64px}

/* Piezas comunes */
.logo{display:inline-flex;align-items:center;gap:10px}
.logo i{width:5px;height:22px;background:var(--granate2);transform:skewX(-12deg);transition:background .25s}
.logo span{font:400 28px/1 var(--display);letter-spacing:.06em}
.logo em{font-style:normal;color:var(--amber)}
@media (hover:hover) and (pointer:fine){.logo:hover i{background:var(--dorado)}}
.copy{margin:0;font:500 14px var(--cond);letter-spacing:.04em;color:var(--gray)}
.top{display:inline-flex;align-items:center;gap:8px;padding:9px 14px 9px 16px;border-radius:999px;border:1px solid rgba(255,255,255,.22);font:600 14px var(--cond);letter-spacing:.04em;white-space:nowrap;transition:border-color .2s}
.top svg{transition:transform .25s var(--ease)}
@media (hover:hover) and (pointer:fine){.top:hover{border-color:var(--amber)}.top:hover svg{transform:translateY(-2px)}}
.credit{display:inline-flex;flex-direction:column;gap:3px;font:500 11px var(--cond);letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.32)}
.credit img{display:block;width:85px;height:auto;opacity:.85;transition:opacity .25s}
@media (hover:hover) and (pointer:fine){.credit a:hover img{opacity:1}}
.end{display:flex;align-items:center;gap:16px}
.social{display:flex;gap:8px}
.social a{width:40px;height:40px;border-radius:10px;border:1px solid var(--amberSoft);display:grid;place-items:center;color:var(--cream);transition:background .25s,color .25s,border-color .25s}
@media (hover:hover) and (pointer:fine){.social a:hover{background:var(--amber);border-color:var(--amber);color:#1a1410}}

/* 1 · Pulido */
.f1{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:24px;padding-block:48px}
.f1 .end{justify-self:end}
@media (max-width:820px){.f1{grid-template-columns:1fr;justify-items:center;text-align:center;padding-block:40px}.f1 .end{justify-self:center;flex-wrap:wrap;justify-content:center}}

/* 2 · Con navegación */
.f2a{display:flex;align-items:center;justify-content:space-between;gap:24px;padding-block:40px 28px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.f2a nav{display:flex;flex-wrap:wrap;gap:4px 26px}
.f2a nav a{font:600 14px var(--cond);letter-spacing:.1em;text-transform:uppercase;color:var(--gray);transition:color .2s}
@media (hover:hover) and (pointer:fine){.f2a nav a:hover{color:var(--bone)}}
.f2b{display:flex;align-items:center;justify-content:space-between;gap:20px;padding-block:22px 30px;flex-wrap:wrap}
@media (max-width:820px){.f2a{flex-direction:column;align-items:flex-start}.f2a nav{gap:10px 20px}.f2b{flex-direction:column;align-items:flex-start}}

/* 3 · Firma */
.f3a{display:flex;align-items:center;justify-content:space-between;gap:20px;padding-block:32px 8px;flex-wrap:wrap}
.sig{display:flex;align-items:flex-end;gap:.04em;margin:0;font:400 clamp(90px,21vw,300px)/.78 var(--display);white-space:nowrap;transform:translateY(.12em)}
.sig .n{color:transparent;-webkit-text-stroke:1.5px rgba(189,167,142,.55)}
.sig .d{color:transparent;-webkit-text-stroke:1.5px var(--granate2)}
@media (max-width:820px){.f3a{flex-direction:column;align-items:flex-start}.sig{font-size:22vw}}

/* 4 · Escudos (nuevo) */
.f4a{display:grid;grid-template-columns:auto 1fr;gap:28px;align-items:center;padding-block:40px 30px;border-bottom:1px solid var(--line)}
.f4a .lbl{margin:0;font:600 12px var(--cond);letter-spacing:.2em;text-transform:uppercase;color:var(--amber)}
.f4a .lbl b{display:block;margin-top:4px;font:400 34px/1 var(--display);letter-spacing:.02em;color:var(--bone)}
.crests{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:12px}
.crests li{list-style:none}
.crests img{display:block;width:44px;height:44px;object-fit:contain;filter:grayscale(1) brightness(1.4);opacity:.45;transition:filter .3s,opacity .3s,transform .3s var(--ease)}
.crests li:first-child img{filter:none;opacity:1}
@media (hover:hover) and (pointer:fine){.crests img:hover{filter:none;opacity:1;transform:translateY(-3px)}}

.f4b{display:flex;align-items:center;justify-content:space-between;gap:20px;padding-block:22px 30px;flex-wrap:wrap}
@media (max-width:820px){.f4a{grid-template-columns:1fr}.crests{justify-content:flex-start;gap:10px}.crests img{width:36px;height:36px}.f4b{flex-direction:column;align-items:flex-start}}

/* 5 · Dorsal (nuevo) */
.f5{display:grid;grid-template-columns:1fr auto 1fr;align-items:end;gap:24px;padding-block:44px 34px}
.f5 .left{display:grid;gap:16px;align-content:end}
.f5 .back{text-align:center}
.f5 .back small{display:block;font:400 clamp(26px,3vw,38px)/1 var(--display);letter-spacing:.32em;padding-left:.32em;color:var(--cream)}
.f5 .back b{display:block;font:400 clamp(150px,17vw,240px)/.8 var(--display);color:transparent;-webkit-text-stroke:2px var(--amber);margin-top:4px}
.f5 .back p{margin:10px 0 0;font:600 12px var(--cond);letter-spacing:.2em;text-transform:uppercase;color:var(--gray)}
.f5 .right{display:grid;gap:16px;justify-items:end}
.f5 .right .copy{text-align:right}
@media (max-width:820px){.f5{grid-template-columns:1fr;justify-items:center;text-align:center}.f5 .back{order:-1}.f5 .left,.f5 .right{justify-items:center}.f5 .right .copy{text-align:center}}
.foot{padding-block:48px;color:var(--gray);font-size:13px;text-align:center}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:0s!important}}
