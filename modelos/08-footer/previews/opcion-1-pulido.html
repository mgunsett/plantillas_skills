<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Footer — Opción 1: El mismo, pulido</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@400;500;600;700&family=Barlow:wght@300;400;500;600&display=swap" rel="stylesheet" />
<style>:root { --dark: #151212; --brown: #191314; --line: rgba(243,238,227,0.10); --line-2: rgba(243,238,227,0.18); --red: #EF2D38; --gold: #D9BE7E; --gold-deep: #B89B5E; --bone: #F3EEE3; --gray: #A39B92; --dev-green: #2D5A47; --dev-cream: #E8D5A3; --ease-out: cubic-bezier(0.23, 1, 0.32, 1); }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--dark); color: var(--bone); font-family: 'Barlow', sans-serif; -webkit-font-smoothing: antialiased; }
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
.preview-note { font: 500 12px 'Barlow Condensed', sans-serif; color: var(--gray); padding: 14px 24px; border-bottom: 1px solid var(--line); }
.preview-note b { color: var(--bone); font-weight: 600; }
/* Final de la sección Contacto, para ver la transición */
.prev { height: 220px; display: flex; align-items: flex-end; padding: 0 40px 40px; max-width: 1400px; margin: 0 auto; }
.prev span { font: 500 13px 'Barlow Condensed', sans-serif; color: rgba(163,155,146,.5); }
.logo { font: 400 36px/1 'Bebas Neue', sans-serif; letter-spacing: .08em; color: var(--red); }
.logo span { color: var(--gray); margin-left: 1px; }
.dev { font: 500 13px 'Barlow Condensed', sans-serif; color: var(--gray); }
.dev a { display: inline-flex; align-items: center; gap: 6px; color: var(--dev-cream); font-weight: 600; font-size: 14px; border-bottom: 1px solid rgba(45,90,71,.9); padding-bottom: 1px; transition: border-color .2s ease, color .2s ease; }
.dev a svg { width: 18px; height: 18px; color: #4f9a7a; }
@media (hover: hover) and (pointer: fine) { .dev a:hover { border-color: var(--dev-cream); } }
a:focus-visible, button:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; border-radius: 4px; }
.top-btn { display: inline-flex; align-items: center; gap: 8px; font: 600 14px 'Barlow Condensed', sans-serif; color: var(--bone); padding: 10px 14px 10px 16px; border: 1px solid var(--line-2); border-radius: 999px; transition: border-color .2s ease, transform .16s var(--ease-out); }
.top-btn svg { width: 16px; height: 16px; transition: transform .25s var(--ease-out); }
.top-btn:active { transform: scale(.97); }
@media (hover: hover) and (pointer: fine) { .top-btn:hover { border-color: var(--red); } .top-btn:hover svg { transform: translateY(-2px); } }
@media (prefers-reduced-motion: reduce) { .top-btn, .top-btn svg { transition: none; } }

  footer { background: var(--brown); border-top: 1px solid var(--line); }
  .bar { max-width: 1400px; margin: 0 auto; padding: 44px 40px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 24px; }
  .left { display: flex; align-items: center; gap: 18px; }
  .copy { font: 500 14px 'Barlow Condensed', sans-serif; color: var(--gray); text-align: center; }
  .right { justify-self: end; }
  @media (max-width: 800px) {
    .bar { grid-template-columns: 1fr; justify-items: center; text-align: center; gap: 18px; padding: 40px 20px 44px; }
    .left { flex-direction: column; gap: 16px; } .right { justify-self: center; }
  }
</style></head>
<body>
<div class="preview-note"><b>Opción 1 — El mismo, pulido.</b> Misma fila de 3 partes, más legible y con "Volver arriba".</div>
<div class="prev"><span>… final de la sección Contacto</span></div>
<footer id="ft"></footer>
<script>const NAV = [['Home','#hero'],['Libertadores','#libertadores'],['Estadísticas','#estadisticas'],['Videos','#videos'],['Galería','#galeria'],['Prensa','#prensa'],['Contacto','#contact']]
const SOC = [['Instagram','https://www.instagram.com/kekipiovi18/','<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg>'],
             ['Transfermarkt','https://www.transfermarkt.com.ar/ezequiel-piovi/profil/spieler/487346','<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>']]

document.getElementById('ft').innerHTML = `

      <a class="logo" href="#hero" aria-label="Ezequiel Piovi, ir al inicio">EP<span>_</span></a>
      <button class="top-btn" data-top>Volver arriba ${UP}</button>
    </div>
    <p class="copy">${COPY}</p>
    <div class="right">${DEV}</div>
  </div>
`
document.querySelectorAll('[data-top]').forEach(b => b.addEventListener('click', () => scrollTo({ top: 0, behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' })))
</script>
</body></html>
