<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Videos — Opción 3: Temporadas</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@400;500;600;700&family=Barlow:wght@300;400;500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --dark: #151212; --line: rgba(243,238,227,0.10); --line-2: rgba(243,238,227,0.18);
    --red: #EF2D38; --red-deep: #C4151F; --gold: #D9BE7E; --gold-deep: #B89B5E; --bone: #F3EEE3; --gray: #A39B92;
    --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--dark); color: var(--bone); font-family: 'Barlow', sans-serif; -webkit-font-smoothing: antialiased; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; text-align: left; }
  .preview-note { font: 500 12px 'Barlow Condensed', sans-serif; color: var(--gray); padding: 14px 24px; border-bottom: 1px solid var(--line); }
  .preview-note b { color: var(--bone); font-weight: 600; }

  section { max-width: 1400px; margin: 0 auto; padding: 96px 40px 110px; }
  .eyebrow { font: 500 10px 'Barlow Condensed', sans-serif; letter-spacing: .2em; text-transform: uppercase; color: var(--bone); }
  h2 { font: 400 clamp(56px, 7vw, 96px)/.88 'Bebas Neue', sans-serif; color: var(--red); margin-top: 4px; }
  .k { font: 500 13px 'Barlow Condensed', sans-serif; color: var(--gray); }

  .season { position: relative; display: grid; grid-template-columns: 300px 1fr; gap: 40px; margin-top: 56px; padding-top: 34px; border-top: 1px solid var(--line-2); }
  .year { font: 400 clamp(120px, 14vw, 200px)/.78 'Bebas Neue', sans-serif; color: transparent; -webkit-text-stroke: 1.5px var(--gold-deep); }
  .season.current .year { -webkit-text-stroke-color: var(--red); }
  .club { display: flex; align-items: center; gap: 10px; margin-top: 18px; }
  .club img { width: 26px; height: 30px; object-fit: contain; }
  .club b { font: 600 18px 'Barlow Condensed', sans-serif; }
  .season .note { color: var(--gray); font-size: 15px; line-height: 1.5; margin-top: 10px; max-width: 30ch; }

  .posters { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 320px)); gap: 22px; }
  .poster { position: relative; display: block; width: 100%; aspect-ratio: 4 / 5; border-radius: 14px; overflow: hidden; background: #0c0b0b;
            box-shadow: 0 24px 50px rgba(0,0,0,.45); transition: transform .2s var(--ease-out); }
  .poster:active { transform: scale(.98); }
  .poster img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center 35%; transition: transform .5s var(--ease-out); }
  @media (hover: hover) and (pointer: fine) { .poster:hover img { transform: scale(1.04); } .poster:hover .pl { background: var(--red); } }
  .poster::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, transparent 40%, rgba(10,5,5,.92) 100%); }
  .poster .txt { position: absolute; left: 18px; right: 18px; bottom: 18px; z-index: 2; }
  .poster .txt strong { display: block; font: 400 44px/.88 'Bebas Neue', sans-serif; }
  .poster .txt span { font: 500 13px 'Barlow Condensed', sans-serif; color: rgba(243,238,227,.75); display: block; margin-top: 6px; }
  .pl { position: absolute; top: 16px; right: 16px; z-index: 2; width: 44px; height: 44px; border-radius: 50%; background: rgba(10,5,5,.55);
        border: 1px solid rgba(255,255,255,.4); display: grid; place-items: center; transition: background-color .2s ease; }
  .pl svg { width: 16px; height: 16px; margin-left: 2px; }
  .poster:focus-visible { outline: 2px solid var(--gold); outline-offset: 4px; }

  /* Modal */
  dialog { border: 0; padding: 0; background: transparent; max-width: none; max-height: none; width: 100%; height: 100%; }
  dialog::backdrop { background: rgba(10,5,5,.92); backdrop-filter: blur(10px); }
  dialog[open] .box { animation: pop .22s var(--ease-out); }
  @keyframes pop { from { opacity: 0; transform: scale(.97); } }
  .wrap { height: 100%; display: grid; place-items: center; padding: 24px; }
  .box { position: relative; height: min(86vh, 760px); aspect-ratio: 9 / 16; max-width: 100%; border-radius: 16px; overflow: hidden; background: #fff; }
  .box iframe { width: 100%; height: 100%; border: 0; }
  .close { position: fixed; top: 20px; right: 24px; width: 46px; height: 46px; border-radius: 50%; border: 1px solid rgba(255,255,255,.35); color: #fff; display: grid; place-items: center; }
  .close svg { width: 20px; height: 20px; }
  .close:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }

  @media (max-width: 900px) {
    .season { grid-template-columns: 1fr; gap: 22px; }
    .season .side { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
    .year { font-size: 120px; }
  }
  @media (max-width: 600px) {
    section { padding: 64px 20px 80px; }
    .posters { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scroll-padding: 0 20px; gap: 14px; margin: 0 -20px; padding: 0 20px 6px; scrollbar-width: none; }
    .posters::-webkit-scrollbar { display: none; }
    .posters > * { flex: 0 0 78%; scroll-snap-align: start; }
    .year { font-size: 104px; }
  }
  @media (prefers-reduced-motion: reduce) { .poster img, .poster { transition: none; } dialog[open] .box { animation: none; } }
</style>
</head>

  const play = '<svg viewBox="0 0 24 24"><path d="M7 4.5v15l12-7.5z" fill="#fff"/></svg>'
  document.getElementById('seasons').innerHTML = seasons.map(s => `
    <div class="season ${s.current ? 'current' : ''}">
      <div class="side">
        <div class="year" aria-hidden="true">${s.year}</div>
        <div>
          <div class="club"><img src="${s.logo}" alt="" /><b>${s.club}</b></div>
          <p class="note">${s.note}</p>
        </div>
      </div>
      <div class="posters" role="list" aria-label="Videos de ${s.year}">
        ${s.videos.map(v => `
          <div role="listitem"><button class="poster" data-id="${v.id}" data-title="${v.title}" aria-label="Ver ${v.title}">
            <img src="${v.cover}" alt="" />
            <span class="pl" aria-hidden="true">${play}</span>
            <span class="txt"><strong>${v.title}</strong><span>${v.sub}</span></span>
          </button></div>`).join('')}
      </div>
    </div>`).join('')

  const dlg = document.getElementById('dlg'), box = document.getElementById('box')
  document.getElementById('seasons').addEventListener('click', (e) => {
    const p = e.target.closest('.poster'); if (!p) return
    box.innerHTML = `<iframe src="https://www.instagram.com/reel/${p.dataset.id}/embed/" title="Video: ${p.dataset.title}" allow="autoplay; encrypted-media"></iframe>`
    dlg.showModal()
  })
  const close = () => { dlg.close() }
  document.getElementById('close').onclick = close
  document.getElementById('wrap').addEventListener('click', (e) => { if (e.target.id === 'wrap') close() })
  dlg.addEventListener('close', () => { box.innerHTML = '' })
</script>
