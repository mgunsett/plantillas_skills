<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Videos · Pantalla + riel</title><link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@400;500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet"><style>:root{
  --dark:#151212;--dark2:#1d1818;--line:rgba(243,238,227,.10);--line2:rgba(243,238,227,.18);
  --red:#EF2D38;--gold:#D9BE7E;--gold2:#B89B5E;--bone:#F3EEE3;--gray:#A39B92;
  --ease:cubic-bezier(.23,1,.32,1);
}
*{box-sizing:border-box;margin:0;padding:0;min-width:0}
html,body{background:var(--dark);color:var(--bone);font-family:'Barlow',sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
section{position:relative;overflow:clip;padding:120px 40px 120px}
.inner{position:relative;max-width:1240px;margin:0 auto;z-index:1}
.ghost{position:absolute;top:6%;right:4%;font:400 45vw/.8 'Bebas Neue',sans-serif;color:transparent;-webkit-text-stroke:1.5px rgba(184,155,94,.14);pointer-events:none;user-select:none}
.eyebrow{font:500 11px 'Barlow Condensed',sans-serif;letter-spacing:.2em;text-transform:uppercase;color:var(--bone)}
h2{font:400 60px/1 'Bebas Neue',sans-serif;color:var(--red)}
.head{margin-bottom:44px}
.cond{font-family:'Barlow Condensed',sans-serif}
.bebas{font-family:'Bebas Neue',sans-serif;font-weight:400}

/* ── Video principal (YouTube) ── */
.hl{position:relative;display:block;aspect-ratio:16/9;border-radius:18px;overflow:hidden;background:#000;isolation:isolate}
.hl img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .9s var(--ease)}
.hl::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(21,18,18,.05) 35%,rgba(21,18,18,.88) 100%);z-index:1}
.play{position:absolute;left:50%;top:50%;translate:-50% -50%;z-index:2;width:96px;height:96px;border-radius:50%;background:var(--red);display:grid;place-items:center;box-shadow:0 0 0 10px rgba(239,45,56,.22);transition:transform .35s var(--ease),box-shadow .35s var(--ease)}
.play svg{width:34px;height:34px;margin-left:5px;fill:var(--bone)}
.yt{display:inline-flex;align-items:center;gap:8px;font:600 12px 'Barlow Condensed',sans-serif;letter-spacing:.14em;text-transform:uppercase}
.yt i{width:22px;height:15px;border-radius:4px;background:var(--red);display:grid;place-items:center}
.yt i::before{content:"";border-left:6px solid var(--bone);border-top:4px solid transparent;border-bottom:4px solid transparent;margin-left:2px}

/* ── Reels (Instagram) ── */
.reel{position:relative;display:block;aspect-ratio:9/16;border-radius:14px;overflow:hidden;background:#000;isolation:isolate}
.reel img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .8s var(--ease)}
.reel::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(21,18,18,0) 45%,rgba(21,18,18,.92) 100%);z-index:1}
.reel .meta{position:absolute;left:14px;right:60px;bottom:14px;z-index:2}
.reel .sea{font:600 11px 'Barlow Condensed',sans-serif;letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
.reel .tit{font:400 26px/1 'Bebas Neue',sans-serif;margin-top:4px}
.reel .ig{position:absolute;top:12px;right:12px;z-index:2;width:34px;height:34px;border-radius:10px;background:rgba(21,18,18,.55);backdrop-filter:blur(6px);display:grid;place-items:center}
.reel .ig svg{width:17px;height:17px}
.reel .mini{position:absolute;right:12px;bottom:14px;z-index:2;width:40px;height:40px;border-radius:50%;border:1.5px solid rgba(243,238,227,.7);display:grid;place-items:center;opacity:.9;transition:background .3s,border-color .3s}
.reel .mini svg{width:15px;height:15px;margin-left:2px;fill:var(--bone)}

@media (hover:hover) and (pointer:fine){
  .hl:hover img{transform:scale(1.04)}
  .hl:hover .play{transform:scale(1.08);box-shadow:0 0 0 16px rgba(239,45,56,.18)}
  .reel:hover img{transform:scale(1.06)}
  .reel:hover .mini{background:var(--red);border-color:var(--red)}
}
a:focus-visible{outline:2px solid var(--gold);outline-offset:4px}

/* Una entrada coordinada */
.rv{animation:rv .9s var(--ease) both}
.rv2{animation:rv .9s var(--ease) .12s both}
.rv3{animation:rv .9s var(--ease) .24s both}
@keyframes rv{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.rv,.rv2,.rv3{animation:none}}

@media (max-width:700px){
  section{padding:80px 16px 64px}
  h2{font-size:48px}
  .head{margin-bottom:28px}
  .play{width:64px;height:64px;box-shadow:0 0 0 7px rgba(239,45,56,.22)}
  .play svg{width:24px;height:24px;margin-left:3px}
  .hl{border-radius:12px}
  .play{top:42%}
  /* slider nativo de reels */
  .slider{display:flex!important;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -16px;padding:0 16px 4px;scrollbar-width:none}
  .slider::-webkit-scrollbar{display:none}
  .slider>*{flex:0 0 62%;scroll-snap-align:center}
}

  .hlA .over{position:absolute;left:36px;right:36px;bottom:30px;z-index:2;display:flex;align-items:flex-end;justify-content:space-between;gap:24px}
  .hlA .big{font:400 92px/.85 'Bebas Neue',sans-serif}
  .hlA .sub{font:500 15px 'Barlow Condensed',sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--gray);margin-top:10px}
  .rowA{display:flex;gap:28px;margin-top:28px;align-items:stretch}
  .railA{flex:0 0 84px;border:1px solid var(--line2);border-radius:14px;display:flex;flex-direction:column;align-items:center;gap:16px;padding:16px 0;transition:background .3s,border-color .3s}
  .railA .lg{width:50px;height:50px;border-radius:14px;border:1px solid var(--red);display:grid;place-items:center}.railA .lg svg{width:24px;height:24px}

  .gridA{flex:1;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px}
  @media (hover:hover) and (pointer:fine){.railA:hover{background:var(--red);border-color:var(--red)}.railA:hover .lg{border-color:var(--bone)}}

    .hlA .over{left:16px;right:16px;bottom:14px}.hlA .big{font-size:36px}.hlA .sub{font-size:12px;margin-top:4px}.hlA .yt{display:none}
    .rowA{flex-direction:column;gap:14px;margin-top:20px}
    .railA{flex:none;flex-direction:row;padding:10px 14px;background:var(--red);border-color:var(--red)}
    .railA .lg{width:36px;height:36px;border-color:var(--bone)}.railA .w{writing-mode:horizontal-tb;rotate:none;font-size:30px;text-align:left}
    .railA .h{font:600 13px 'Barlow Condensed',sans-serif;letter-spacing:.08em;color:var(--bone)}
  }
