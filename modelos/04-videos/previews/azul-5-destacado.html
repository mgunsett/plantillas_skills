:root{
  --bg:#050b14; --bg2:#0b1626; --lime:#4d93d6; --lime-d:#1e5fa8; --mag:#d4a84b;
  --bone:#fff; --gray:#7a8ca3; --line:#4d93d640; --ease:cubic-bezier(0.23,1,0.32,1);
  --sv:1vh;
}
@supports (height:1svh){:root{--sv:1svh}}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--bone);font-family:Nippo,system-ui,sans-serif;overflow-x:hidden}
img{display:block;max-width:none}
button{font-family:inherit}
.nav{position:absolute;top:0;left:0;right:0;z-index:50;display:flex;align-items:center;justify-content:space-between;padding:22px 60px}
.nav a{color:var(--gray);text-decoration:none;font-size:12px;font-weight:700;letter-spacing:.18em;text-transform:uppercase}
.nav .links{display:flex;gap:32px;align-items:center}
.nav .logo{font-weight:700;font-size:22px;color:var(--lime);letter-spacing:.05em}
.nav .logo span{color:var(--mag)}
.nav .cta{border:1.5px solid var(--lime);color:var(--lime);padding:8px 16px;border-radius:999px}
.nav .burger{display:none;width:26px;height:16px;border-top:2px solid #fff;border-bottom:2px solid #fff;position:relative}
.nav .burger:after{content:"";position:absolute;left:0;right:0;top:5px;border-top:2px solid #fff}
@media (max-width:820px){.nav{padding:18px 20px}.nav .links,.nav .cta{display:none}.nav .burger{display:block}}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.28em;text-transform:uppercase;color:var(--gray)}
.rv{opacity:0;transform:translateY(28px);animation:rv 1s var(--ease) forwards}
@keyframes rv{to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}}
.sec{position:relative;padding:96px 60px;background:var(--bg);overflow:hidden}
.sh{margin-bottom:44px}
.sh .k{font-size:11px;font-weight:700;letter-spacing:.28em;text-transform:uppercase;color:var(--mag)}
.sh h2{font-weight:700;font-size:clamp(44px,5.4vw,84px);line-height:.9;color:var(--lime);text-transform:uppercase;margin-top:8px}
.tab{font-variant-numeric:tabular-nums}
@media (max-width:820px){.sec{padding:64px 20px}.sh{margin-bottom:28px}}
</style>
<style>
/* Destacado + reels: el highlight de YouTube grande arriba (se reproduce en el lugar)
   y abajo tres reels 9:16 de Instagram. En mobile los reels son un carrusel con snap. */
.dv{--out:cubic-bezier(.23,1,.32,1);--card:#0b1626;--line2:rgba(255,255,255,.08)}
.dv .head{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;margin-bottom:36px}
.dv .head .sh{margin-bottom:0}
.dv .ig{display:inline-flex;align-items:center;gap:10px;color:var(--bone);text-decoration:none;font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;padding:12px 18px;border:1px solid var(--line2);border-radius:999px;transition:transform 140ms var(--out),border-color 200ms ease}
.dv .ig:active{transform:scale(.97)}
.dv .ig svg{width:18px;height:18px}

/* Destacado */
.dv .main{position:relative;display:grid;grid-template-columns:minmax(0,1.9fr) minmax(0,1fr);border:1px solid var(--line2);border-radius:22px;overflow:hidden;background:var(--card)}
.dv .player{position:relative;aspect-ratio:16/9;background:#000;overflow:hidden}
.dv .player img,.dv .player iframe{position:absolute;inset:0;width:100%;height:100%;border:0;object-fit:cover}
.dv .player img{transition:transform 600ms var(--out)}
.dv .player:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 55%,rgba(5,11,20,.7));pointer-events:none}
.dv .player.on:after{display:none}
.dv .play{position:absolute;inset:0;z-index:2;display:grid;place-items:center;border:0;background:none;cursor:pointer;color:#050b14}
.dv .play span{display:grid;place-items:center;width:84px;height:84px;border-radius:50%;background:var(--mag);box-shadow:0 0 0 10px rgba(212,168,75,.18);transition:transform 160ms var(--out),box-shadow 200ms ease}
.dv .play svg{width:30px;height:30px;margin-left:4px}
.dv .play:active span{transform:scale(.94)}
.dv .play:focus-visible span{outline:2px solid var(--bone);outline-offset:4px}
.dv .dur{position:absolute;left:18px;bottom:16px;z-index:2;font-size:11px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--bone);background:rgba(5,11,20,.6);padding:7px 10px;border-radius:8px}
.dv .info{display:flex;flex-direction:column;justify-content:space-between;gap:26px;padding:34px 34px 30px}
.dv .kk{font-size:11px;font-weight:700;letter-spacing:.24em;text-transform:uppercase;color:var(--mag)}
.dv .info h3{margin-top:14px;font-size:clamp(30px,3vw,46px);font-weight:700;line-height:.95;text-transform:uppercase}
.dv .club{display:flex;align-items:center;gap:12px;margin-top:18px;font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#c3cfdd}
.dv .club img{width:34px;height:34px;object-fit:contain}
.dv .facts{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line2)}
.dv .facts div{padding-top:16px}
.dv .facts div+div{padding-left:18px;border-left:1px solid var(--line2)}
.dv .facts b{display:block;font-size:30px;font-weight:700;line-height:1;color:var(--lime)}
.dv .facts small{display:block;margin-top:6px;font-size:10px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--gray)}

/* Reels */
.dv .rh{display:flex;justify-content:space-between;align-items:baseline;margin:46px 0 18px}
.dv .rh b{font-size:13px;font-weight:700;letter-spacing:.22em;text-transform:uppercase}
.dv .rh small{font-size:11px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--gray)}
.dv .reels{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;list-style:none}
.dv .reel{position:relative;display:block;aspect-ratio:9/16;max-height:560px;width:100%;border-radius:18px;overflow:hidden;background:#000;color:var(--bone);text-decoration:none;transition:transform 160ms var(--out)}
.dv .reel:active{transform:scale(.98)}
.dv .reel:focus-visible{outline:2px solid var(--lime);outline-offset:3px}
.dv .reel img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform 500ms var(--out)}
.dv .reel:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(5,11,20,.35),transparent 30%,transparent 50%,rgba(5,11,20,.92))}
.dv .reel .tp{position:absolute;top:14px;left:14px;right:14px;z-index:2;display:flex;justify-content:space-between;align-items:center}
.dv .reel .tp span{font-size:10px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;background:rgba(5,11,20,.55);padding:6px 9px;border-radius:7px}
.dv .reel .tp svg{width:22px;height:22px}
.dv .reel .pl{position:absolute;left:50%;top:50%;z-index:2;display:grid;place-items:center;width:58px;height:58px;margin:-29px 0 0 -29px;border-radius:50%;background:rgba(255,255,255,.16);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);transition:transform 200ms var(--out),background 200ms ease}
.dv .reel .pl svg{margin-left:3px}
.dv .reel .bt{position:absolute;left:16px;right:16px;bottom:16px;z-index:2}
.dv .reel .bt b{display:block;font-size:20px;font-weight:700;line-height:1.05;text-transform:uppercase}
.dv .reel .bt small{display:block;margin-top:8px;font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#c3cfdd}
@media (hover:hover) and (pointer:fine){
 .dv .ig:hover{border-color:var(--lime)}
 .dv .play:hover span{transform:scale(1.05);box-shadow:0 0 0 14px rgba(212,168,75,.2)}
 .dv .player:hover img{transform:scale(1.02)}
 .dv .reel:hover img{transform:scale(1.04)}
 .dv .reel:hover .pl{transform:scale(1.08);background:var(--mag);color:#050b14}
}

/* Entrada escalonada, corta */
.dv .rv{opacity:0;transform:translateY(10px)}
.dv.in .rv{opacity:1;transform:none;transition:opacity 340ms var(--out),transform 340ms var(--out);transition-delay:calc(var(--i,0)*60ms)}

@media (max-width:1000px){.dv .main{grid-template-columns:1fr}.dv .info{padding:24px 22px}}
@media (max-width:820px){
 .dv .head{margin-bottom:22px}
 .dv .ig span{display:none}.dv .ig{padding:11px}
 .dv .main{border-radius:16px}
 .dv .play span{width:66px;height:66px}.dv .play svg{width:24px;height:24px}
 .dv .info{gap:20px}
 .dv .info h3{font-size:28px}
 .dv .rh{margin:34px 0 14px}
 .dv .reels{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -20px;padding:0 20px 6px;scrollbar-width:none}
 .dv .reels::-webkit-scrollbar{display:none}
 .dv .reels li{flex:none;width:68%;scroll-snap-align:center}
 .dv .dots{display:flex;justify-content:center;gap:6px;margin-top:14px}
 .dv .dots i{width:6px;height:6px;border-radius:3px;background:var(--line2);transition:width 200ms var(--out),background 200ms ease}
 .dv .dots i.on{width:18px;background:var(--lime)}
}
@media (min-width:821px){.dv .dots{display:none}}
@media (prefers-reduced-motion:reduce){.dv .rv{transform:none}.dv.in .rv{transition:opacity 200ms ease}.dv *{transition-duration:0ms!important}}
</style></head><body>

igl.innerHTML=IGI+'<span>'+P.instagram.h+'</span>';igl.href=P.instagram.u;igl.setAttribute('aria-label','Instagram de '+P.full+' ('+P.instagram.h+')')
main.innerHTML=`<div class="player" id="pl"><img src="${H.img}" alt="Portada del video ${H.f}"><button class="play" type="button" id="playb" aria-label="Reproducir ${H.f}"><span>${PLAY}</span></button><span class="dur">YouTube · Highlights</span></div>
<div class="info"><div><div class="kk">Video principal</div><h3>${H.f}</h3><div class="club"><img src="${H.crest}" alt="">${H.club} · ${H.lg}</div></div>
<div class="facts"><div><b>${SEASON_BY('goles').v||'—'}</b><small>Goles en ${P.seasonShort}</small></div><div><b>${SEASON_BY('val').v||'—'}</b><small>Valoración</small></div></div></div>`
// Se carga el reproductor recién al tocar play: la página no baja YouTube hasta que hace falta.
playb.addEventListener('click',()=>{if(!H.yt){open(VURL(H),'_blank','noopener');return}
 pl.classList.add('on');pl.innerHTML=`<iframe src="https://www.youtube-nocookie.com/embed/${H.yt}?autoplay=1&rel=0&playsinline=1" title="${H.f}" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>`})
rc.textContent=R.length+' reels';
reels.innerHTML=R.map((r,i)=>`<li class="rv" style="--i:${4+i}"><a class="reel" href="${r.ig?'https://www.instagram.com/reel/'+r.ig+'/':P.instagram.u}" target="_blank" rel="noopener" aria-label="Ver reel: ${r.t}, en Instagram">
<img src="${r.img}" alt="" loading="lazy"><span class="tp"><span>Reel ${String(i+1).padStart(2,'0')}</span>${IGI}</span><span class="pl">${PLAY}</span><span class="bt"><b>${r.t}</b><small>${r.club}</small></span></a></li>`).join('')
dots.innerHTML=R.map((_,i)=>`<i class="${i?'':'on'}"></i>`).join('')
const D=[...dots.children],items=[...reels.children]
reels.addEventListener('scroll',()=>{const c=reels.scrollLeft+reels.clientWidth/2;let k=0,b=1e9;items.forEach((el,i)=>{const d=Math.abs(el.offsetLeft+el.offsetWidth/2-c);if(d<b){b=d;k=i}});D.forEach((d,i)=>d.classList.toggle('on',i===k))},{passive:true})
const io=new IntersectionObserver(([e])=>{if(e.isIntersecting){sec.classList.add('in');io.disconnect()}},{rootMargin:'0px 0px -12% 0px'});io.observe(sec)
})()
</script>
