:root{
  --bg:#050b14; --bg2:#0b1626; --lime:#4d93d6; --lime-d:#1e5fa8; --mag:#d4a84b;
  --bone:#fff; --gray:#7a8ca3; --line:#4d93d640; --ease:cubic-bezier(0.23,1,0.32,1);
  --sv:1vh;
}
@supports (height:1svh){:root{--sv:1svh}}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--bone);font-family:Nippo,system-ui,sans-serif;overflow-x:hidden}
img{display:block;max-width:none}
button{font-family:inherit}
.nav{position:absolute;top:0;left:0;right:0;z-index:50;display:flex;align-items:center;justify-content:space-between;padding:22px 60px}
.nav a{color:var(--gray);text-decoration:none;font-size:12px;font-weight:700;letter-spacing:.18em;text-transform:uppercase}
.nav .links{display:flex;gap:32px;align-items:center}
.nav .logo{font-weight:700;font-size:22px;color:var(--lime);letter-spacing:.05em}
.nav .logo span{color:var(--mag)}
.nav .cta{border:1.5px solid var(--lime);color:var(--lime);padding:8px 16px;border-radius:999px}
.nav .burger{display:none;width:26px;height:16px;border-top:2px solid #fff;border-bottom:2px solid #fff;position:relative}
.nav .burger:after{content:"";position:absolute;left:0;right:0;top:5px;border-top:2px solid #fff}
@media (max-width:820px){.nav{padding:18px 20px}.nav .links,.nav .cta{display:none}.nav .burger{display:block}}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.28em;text-transform:uppercase;color:var(--gray)}
.rv{opacity:0;transform:translateY(28px);animation:rv 1s var(--ease) forwards}
@keyframes rv{to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}}
.sec{position:relative;padding:96px 60px;background:var(--bg);overflow:hidden}
.sh{margin-bottom:44px}
.sh .k{font-size:11px;font-weight:700;letter-spacing:.28em;text-transform:uppercase;color:var(--mag)}
.sh h2{font-weight:700;font-size:clamp(44px,5.4vw,84px);line-height:.9;color:var(--lime);text-transform:uppercase;margin-top:8px}
.tab{font-variant-numeric:tabular-nums}
@media (max-width:820px){.sec{padding:64px 20px}.sh{margin-bottom:28px}}
</style>
<style>
/* Cronología: las notas ordenadas en el tiempo sobre una línea que se dibuja al bajar.
   Cada nota muestra el mes, el medio y el club en el que estaba cuando salió. */
.cr{--out:cubic-bezier(.23,1,.32,1);--io:cubic-bezier(.77,0,.175,1);--card:#0b1626;--line2:rgba(255,255,255,.08)}
.cr .lay{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.6fr);gap:64px;align-items:start}
.cr .intro{position:sticky;top:40px}
.cr .intro p{margin-top:22px;max-width:32ch;font-size:17px;line-height:1.5;color:#c3cfdd}
.cr .intro .meta{display:flex;gap:28px;margin-top:30px}
.cr .intro .meta b{display:block;font-size:40px;font-weight:700;line-height:1;color:var(--lime)}
.cr .intro .meta small{font-size:10px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--gray)}
.tl{position:relative;list-style:none;padding-left:150px}
.tl .ax{position:absolute;left:118px;top:8px;bottom:8px;width:1px;background:var(--line2)}
.tl .ax i{position:absolute;inset:0;background:linear-gradient(var(--mag),var(--lime));transform-origin:top;transform:scaleY(0);transition:transform 900ms var(--io)}
.cr.in .tl .ax i{transform:scaleY(1)}
.it{position:relative;margin-bottom:22px}
.it:last-child{margin-bottom:0}
.it .when{position:absolute;left:-150px;top:22px;width:96px;text-align:right}
.it .when b{display:block;font-size:30px;font-weight:700;line-height:.9;text-transform:uppercase;color:var(--bone)}
.it .when span{display:block;margin-top:4px;font-size:12px;font-weight:700;letter-spacing:.2em;color:var(--gray)}
.it .dot{position:absolute;left:-38px;top:30px;width:13px;height:13px;border-radius:50%;background:var(--bg);border:2px solid var(--mag)}
.card{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px 24px;padding:24px 26px;border:1px solid var(--line2);border-radius:18px;background:var(--card);color:inherit;text-decoration:none;transition:transform 160ms var(--out),border-color 200ms ease,background 200ms ease}
.card:active{transform:scale(.985)}
.card:focus-visible{outline:2px solid var(--lime);outline-offset:3px}
.card .src{display:flex;align-items:center;gap:12px}
.card .src img{width:40px;height:40px;border-radius:10px;object-fit:cover;background:#fff}
.card .src b{font-size:12px;font-weight:700;letter-spacing:.18em;text-transform:uppercase}
.card .club{display:flex;align-items:center;gap:8px;font-size:10px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--gray);border:1px solid var(--line2);border-radius:999px;padding:6px 12px 6px 6px;align-self:start}
.card .club img{width:22px;height:22px;object-fit:contain}
.card h3{grid-column:1/-1;font-size:clamp(20px,1.9vw,28px);font-weight:700;line-height:1.12;text-transform:uppercase}
.card p{grid-column:1/-1;margin-top:-6px;font-size:15px;line-height:1.5;color:#c3cfdd}
.card .go{grid-column:1/-1;display:flex;align-items:center;gap:10px;font-size:11px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--lime)}
.card .go svg{transition:transform 200ms var(--out)}
@media (hover:hover) and (pointer:fine){
 .card:hover{border-color:var(--lime);background:#0e1d33}
 .card:hover .go svg{transform:translateX(4px)}
}
/* Entrada: la línea se dibuja y las notas aparecen una tras otra */
.cr .rv{opacity:0;transform:translateY(12px)}

(()=>{
