/* ── Paleta actual del sitio (theme.js → brandLight) + Nippo ── */
:root{
  --bg:#FCF7F0;       /* brand.dark (fondo crema) */
  --panel:#F5EFE8;    /* brand.dark3 */
  --ink:#1A1612;      /* brand.bone / brand.amber (texto y títulos) */
  --gold:#D4A574;     /* brand.dorado */
  --gold-deep:#A67C4A;/* brand.orange */
  --muted:#8B7355;    /* brand.gray */
  --num:#B8A485;      /* brand.gray2 (números grandes) */
  --cream:#E8D5C3;    /* brand.brownDark */
  --rec:#E63946;      /* brand.rec */
  --line:rgba(26,22,18,.12); --line-2:rgba(26,22,18,.24);
  --ease:cubic-bezier(.23,1,.32,1);
  --f:'Nippo',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#E9E1D6;color:var(--ink);font-family:var(--f);-webkit-font-smoothing:antialiased}
img{display:block}
section.press{background:var(--bg);border-radius:22px 22px 0 0;box-shadow:0 -24px 80px rgba(0,0,0,.18);padding:88px 40px 110px;margin-top:40px}
.wrap{max-width:1400px;margin:0 auto}
.eyebrow{font:500 10px/1 var(--f);letter-spacing:.28em;text-transform:uppercase;color:var(--ink)}
h2.title{font:700 clamp(40px,4.6vw,60px)/1 var(--f);color:var(--ink);margin-top:8px;letter-spacing:-.01em}
h3{font:700 15px/1 var(--f);letter-spacing:.24em;text-transform:uppercase;color:var(--ink)}
.k{font:500 10px/1.3 var(--f);letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.v{font:700 15px/1.2 var(--f);color:var(--ink)}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap}
.head p{max-width:44ch;color:var(--muted);font:400 14px/1.6 var(--f)}
/* Entrada coordinada: un solo reveal por bloque */
.rv{opacity:0;transform:translate3d(0,28px,0);transition:opacity .9s var(--ease),transform .9s var(--ease);transition-delay:calc(var(--i,0) * 90ms)}
.in .rv,.rv.in{opacity:1;transform:none}
:focus-visible{outline:2px solid var(--gold-deep);outline-offset:3px;border-radius:4px}
@media (prefers-reduced-motion:reduce){.rv,.rv *,.segs i,.zone{opacity:1;transform:none !important;transition:none !important}}
@media (max-width:720px){section.press{padding:64px 16px 80px;border-radius:14px 14px 0 0}}

/* ── Opción 4: Zócalo — cada nota como el gráfico de una transmisión ── */
:root{--ease-out:cubic-bezier(.23,1,.32,1);--ease-io:cubic-bezier(.77,0,.175,1)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.tv{margin-top:40px;position:relative;aspect-ratio:16/9;max-height:78vh;width:100%;border-radius:14px;overflow:hidden;background:#1A1612;isolation:isolate}
.tv .ph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:grayscale(1) contrast(1.08) brightness(.82);transition:opacity .45s var(--ease-out),filter .45s var(--ease-out)}
.tv .ph.out{opacity:0;filter:grayscale(1) blur(6px) brightness(.82)}
.tv::after{content:'';position:absolute;inset:0;z-index:1;pointer-events:none;background:linear-gradient(180deg,transparent 45%,rgba(26,22,18,.55) 100%)}
/* El zócalo: barra de transmisión, entra con un barrido de izquierda a derecha */
.lt{position:absolute;left:40px;right:40px;bottom:36px;z-index:2;display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:stretch;
  clip-path:inset(0 0 0 0);transition:clip-path .32s var(--ease-out)}
.lt.wipe{clip-path:inset(0 100% 0 0);transition:none}
.lt-logo{display:grid;place-items:center;width:92px;background:#FCF7F0;border-radius:10px 0 0 10px}
.lt-logo img{width:58px;height:58px;object-fit:contain}
.lt-body{background:#1A1612;color:#FCF7F0;padding:20px 26px 20px;min-width:0}
.lt-body small{display:block;font:500 12px/1 var(--f);color:#B8A485}
.lt-body h3{margin-top:8px;font:700 clamp(22px,2.4vw,34px)/1 var(--f);text-transform:uppercase;letter-spacing:-.005em;color:#FCF7F0}
.lt-body p{margin-top:10px;font:400 14px/1.5 var(--f);color:#D9CBB8;max-width:64ch}
.lt-stat{display:flex;flex-direction:column;justify-content:center;align-items:flex-start;gap:6px;min-width:170px;padding:16px 24px;background:var(--gold);color:#1A1612;border-radius:0 10px 10px 0}
.lt-stat b{font:700 46px/.9 var(--f);letter-spacing:-.02em}
.lt-stat span{font:500 13px/1.1 var(--f)}
.lt a{display:inline-flex;align-items:center;gap:8px;margin-top:14px;font:700 12px/1 var(--f);color:var(--gold);text-decoration:none;border-bottom:1.5px solid rgba(212,165,116,.5);padding-bottom:4px;transition:border-color .2s ease}
.lt a:focus-visible{outline:2px solid var(--gold);outline-offset:4px}
@media (hover:hover) and (pointer:fine){.lt a:hover{border-color:var(--gold)}}
.onair{position:absolute;top:22px;left:24px;z-index:2;display:flex;align-items:center;gap:8px;padding:7px 11px;border-radius:6px;background:rgba(26,22,18,.6);color:#FCF7F0;font:500 12px/1 var(--f)}
.onair i{width:8px;height:8px;border-radius:50%;background:var(--rec)}
/* Canales: cambian la nota en pantalla */
.channels{margin-top:14px;display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.ch{position:relative;display:flex;align-items:center;gap:14px;padding:16px 18px;border-radius:12px;border:1px solid var(--line-2);text-align:left;background:var(--bg);
  transition:border-color .2s ease,background .2s ease,transform .16s var(--ease-out)}
.ch:active{transform:scale(.97)}
.ch img{width:40px;height:40px;object-fit:contain;border-radius:8px;background:#fff;border:1px solid var(--line);padding:3px;flex:none}
.ch strong{display:block;font:700 14px/1.1 var(--f)}
.ch small{display:block;margin-top:5px;font:400 12px/1 var(--f);color:var(--muted)}
.ch[aria-selected="true"]{background:#1A1612;border-color:#1A1612;color:#FCF7F0}
.ch[aria-selected="true"] small{color:#B8A485}
.ch[aria-selected="true"]::after{content:'';position:absolute;left:18px;right:18px;top:-1px;height:3px;border-radius:0 0 3px 3px;background:var(--gold)}
.ch:focus-visible{outline:2px solid var(--gold-deep);outline-offset:3px}

Bi04GHPzMfMYAAA=', pos: 'center 18%' } }
const $ = id => document.getElementById(id)
const channels = $('channels')
channels.innerHTML = PRESS.map((n, i) => `<button class="ch" role="tab" id="ch-${i}" aria-controls="tv" data-i="${i}">
  <img src="${n.logo}" alt=""><span><strong>${n.media}</strong><small>${n.date}</small></span></button>`).join('')
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches
let cur = -1
const show = (i, { animate = true } = {}) => {
  if (i === cur) return; cur = i
  const n = PRESS[i], x = EXTRA[n.media]
  channels.querySelectorAll('.ch').forEach((c, j) => { c.setAttribute('aria-selected', j === i); c.tabIndex = j === i ? 0 : -1 })
  $('tv').setAttribute('aria-labelledby', 'ch-' + i)
  const paint = () => {
    $('ph').src = x.ph; $('ph').style.objectPosition = x.pos; $('ph').classList.remove('out')
    $('lt-logo').src = n.logo; $('lt-src').textContent = `${n.media}, ${n.date.toLowerCase()}`; $('lt-title').textContent = n.title
    $('lt-quote').textContent = n.quote; $('lt-link').href = n.url; $('lt-num').textContent = x.num; $('lt-unit').textContent = x.unit
    $('onair').textContent = `${n.type} en Instagram`
  }
  if (!animate) { paint(); return }
  // Barrido del zócalo: se oculta al instante y vuelve a entrar desde la izquierda
  const lt = $('lt'); lt.classList.add('wipe'); $('ph').classList.add('out')
  setTimeout(() => { paint(); lt.offsetWidth; lt.classList.remove('wipe') }, reduce ? 120 : 180)
}
channels.addEventListener('click', e => { const c = e.target.closest('.ch'); if (c) show(+c.dataset.i) })
// Con teclado no se anima: es una acción repetida y tiene que sentirse inmediata
channels.addEventListener('keydown', e => { const d = { ArrowRight: 1, ArrowLeft: -1 }[e.key]; if (!d) return
  e.preventDefault(); const n = (cur + d + PRESS.length) % PRESS.length; show(n, { animate: false }); channels.children[n].focus()
  channels.scrollTo({ left: channels.children[n].offsetLeft - 16, behavior: 'auto' }) })
show(PRESS.findIndex(n => n.featured), { animate: false })
</script>
