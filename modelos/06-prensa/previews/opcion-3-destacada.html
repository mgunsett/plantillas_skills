<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Prensa — Opción 3: Destacada</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@400;500;600;700&family=Barlow:wght@300;400;500;600&display=swap" rel="stylesheet" />
<style>
  :root { --dark: #151212; --panel: #1c1818; --line: rgba(243,238,227,0.10); --line-2: rgba(243,238,227,0.18); --red: #EF2D38; --gold: #D9BE7E; --gold-deep: #B89B5E; --bone: #F3EEE3; --gray: #A39B92; --ease-out: cubic-bezier(0.23, 1, 0.32, 1); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--dark); color: var(--bone); font-family: 'Barlow', sans-serif; -webkit-font-smoothing: antialiased; }
  .preview-note { font: 500 12px 'Barlow Condensed', sans-serif; color: var(--gray); padding: 14px 24px; border-bottom: 1px solid var(--line); }
  .preview-note b { color: var(--bone); font-weight: 600; }
  section { max-width: 1400px; margin: 0 auto; padding: 96px 40px 110px; }
  .eyebrow { font: 500 10px 'Barlow Condensed', sans-serif; letter-spacing: .2em; text-transform: uppercase; color: var(--bone); }
  h2 { font: 400 clamp(56px, 7vw, 96px)/.88 'Bebas Neue', sans-serif; color: var(--red); margin-top: 4px; }
  .k { font: 500 13px 'Barlow Condensed', sans-serif; color: var(--gray); }
  a { color: inherit; text-decoration: none; }

  .layout { margin-top: 44px; display: grid; grid-template-columns: 1.7fr 1fr; gap: 16px; }

  /* Destacada */
  .feat { position: relative; border-radius: 20px; overflow: hidden; min-height: 560px; display: flex; flex-direction: column; justify-content: flex-end; padding: 44px; }
  .feat img.bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 30% 30%; filter: grayscale(1) contrast(1.05); opacity: .35; transition: transform .8s var(--ease-out); }
  .feat::before { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(21,18,18,.2) 0%, rgba(21,18,18,.92) 62%, #151212 100%); }
  .feat > * { position: relative; }
  .quote-mark { font: 400 220px/.6 'Bebas Neue', sans-serif; color: var(--red); height: 90px; }
  .feat .title { font: 400 clamp(40px, 4.4vw, 68px)/.92 'Bebas Neue', sans-serif; max-width: 20ch; margin-top: 10px; }
  .feat .foot { display: flex; align-items: center; gap: 14px; margin-top: 28px; flex-wrap: wrap; }
  .logo { width: 44px; height: 44px; border-radius: 10px; background: #fff; object-fit: contain; padding: 3px; }
  .feat .foot b { font: 600 17px 'Barlow Condensed', sans-serif; }
  .btn { margin-left: auto; display: inline-flex; align-items: center; gap: 8px; padding: 12px 18px; border-radius: 999px; background: var(--bone); color: #151212; font: 700 15px 'Barlow Condensed', sans-serif; transition: transform .16s var(--ease-out); }
  .btn svg { width: 16px; height: 16px; }
  .feat:active .btn { transform: scale(.97); }
  @media (hover: hover) and (pointer: fine) { .feat:hover img.bg { transform: scale(1.03); } }
  .feat:focus-visible, .item:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }

  /* Resto */
  .side { display: grid; grid-template-rows: 1fr 1fr; gap: 16px; }
  .item { border: 1px solid var(--line-2); border-radius: 20px; padding: 28px; display: flex; flex-direction: column; transition: border-color .2s ease, background-color .2s ease; }
  .item .top { display: flex; align-items: center; gap: 12px; }
  .item .top b { display: block; font: 600 16px 'Barlow Condensed', sans-serif; }
  .item .title { font: 400 30px/1 'Bebas Neue', sans-serif; margin-top: 20px; }
  .item .cta { margin-top: auto; padding-top: 20px; display: inline-flex; align-items: center; gap: 6px; font: 600 14px 'Barlow Condensed', sans-serif; color: var(--gold); }
  .item .cta svg { width: 15px; height: 15px; transition: transform .25s var(--ease-out); }
  @media (hover: hover) and (pointer: fine) { .item:hover { border-color: var(--red); background: rgba(239,45,56,.04); } .item:hover .cta svg { transform: translate(2px,-2px); } }

  @media (max-width: 1000px) { .layout { grid-template-columns: 1fr; } .side { grid-template-columns: 1fr 1fr; grid-template-rows: none; } .feat { min-height: 480px; } }
  @media (max-width: 640px) {
    section { padding: 64px 20px 80px; }
    .feat { padding: 26px; min-height: 460px; border-radius: 16px; }
    .quote-mark { font-size: 160px; height: 64px; }
    .btn { margin-left: 0; }
    .side { grid-template-columns: 1fr; }
    .item { padding: 22px; border-radius: 16px; }
  }
  @media (prefers-reduced-motion: reduce) { .feat img.bg, .btn, .item .cta svg { transition: none; } }
</style>
</head>
