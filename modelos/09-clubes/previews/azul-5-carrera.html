:root{
  --bg:#050b14; --bg2:#0b1626; --lime:#4d93d6; --lime-d:#1e5fa8; --mag:#d4a84b;
  --bone:#fff; --gray:#7a8ca3; --line:#4d93d640; --ease:cubic-bezier(0.23,1,0.32,1);
  --sv:1vh;
}
@supports (height:1svh){:root{--sv:1svh}}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--bone);font-family:Nippo,system-ui,sans-serif;overflow-x:hidden}
img{display:block;max-width:none}
button{font-family:inherit}
.nav{position:absolute;top:0;left:0;right:0;z-index:50;display:flex;align-items:center;justify-content:space-between;padding:22px 60px}
.nav a{color:var(--gray);text-decoration:none;font-size:12px;font-weight:700;letter-spacing:.18em;text-transform:uppercase}
.nav .links{display:flex;gap:32px;align-items:center}
.nav .logo{font-weight:700;font-size:22px;color:var(--lime);letter-spacing:.05em}
.nav .logo span{color:var(--mag)}
.nav .cta{border:1.5px solid var(--lime);color:var(--lime);padding:8px 16px;border-radius:999px}
.nav .burger{display:none;width:26px;height:16px;border-top:2px solid #fff;border-bottom:2px solid #fff;position:relative}
.nav .burger:after{content:"";position:absolute;left:0;right:0;top:5px;border-top:2px solid #fff}
@media (max-width:820px){.nav{padding:18px 20px}.nav .links,.nav .cta{display:none}.nav .burger{display:block}}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.28em;text-transform:uppercase;color:var(--gray)}
.rv{opacity:0;transform:translateY(28px);animation:rv 1s var(--ease) forwards}
@keyframes rv{to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}}
.sec{position:relative;padding:96px 60px;background:var(--bg);overflow:hidden}
.sh{margin-bottom:44px}
.sh .k{font-size:11px;font-weight:700;letter-spacing:.28em;text-transform:uppercase;color:var(--mag)}
.sh h2{font-weight:700;font-size:clamp(44px,5.4vw,84px);line-height:.9;color:var(--lime);text-transform:uppercase;margin-top:8px}
.tab{font-variant-numeric:tabular-nums}
@media (max-width:820px){.sec{padding:64px 20px}.sh{margin-bottom:28px}}
</style>
<style>
/* Carrera en el tiempo: cada club es una barra sobre el eje de años (cuánto estuvo, qué se superpone, dónde salió campeón).
   Tocás una barra y la ficha del club se abre al costado (desktop) o debajo de la fila (mobile). */
.car{--A:var(--lime);--B:var(--mag);--T:var(--bone);--S:#c3cfdd;--on:#050b14;--hov:#ffffff08}
.car .top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:24px;margin-bottom:34px}
.car .sh{margin-bottom:0}
.sum{display:flex;gap:28px;flex-wrap:wrap}
.sum div b{display:block;font-size:clamp(34px,3.2vw,52px);font-weight:700;line-height:.9;color:var(--T);font-variant-numeric:tabular-nums}
.sum div small{display:block;margin-top:6px;font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--gray)}
.legend{display:flex;flex-wrap:wrap;gap:8px 18px;margin-bottom:18px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gray)}
.legend span{display:inline-flex;align-items:center;gap:8px}
.legend i{width:22px;height:8px;border-radius:4px;background:var(--c)}
.legend i.loan{background:repeating-linear-gradient(-45deg,var(--gray) 0 3px,transparent 3px 6px);border:1px solid var(--gray)}
.legend i.star{width:auto;height:auto;background:none;color:var(--B);font-style:normal;font-size:13px}
.wrap{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:32px;align-items:start}
.chart{min-width:0}
.axis,.row{display:grid;grid-template-columns:210px minmax(0,1fr);gap:16px;align-items:center}
.axis{position:sticky;top:0;z-index:2;background:var(--bg);padding-bottom:8px;border-bottom:1px solid var(--line)}
.ticks{position:relative;height:18px}
.ticks span{position:absolute;top:0;transform:translateX(-50%);font-size:11px;font-weight:700;color:var(--gray);font-variant-numeric:tabular-nums}
.rows{position:relative}
.grid{position:absolute;inset:0 0 0 226px;pointer-events:none}
.grid i{position:absolute;top:0;bottom:0;width:1px;background:var(--line)}
.grid .now{width:2px;background:var(--B);opacity:.8}
.grid .now:before{content:"HOY";position:absolute;top:-2px;left:6px;font-size:9px;font-weight:700;letter-spacing:.2em;color:var(--B)}
.row{width:100%;text-align:left;background:none;border:0;color:inherit;font:inherit;cursor:pointer;padding:9px 0;border-bottom:1px solid var(--line);position:relative}
.row .who{display:flex;align-items:center;gap:12px;min-width:0}
.row .who img{width:30px;height:30px;object-fit:contain;flex:none}
.row .who span{font-size:14px;font-weight:700;text-transform:uppercase;line-height:1.1;color:var(--T);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .who small{display:block;font-size:10px;font-weight:500;letter-spacing:.16em;color:var(--gray);margin-top:3px}
.track{position:relative;height:30px}
.bar{position:absolute;top:5px;height:20px;border-radius:10px;background:var(--c);transform-origin:left center;animation:grow 1s var(--ease) both;animation-delay:var(--d);display:flex;align-items:center;justify-content:flex-end;padding:0 8px;min-width:20px}
.bar.loan{background:repeating-linear-gradient(-45deg,var(--c) 0 5px,color-mix(in srgb,var(--c) 45%,transparent) 5px 10px)}
.bar .st{position:absolute;top:50%;transform:translate(-50%,-50%);font-size:13px;color:var(--B);text-shadow:0 0 6px var(--bg)}
.bar .tag{font-size:9px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--on);white-space:nowrap}
.row.cur .bar{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--c)}
@keyframes grow{from{transform:scaleX(0)}}
.row:focus-visible{outline:2px solid var(--B);outline-offset:2px}
@media (hover:hover) and (pointer:fine){.row:hover{background:var(--hov)}}
.row[aria-expanded="true"]{background:var(--hov)}
.row[aria-expanded="true"] .who span{color:var(--A)}
.more{display:none}
/* Ficha lateral */
.card{position:sticky;top:20px;background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:24px;overflow:hidden}
.card .crest{position:absolute;right:-30px;top:-20px;width:170px;height:170px;object-fit:contain;opacity:.09}
.card .k{font-size:10px;font-weight:700;letter-spacing:.24em;text-transform:uppercase;color:var(--B)}
.card .hd{display:flex;align-items:center;gap:14px;margin-top:14px;position:relative}
.card .hd img{width:58px;height:58px;object-fit:contain}
.card h3{font-size:24px;font-weight:700;text-transform:uppercase;line-height:1;color:var(--T)}
.card dl{display:grid;grid-template-columns:1fr 1fr;margin-top:20px;border-top:1px solid var(--line);position:relative}
.card dl div{padding:12px 0;border-bottom:1px solid var(--line)}
.card dl div:nth-child(even){padding-left:14px;border-left:1px solid var(--line)}
.card dt{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--gray)}
.card dd{margin-top:4px;font-size:16px;font-weight:700;color:var(--T)}
.card ul{list-style:none;margin-top:16px;display:grid;gap:8px;position:relative}
.card li{font-size:14px;color:var(--T);display:flex;gap:8px}.card li:before{content:"★";color:var(--B)}
.card .hint{margin-top:18px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gray)}
.card.sw>*:not(.crest){animation:rv .5s var(--ease) both}
@media (max-width:1100px){.wrap{grid-template-columns:1fr}.card{display:none}
 .more{display:block;grid-column:1/-1;overflow:hidden;max-height:0;transition:max-height .45s var(--ease)}
 .row[aria-expanded="true"] .more{max-height:260px}
 .more .in{display:flex;flex-wrap:wrap;gap:6px 18px;padding:12px 0 4px;font-size:12px;color:var(--gray)}
 .more .in b{color:var(--T)}.more ul{list-style:none;width:100%;display:grid;gap:4px}.more li{color:var(--T)}.more li:before{content:"★ ";color:var(--B)}}
@media (max-width:820px){.car .top{flex-direction:column;align-items:flex-start}.sum{gap:22px}
 .axis,.row{grid-template-columns:minmax(0,1fr);gap:6px}.axis .sp{display:none}.grid{left:0}
 .row .who img{width:24px;height:24px}.ticks span:nth-child(even){display:none}.bar .tag{display:none}}
@media (prefers-reduced-motion:reduce){.bar{animation:none}.more{transition:none}}
</style></head><body>
