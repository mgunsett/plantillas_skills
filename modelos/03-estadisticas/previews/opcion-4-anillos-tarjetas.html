/* ── Paleta actual del sitio (theme.js → brandLight) + Nippo ── */
:root{
  --bg:#FCF7F0;       /* brand.dark (fondo crema) */
  --panel:#F5EFE8;    /* brand.dark3 */
  --ink:#1A1612;      /* brand.bone / brand.amber (texto y títulos) */
  --gold:#D4A574;     /* brand.dorado */
  --gold-deep:#A67C4A;/* brand.orange */
  --muted:#8B7355;    /* brand.gray */
  --num:#B8A485;      /* brand.gray2 (números grandes) */
  --cream:#E8D5C3;    /* brand.brownDark */
  --rec:#E63946;      /* brand.rec */
  --line:rgba(26,22,18,.12); --line-2:rgba(26,22,18,.24);
  --ease:cubic-bezier(.23,1,.32,1);
  --f:'Nippo',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#E9E1D6;color:var(--ink);font-family:var(--f);-webkit-font-smoothing:antialiased}
img{display:block}
section.stats{background:var(--bg);border-radius:22px 22px 0 0;box-shadow:0 -24px 80px rgba(0,0,0,.18);padding:88px 40px 110px;margin-top:40px}
.wrap{max-width:1400px;margin:0 auto}
.eyebrow{font:500 10px/1 var(--f);letter-spacing:.28em;text-transform:uppercase;color:var(--ink)}
h2.title{font:700 clamp(40px,4.6vw,60px)/1 var(--f);color:var(--ink);margin-top:8px;letter-spacing:-.01em}
h3{font:700 15px/1 var(--f);letter-spacing:.24em;text-transform:uppercase;color:var(--ink)}
.k{font:500 10px/1.3 var(--f);letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.v{font:700 15px/1.2 var(--f);color:var(--ink)}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap}
.head p{max-width:44ch;color:var(--muted);font:400 14px/1.6 var(--f)}
/* Entrada coordinada: un solo reveal por bloque */
.rv{opacity:0;transform:translate3d(0,28px,0);transition:opacity .9s var(--ease),transform .9s var(--ease);transition-delay:calc(var(--i,0) * 90ms)}
.in .rv,.rv.in{opacity:1;transform:none}
:focus-visible{outline:2px solid var(--gold-deep);outline-offset:3px;border-radius:4px}
@media (prefers-reduced-motion:reduce){.rv,.rv *,.segs i,.zone{opacity:1;transform:none !important;transition:none !important}}
@media (max-width:720px){section.stats{padding:64px 16px 80px;border-radius:14px 14px 0 0}}

/* ── Opción 3: el diseño actual (anillos + tarjetas), pulido ── */
.frame{margin-top:44px;display:grid;grid-template-columns:1fr 1.15fr 1fr;border:1px solid var(--ink);border-radius:12px;background:var(--bg)}
.frame > div{padding:44px 40px}
.frame > div + div{border-left:1px solid var(--line-2)}
.frame > .c-rings{order:1}.frame > .c-season{order:2}
.col-title{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:22px}
dl.rows div{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:14px 0;border-bottom:1px solid rgba(212,165,116,.6)}
dl.rows div:last-child{border-bottom:0}
.inline{display:inline-flex;align-items:center;gap:8px}
.inline img{width:20px;height:20px;object-fit:contain}
/* Anillos */
.rings{display:grid;grid-template-columns:repeat(3,1fr);gap:30px 12px}
.ring{text-align:center}
.ring .g{position:relative;width:96px;margin:0 auto}
.ring svg{width:100%;display:block}
.ring .arc{transition:stroke-dashoffset 1.2s var(--ease);transition-delay:calc(var(--i) * 110ms + .15s)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font:500 24px/1 var(--f);color:var(--ink)}
.ring .k{display:block;margin-top:12px;font-weight:700;color:var(--gold-deep);letter-spacing:.14em}
/* Temporada */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tiles div{border:1px solid var(--ink);border-radius:6px;padding:16px 16px 14px;transition:background .3s var(--ease)}
.tiles b{display:block;font:500 34px/1 var(--f);color:var(--num);margin-bottom:10px;letter-spacing:-.01em}
.tiles .k{color:var(--ink);font-weight:700;font-size:9px}
.tiles .hl{background:var(--ink)}
.tiles .hl b{color:var(--gold)}
.tiles .hl .k{color:#FCF7F0}
@media (hover:hover) and (pointer:fine){.tiles div:not(.hl):hover{background:rgba(212,165,116,.12)}}
/* Clubes: tarjetas */
.career{margin-top:80px;overflow:clip}
.career-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px}
.arrows{display:flex;gap:8px}
.arrows button{all:unset;cursor:pointer;width:38px;height:38px;border:1px solid var(--ink);border-radius:6px;display:grid;place-items:center;transition:background .25s var(--ease),opacity .25s}
.arrows button:disabled{opacity:.3;cursor:default}
.arrows button:focus-visible{outline:2px solid var(--gold-deep);outline-offset:3px}
@media (hover:hover) and (pointer:fine){.arrows button:not(:disabled):hover{background:rgba(212,165,116,.18)}}
.slider{margin-top:26px;display:flex;gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding:8px 2px 14px}
.slider::-webkit-scrollbar{display:none}
.card{flex:none;width:260px;scroll-snap-align:start;border:1px solid rgba(26,22,18,.25);border-radius:6px;overflow:hidden;position:relative;background:var(--bg);transition:transform .35s var(--ease),border-color .35s,box-shadow .35s}
.card.now{border-color:var(--ink)}
@media (hover:hover) and (pointer:fine){.card:hover{transform:translateY(-6px);border-color:var(--ink);box-shadow:0 18px 40px rgba(26,22,18,.12)}}
.band{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.band span{font:400 10px/1 var(--f);letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.card.now .band{background:rgba(212,165,116,.16)}
.card.now .band span:first-child{color:var(--rec)}
.band em{font:700 10px/1 var(--f);font-style:normal;color:var(--num);letter-spacing:.1em}
.body{position:relative;padding:20px 16px 24px;text-align:center;min-height:200px}
.body .wm{position:absolute;right:-50px;bottom:-60px;width:220px;height:220px;object-fit:contain;opacity:.06;filter:grayscale(1);pointer-events:none}
.crest{width:84px;height:84px;margin:0 auto;border-radius:50%;border:1px solid var(--ink);display:grid;place-items:center;background:var(--bg);position:relative}
.card.now .crest{box-shadow:0 0 0 4px var(--cream),0 0 24px rgba(212,165,116,.45)}
.crest img{width:52px;height:52px;object-fit:contain}
.body strong{display:block;margin-top:16px;font:700 15px/1.1 var(--f);text-transform:uppercase}
.body small{display:block;margin-top:6px;font:400 10px/1 var(--f);letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.body p{position:relative;margin-top:14px;font:500 11px/1.45 var(--f);color:var(--ink)}
.body p::before{content:"";display:inline-block;margin-right:7px;width:7px;height:7px;border-radius:50%;background:var(--gold-deep);vertical-align:1px}
.body p.a::before{background:none;border:1.5px solid var(--gold-deep)}

@media (max-width:1100px){
  .frame{grid-template-columns:1fr 1fr}
  .frame > .c-rings{order:3;grid-column:1 / -1;border-left:0;border-top:1px solid var(--line-2)}
  .frame > .c-season{border-left:1px solid var(--line-2)}
}
@media (max-width:720px){
  .frame{grid-template-columns:1fr}
  .frame > div{padding:28px 20px}
  .frame > div + div{border-left:0 !important;border-top:1px solid var(--line-2)}
  .rings{gap:24px 6px}
  .ring .g{width:82px}
  .ring b{font-size:20px}
  .ring .k{font-size:9px;letter-spacing:.1em}
  .tiles b{font-size:30px}
  .card{width:230px}
}
</style>
</head>

const reveal = (root, th = .2) => new IntersectionObserver((es, o) => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); o.unobserve(e.target) } }), { threshold: th })

// Columnas reordenadas: perfil → temporada → atributos (los anillos quedan abajo en tablet y mobile)
const frame=document.getElementById('frame')
document.getElementById('tiles').innerHTML=SEASON.map(s=>`<div class="${s.l==='Asistencias'?'hl':''}"><b>${s.v}</b><span class="k">${s.l}</span></div>`).join('')
const R=42, C=2*Math.PI*R
document.getElementById('rings').innerHTML=ATTRS.map(([l,v],i)=>`
  <div class="ring" style="--i:${i}">
    <div class="g"><svg viewBox="0 0 100 100" role="img" aria-label="${l}: ${v} de 100">
      <defs><linearGradient id="rg${i}" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#1A1612"/><stop offset="100%" stop-color="#D4A574"/></linearGradient></defs>
      <circle cx="50" cy="50" r="${R}" fill="none" stroke="rgba(26,22,18,.08)" stroke-width="7"/>
      <circle class="arc" cx="50" cy="50" r="${R}" fill="none" stroke="url(#rg${i})" stroke-width="7" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C}" data-to="${C*(1-v/100)}" transform="rotate(-90 50 50)"/>
    </svg><b>${v}</b></div>
    <span class="k">${l}</span>
  </div>`).join('')
const fill=()=>document.querySelectorAll('.arc').forEach(a=>a.style.strokeDashoffset=a.dataset.to)
if (matchMedia('(prefers-reduced-motion: reduce)').matches) fill()

const slider=document.getElementById('slider')
slider.innerHTML=CLUBS.map((c,i)=>`
  <article class="card ${c.now?'now':''}">
    <div class="band"><span>${c.y}</span><em>${String(CLUBS.length-i).padStart(2,'0')}</em></div>
    <div class="body">
      <img class="wm" src="${c.l}" alt="" aria-hidden="true">
      <div class="crest"><img src="${c.l}" alt="Escudo de ${c.n}" loading="lazy"></div>
      <strong>${c.n}</strong><small>${c.c}</small>
      ${c.t.map(t=>`<p>${t}</p>`).join('')}${c.a.map(a=>`<p class="a">${a}</p>`).join('')}
    </div>
  </article>`).join('')
// Flechas: mueven el riel con scrollTo (nunca scrollIntoView, que desplaza la página)
const prev=document.getElementById('prev'), next=document.getElementById('next')
const step=()=>slider.querySelector('.card').offsetWidth+16
const sync=()=>{prev.disabled=slider.scrollLeft<4;next.disabled=slider.scrollLeft+slider.clientWidth>=slider.scrollWidth-4}
prev.onclick=()=>slider.scrollTo({left:slider.scrollLeft-step()*2,behavior:'smooth'})
next.onclick=()=>slider.scrollTo({left:slider.scrollLeft+step()*2,behavior:'smooth'})
slider.addEventListener('scroll',sync,{passive:true}); sync()

const io=new IntersectionObserver((es,o)=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');if(e.target===frame)fill();o.unobserve(e.target)}}),{threshold:.2})
;[frame,document.getElementById('career')].forEach(el=>io.observe(el))
</script>
</body>
</html>
