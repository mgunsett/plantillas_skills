:root{
  --bg:#050b14; --bg2:#0b1626; --lime:#4d93d6; --lime-d:#1e5fa8; --mag:#d4a84b;
  --bone:#fff; --gray:#7a8ca3; --line:#4d93d640; --ease:cubic-bezier(0.23,1,0.32,1);
  --sv:1vh;
}
@supports (height:1svh){:root{--sv:1svh}}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--bone);font-family:Nippo,system-ui,sans-serif;overflow-x:hidden}
img{display:block;max-width:none}
button{font-family:inherit}
.nav{position:absolute;top:0;left:0;right:0;z-index:50;display:flex;align-items:center;justify-content:space-between;padding:22px 60px}
.nav a{color:var(--gray);text-decoration:none;font-size:12px;font-weight:700;letter-spacing:.18em;text-transform:uppercase}
.nav .links{display:flex;gap:32px;align-items:center}
.nav .logo{font-weight:700;font-size:22px;color:var(--lime);letter-spacing:.05em}
.nav .logo span{color:var(--mag)}
.nav .cta{border:1.5px solid var(--lime);color:var(--lime);padding:8px 16px;border-radius:999px}
.nav .burger{display:none;width:26px;height:16px;border-top:2px solid #fff;border-bottom:2px solid #fff;position:relative}
.nav .burger:after{content:"";position:absolute;left:0;right:0;top:5px;border-top:2px solid #fff}
@media (max-width:820px){.nav{padding:18px 20px}.nav .links,.nav .cta{display:none}.nav .burger{display:block}}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.28em;text-transform:uppercase;color:var(--gray)}
.rv{opacity:0;transform:translateY(28px);animation:rv 1s var(--ease) forwards}
@keyframes rv{to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}}
.sec{position:relative;padding:96px 60px;background:var(--bg);overflow:hidden}
.sh{margin-bottom:44px}
.sh .k{font-size:11px;font-weight:700;letter-spacing:.28em;text-transform:uppercase;color:var(--mag)}
.sh h2{font-weight:700;font-size:clamp(44px,5.4vw,84px);line-height:.9;color:var(--lime);text-transform:uppercase;margin-top:8px}
.tab{font-variant-numeric:tabular-nums}
@media (max-width:820px){.sec{padding:64px 20px}.sh{margin-bottom:28px}}
</style>
<style>
/* Versión OSCURA del Hero C6 (Split con ficha): mismos colores que el kit oscuro */
:root{--acc:var(--lime);--acc2:var(--mag);--ink:var(--bone);--acc-l:#4d93d61f;--deep:#0B2A4A}
</style>
<style>
/* Hero 1 (Split editorial) con la columna de texto y la tarjeta de partidos del Hero 4 (Franjas) */
.hero{position:relative;height:calc(100 * var(--sv));min-height:640px;overflow:hidden;display:grid;grid-template-columns:1.05fr 1fr;background:var(--bg2)}
.txt{position:relative;z-index:5;display:flex;flex-direction:column;justify-content:center;padding:96px 0 60px 60px}
.pos{display:inline-flex;align-items:center;gap:10px;align-self:flex-start;padding:8px 14px 8px 8px;border-radius:999px;background:var(--acc-l);font-size:11px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--acc)}
.pos b{width:26px;height:26px;border-radius:50%;background:var(--acc2);color:#fff;display:grid;place-items:center;font-size:12px;letter-spacing:0}
h1{margin-top:22px;font-weight:700;text-transform:uppercase;line-height:.84}
h1 .n1{display:block;font-size:clamp(30px,3.6vw,60px);font-weight:500;color:var(--gray);letter-spacing:.08em}
h1 .n2{display:block;font-size:clamp(72px,8.8vw,160px);color:var(--acc);margin-left:-.05em;white-space:nowrap}
.idr{display:flex;align-items:center;gap:18px;margin-top:20px;font-size:13px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--ink)}
.idr span{display:flex;align-items:center;gap:8px}
.idr img{width:24px;height:24px;object-fit:contain}
.idr i{width:1px;height:18px;background:var(--line)}
.sts{display:flex;gap:34px;margin-top:34px}
.sts b{display:block;font-size:44px;font-weight:700;line-height:1;color:var(--acc)}
.sts div.hl b{color:var(--acc2)}
.sts small{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--gray)}
.ctas{display:flex;gap:12px;margin-top:34px}
.btn{font-weight:700;font-size:12px;letter-spacing:.2em;text-transform:uppercase;padding:15px 24px;border-radius:4px;border:1.5px solid var(--acc);color:var(--acc);text-decoration:none}
.btn.solid{background:var(--acc2);border-color:var(--acc2);color:#fff}
@media (hover:hover) and (pointer:fine){.btn{transition:transform .25s var(--ease)}.btn:hover{transform:translateY(-2px)}}
.vis{position:relative}
.panel{position:absolute;inset:0 0 0 -8%;background:var(--acc);clip-path:polygon(22% 0,100% 0,100% 100%,0 100%);animation:pn 1.2s var(--ease) both;overflow:hidden}
@keyframes pn{from{transform:translateX(30%);opacity:0}}
.panel:before{content:attr(data-n);position:absolute;right:-2%;top:-8%;font-weight:700;font-size:78vh;line-height:1;color:transparent;-webkit-text-stroke:2px #ffffff26}
.panel:after{content:"";position:absolute;left:0;right:0;bottom:0;height:10px;background:var(--acc2)}
.player{position:absolute;bottom:0;left:50%;transform:translateX(-50%);height:90%;z-index:3;filter:drop-shadow(-24px 20px 40px #050b1455);animation:pl 1.4s var(--ease) .3s both}
@keyframes pl{from{opacity:0;transform:translate(-40%,0)}}
.match{position:absolute;right:40px;bottom:40px;z-index:6;display:grid;grid-template-columns:1fr 1fr;background:#fff;border-radius:6px;box-shadow:0 20px 50px #050b1440;overflow:hidden;animation:bx 1s var(--ease) .9s both}
@keyframes bx{from{opacity:0;transform:translateY(24px)}}
.match div{padding:14px 18px;min-width:170px}
.match div+div{border-left:1px solid var(--line)}
.match small{display:block;font-size:9px;font-weight:700;letter-spacing:.24em;text-transform:uppercase;color:var(--gray);margin-bottom:6px}
.match div+div small{color:var(--acc2)}
.match b{font-size:18px;font-weight:700;color:var(--acc);letter-spacing:.06em;font-variant-numeric:tabular-nums}
.match em{display:block;font-style:normal;font-size:10px;color:var(--gray);letter-spacing:.1em;margin-top:4px;text-transform:uppercase}
.nav .links:nth-child(3) a{color:#fff;opacity:.9}.nav .links:nth-child(3) .cta{background:#fff;color:var(--acc)}
@media (max-width:1180px){.sts{gap:22px}.sts b{font-size:36px}}
@media (max-width:820px){
  .nav .burger,.nav .logo{color:#fff}
  .hero{grid-template-columns:1fr;grid-template-rows:50% 50%;min-height:780px}
  .vis{grid-row:1}
  .panel{inset:0;clip-path:polygon(0 0,100% 0,100% 84%,0 100%)}
  .panel:before{font-size:50vh;right:-6%}
  .panel:after{display:none}
  /* El recorte sale del panel y apoya los pies justo sobre la tarjeta de partidos */
  .vis{position:static}
  .panel{inset:0 0 50% 0}
  .player{height:auto;width:min(112vw,560px);max-height:calc(100% - var(--mh) - 90px);object-fit:contain;object-position:bottom;bottom:calc(var(--mh) + 20px);z-index:3;
    /* La parte que queda detrás del texto se funde para que el nombre y los números se lean */
    -webkit-mask-image:linear-gradient(180deg,#000 0%,#000 48%,#0000002e 66%,#0000001f 100%);mask-image:linear-gradient(180deg,#000 0%,#000 48%,#0000002e 66%,#0000001f 100%)}
  .hero{--mh:84px}
  .match{height:var(--mh)}
  .txt{grid-row:2;justify-content:flex-start;padding:8px 20px 112px}
  .pos{font-size:10px}
  h1{margin-top:14px}h1 .n1{font-size:6.5vw}h1 .n2{font-size:15.5vw}
  .idr{gap:10px;font-size:11px;margin-top:12px}
  .sts{gap:0;justify-content:space-between;margin-top:18px}.sts b{font-size:30px}.sts small{font-size:8px;letter-spacing:.14em}
  .ctas{display:none}
  .match{left:20px;right:20px;bottom:20px}
  .match div{min-width:0;padding:10px 12px}.match b{font-size:14px}
}

/* Ajustes del modo oscuro */
.hero{background:radial-gradient(60% 70% at 18% 55%,#0e1f38 0%,var(--bg) 70%)}
.panel{background:linear-gradient(165deg,#1E5FA8 0%,#123E7A 45%,#0B2A4A 100%)}
.panel:before{-webkit-text-stroke:2px #ffffff1f}
.vis:before{content:"";position:absolute;z-index:2;left:50%;bottom:8%;width:70%;aspect-ratio:1;transform:translateX(-45%);border-radius:50%;background:radial-gradient(closest-side,#4d93d659,#4d93d600);pointer-events:none}
.player{height:86%;left:59%;filter:drop-shadow(-20px 24px 40px #000000aa)}
.btn.solid{color:#050b14}
.pos b{color:#050b14}
.match{background:#0b1626ee;border:1px solid #4d93d633;box-shadow:0 20px 50px #00000080;backdrop-filter:blur(6px)}
.match b{color:#fff}
.nav .links:nth-child(3) .cta{background:#fff;color:#050b14}
@media (max-width:820px){.vis:before{bottom:auto;top:12%;width:90%}.player{left:50%;top:118px;bottom:auto;height:calc(64% - 40px);width:auto;max-width:none;max-height:none;object-position:center;-webkit-mask-image:none;mask-image:none}
  /* Zona del texto: blur + velo oscuro sobre la parte del recorte que queda detrás, para que se lea */
  .txt{isolation:isolate}
  .txt:before{content:"";position:absolute;z-index:-1;left:0;right:0;top:-56px;bottom:0;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
    background:linear-gradient(180deg,#050b1400 0%,#050b148c 22%,#050b14d9 60%,#050b14 100%);
    -webkit-mask-image:linear-gradient(180deg,#0000 0,#000 64px);mask-image:linear-gradient(180deg,#0000 0,#000 64px)}}
