/* Kit claro: fondo blanco azulado, acento del club (--acc) y segundo acento (--acc2).
   Para otro club se cambian solo --acc, --acc2 y, si hace falta, --deep (superficie oscura). */
:root{
  --bg:#F4F6FB; --bg2:#FFFFFF; --ink:#0D1730; --gray:#5C6A88; --line:#17285a26;
  --acc:#17285A; --acc-l:#17285a14; --acc2:#E23744; --deep:#0A1226; --on-acc:#FFFFFF;
  --ease:cubic-bezier(0.23,1,0.32,1);
  --sv:1vh;
}
@supports (height:1svh){:root{--sv:1svh}}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font-family:Nippo,system-ui,sans-serif;overflow-x:hidden}
img{display:block;max-width:none}
a{color:inherit}
button{font-family:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--acc2);outline-offset:3px}
/* Navbar neutro para las previews de hero (el navbar real se elige aparte) */
.nav{position:absolute;top:0;left:0;right:0;z-index:50;display:flex;align-items:center;justify-content:space-between;padding:22px 60px}
.nav a{color:var(--ink);text-decoration:none;font-size:12px;font-weight:500;letter-spacing:.18em;text-transform:uppercase;opacity:.75}
.nav .links{display:flex;gap:32px;align-items:center}
.nav .logo{font-weight:700;font-size:22px;color:var(--acc);letter-spacing:.05em;opacity:1}
.nav .logo span{color:var(--acc2)}
.nav .cta{background:var(--acc);color:var(--on-acc);padding:9px 16px;border-radius:4px;opacity:1}
.nav .burger{display:none;width:26px;height:14px;border-top:2px solid currentColor;border-bottom:2px solid currentColor}
.nav.inv a,.nav.inv{color:#fff}.nav.inv .logo{color:#fff}.nav.inv .cta{background:#fff;color:var(--acc)}
@media (max-width:820px){.nav{padding:18px 20px}.nav .links,.nav .cta{display:none}.nav .burger{display:block}}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.28em;text-transform:uppercase;color:var(--gray)}
.rv{opacity:0;transform:translateY(28px);animation:rv 1s var(--ease) forwards}
@keyframes rv{to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}}
.tab{font-variant-numeric:tabular-nums}
/* Página de relleno para probar los navbar con scroll */
.demo-hero{position:relative;height:calc(100 * var(--sv));min-height:560px;overflow:hidden;background:var(--deep)}
.demo-hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 30%;filter:brightness(.62) saturate(.85)}
.demo-hero:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#0A122699 0%,transparent 30%,transparent 60%,#0A1226cc 100%)}
.demo-hero h1{position:absolute;left:60px;bottom:64px;z-index:2;color:#fff;font-weight:700;text-transform:uppercase;line-height:.85;font-size:clamp(64px,10vw,170px)}
.demo-hero h1 small{display:block;font-size:.28em;letter-spacing:.14em;font-weight:500;opacity:.8}
.demo-sec{min-height:80vh;padding:110px 60px;border-top:1px solid var(--line)}
.demo-sec:nth-child(even){background:var(--bg2)}
.demo-sec .k{font-size:11px;font-weight:700;letter-spacing:.28em;text-transform:uppercase;color:var(--acc2)}
.demo-sec h2{font-weight:700;font-size:clamp(44px,5.4vw,84px);line-height:.9;color:var(--acc);text-transform:uppercase;margin-top:8px}
.demo-sec .ph{margin-top:36px;display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.demo-sec .ph i{display:block;height:180px;border-radius:6px;background:var(--acc-l)}
@media (max-width:820px){.demo-hero h1{left:20px;bottom:40px}.demo-sec{padding:80px 20px}.demo-sec .ph{grid-template-columns:1fr}.demo-sec .ph i{height:120px}}
</style>
<style>
.hero{position:relative;height:calc(100 * var(--sv));min-height:620px;overflow:hidden;background:var(--bg2)}
/* Franjas verticales de la camiseta: cada una entra de arriba con un retraso */
.stripes{position:absolute;top:0;bottom:0;right:0;width:54%;display:grid;grid-template-columns:repeat(7,1fr);z-index:1}
.stripes i{background:var(--acc);transform-origin:top;animation:st 1.1s var(--ease) both}
.stripes i:nth-child(even){background:transparent}
.stripes i:nth-child(1){animation-delay:.05s}.stripes i:nth-child(3){animation-delay:.12s}.stripes i:nth-child(5){animation-delay:.19s}.stripes i:nth-child(7){animation-delay:.26s}
@keyframes st{from{transform:scaleY(0)}}
.stripes:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,var(--bg2) 0%,transparent 18%)}
.big{position:absolute;right:3%;top:50%;transform:translateY(-52%);z-index:2;font-weight:700;font-size:min(92vh,64vw);line-height:.8;color:transparent;-webkit-text-stroke:3px var(--acc2);opacity:.9;animation:bg 1.4s var(--ease) .3s both}
@keyframes bg{from{opacity:0;transform:translate(6%,-52%)}}
.player{position:absolute;bottom:0;right:14%;height:92%;z-index:3;filter:drop-shadow(0 24px 40px #0a122655);animation:pl 1.4s var(--ease) .35s both}
@keyframes pl{from{opacity:0;transform:translateY(5%)}}
.txt{position:relative;z-index:5;height:100%;display:flex;flex-direction:column;justify-content:center;padding:96px 0 60px 60px;max-width:640px}
.pos{display:inline-flex;align-items:center;gap:10px;align-self:flex-start;padding:8px 14px 8px 8px;border-radius:999px;background:var(--acc-l);font-size:11px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--acc)}
.pos b{width:26px;height:26px;border-radius:50%;background:var(--acc2);color:#fff;display:grid;place-items:center;font-size:12px;letter-spacing:0}
h1{margin-top:22px;font-weight:700;text-transform:uppercase;line-height:.84}
h1 .n1{display:block;font-size:clamp(30px,3.6vw,60px);font-weight:500;color:var(--gray);letter-spacing:.08em}
h1 .n2{display:block;font-size:clamp(84px,11.5vw,206px);color:var(--acc);margin-left:-.05em}
.idr{display:flex;align-items:center;gap:18px;margin-top:20px;font-size:13px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--ink)}
.idr span{display:flex;align-items:center;gap:8px}
.idr img{width:24px;height:24px;object-fit:contain}
.idr i{width:1px;height:18px;background:var(--line)}
.sts{display:flex;gap:34px;margin-top:34px}
.sts b{display:block;font-size:44px;font-weight:700;line-height:1;color:var(--acc)}
.sts div.hl b{color:var(--acc2)}
.sts small{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--gray)}
.ctas{display:flex;gap:12px;margin-top:34px}
.btn{font-weight:700;font-size:12px;letter-spacing:.2em;text-transform:uppercase;padding:15px 24px;border-radius:4px;border:1.5px solid var(--acc);color:var(--acc);text-decoration:none}
.btn.solid{background:var(--acc2);border-color:var(--acc2);color:#fff}
@media (hover:hover) and (pointer:fine){.btn{transition:transform .25s var(--ease)}.btn:hover{transform:translateY(-2px)}}
.match{position:absolute;right:40px;bottom:40px;z-index:6;display:grid;grid-template-columns:1fr 1fr;background:#fff;border-radius:6px;box-shadow:0 20px 50px #0a122640;overflow:hidden;animation:bx 1s var(--ease) .9s both}
@keyframes bx{from{opacity:0;transform:translateY(24px)}}
.match div{padding:14px 18px;min-width:170px}
.match div+div{border-left:1px solid var(--line)}
.match small{display:block;font-size:9px;font-weight:700;letter-spacing:.24em;text-transform:uppercase;color:var(--gray);margin-bottom:6px}
.match div+div small{color:var(--acc2)}
.match b{font-size:18px;font-weight:700;color:var(--acc);letter-spacing:.06em;font-variant-numeric:tabular-nums}
.match em{display:block;font-style:normal;font-size:10px;color:var(--gray);letter-spacing:.1em;margin-top:4px;text-transform:uppercase}
.nav .links:nth-child(3) a{color:#fff;opacity:.9}.nav .links:nth-child(3) .cta{background:#fff;color:var(--acc)}
@media (max-width:820px){
  .nav .burger,.nav .logo{color:#fff}
  .hero{min-height:760px}
  .stripes{left:0;width:100%;height:56%;bottom:auto}
  .stripes:after{background:linear-gradient(0deg,var(--bg2) 0%,transparent 30%)}
  .big{top:8%;right:auto;left:50%;transform:translateX(-50%);font-size:64vw;animation:none}
  .player{right:50%;transform:translateX(50%);height:52%;top:6%;bottom:auto;animation:none}
  .txt{justify-content:flex-end;padding:0 20px 112px;max-width:none}
  .pos{font-size:10px}
  h1{margin-top:14px}h1 .n1{font-size:6.5vw}h1 .n2{font-size:22vw}
  .idr{gap:10px;font-size:11px;margin-top:12px}
  .sts{gap:0;justify-content:space-between;margin-top:18px}.sts b{font-size:30px}.sts small{font-size:8px;letter-spacing:.14em}
  .ctas{display:none}
  .match{left:20px;right:20px;bottom:20px}
  .match div{min-width:0;padding:10px 12px}.match b{font-size:14px}
}
</style></head><body>
