:root{
  --bg:#0C0E0A; --bg2:#141810; --lime:#B4F32A; --lime-d:#7FA800; --mag:#FF2E9A;
  --bone:#fff; --gray:#98A388; --line:#b4f32a40; --ease:cubic-bezier(0.23,1,0.32,1);
  --sv:1vh;
}
@supports (height:1svh){:root{--sv:1svh}}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--bone);font-family:Nippo,system-ui,sans-serif;overflow-x:hidden}
img{display:block;max-width:none}
button{font-family:inherit}
.nav{position:absolute;top:0;left:0;right:0;z-index:50;display:flex;align-items:center;justify-content:space-between;padding:22px 60px}
.nav a{color:var(--gray);text-decoration:none;font-size:12px;font-weight:700;letter-spacing:.18em;text-transform:uppercase}
.nav .links{display:flex;gap:32px;align-items:center}
.nav .logo{font-weight:700;font-size:22px;color:var(--lime);letter-spacing:.05em}
.nav .logo span{color:var(--mag)}
.nav .cta{border:1.5px solid var(--lime);color:var(--lime);padding:8px 16px;border-radius:999px}
.nav .burger{display:none;width:26px;height:16px;border-top:2px solid #fff;border-bottom:2px solid #fff;position:relative}
.nav .burger:after{content:"";position:absolute;left:0;right:0;top:5px;border-top:2px solid #fff}
@media (max-width:820px){.nav{padding:18px 20px}.nav .links,.nav .cta{display:none}.nav .burger{display:block}}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.28em;text-transform:uppercase;color:var(--gray)}
.rv{opacity:0;transform:translateY(28px);animation:rv 1s var(--ease) forwards}
@keyframes rv{to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}}
.sec{position:relative;padding:96px 60px;background:var(--bg);overflow:hidden}
.sh{margin-bottom:44px}
.sh .k{font-size:11px;font-weight:700;letter-spacing:.28em;text-transform:uppercase;color:var(--mag)}
.sh h2{font-weight:700;font-size:clamp(44px,5.4vw,84px);line-height:.9;color:var(--lime);text-transform:uppercase;margin-top:8px}
.tab{font-variant-numeric:tabular-nums}
@media (max-width:820px){.sec{padding:64px 20px}.sh{margin-bottom:28px}}
</style>
<style>
.hero{position:relative;height:calc(100 * var(--sv));min-height:560px;overflow:hidden;
  background:radial-gradient(70% 60% at 55% 45%,#1d2614 0%,var(--bg) 70%)}
.num{position:absolute;left:52%;top:50%;transform:translate(-50%,-50%);font-weight:700;line-height:.8;
  font-size:min(118vh,92vw);color:transparent;-webkit-text-stroke:2px var(--lime);opacity:.9;z-index:1;
  animation:num 1.6s var(--ease) both}
@keyframes num{from{opacity:0;transform:translate(-50%,-46%) scale(1.12)}}
.num.fill{color:var(--lime);-webkit-text-stroke:0;opacity:.07;z-index:0;animation-delay:.1s}
.player{position:absolute;left:52%;bottom:0;transform:translateX(-50%);height:92%;z-index:3;
  filter:drop-shadow(0 30px 60px #000a);animation:pl 1.4s var(--ease) .35s both}
@keyframes pl{from{opacity:0;transform:translate(-50%,8%)}}
.shade{position:absolute;inset:auto 0 0 0;height:38%;background:linear-gradient(transparent,var(--bg) 85%);z-index:4}
.name{position:absolute;left:60px;bottom:9%;z-index:6}
.name h1{font-weight:700;line-height:.86;text-transform:uppercase}
.name .n1{display:block;font-size:clamp(28px,3.2vw,52px);color:var(--bone);letter-spacing:.06em}
.name .n2{display:block;font-size:clamp(64px,8.6vw,150px);color:var(--lime);letter-spacing:.01em}
.name .pos{margin-top:14px;display:flex;align-items:center;gap:12px}
.name .pos b{color:var(--mag);text-transform:uppercase;font-size:13px;letter-spacing:.25em}
.name .pos i{width:40px;height:2px;background:var(--mag)}
.ficha{position:absolute;right:60px;top:50%;transform:translateY(-50%);z-index:6;display:grid;gap:22px;width:230px}
.ficha .row{border-top:1px solid var(--line);padding-top:10px}
.ficha .row small{display:block;font-size:10px;letter-spacing:.25em;color:var(--gray);text-transform:uppercase;margin-bottom:6px}
.ficha .row strong{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:500}
.ficha .row img{width:26px;height:26px;object-fit:contain}
.ficha .big{font-size:40px;color:var(--lime);font-weight:700}
.scroll{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);z-index:7;font-size:10px;letter-spacing:.3em;color:var(--gray)}
.scroll:after{content:"";display:block;width:1px;height:28px;background:var(--lime);margin:8px auto 0;animation:sc 1.8s var(--ease) infinite}
@keyframes sc{0%{transform:scaleY(0);transform-origin:top}50%{transform:scaleY(1);transform-origin:top}51%{transform-origin:bottom}100%{transform:scaleY(0);transform-origin:bottom}}
@media (max-width:820px){
  .num{left:50%;top:40%;font-size:min(88vh,150vw)}
  .player{left:50%;height:74%;bottom:20%}
  .shade{height:50%}
  .name{left:20px;right:20px;bottom:calc(14% + 8px)}
  .name .n2{font-size:21vw}
  .ficha{left:20px;right:20px;top:auto;bottom:24px;transform:none;width:auto;grid-template-columns:repeat(3,1fr);gap:10px}
  .ficha .row strong{font-size:13px;gap:6px}.ficha .row img{width:18px;height:18px}
  .ficha .big,.ficha .row.dors{display:none}
  .scroll{display:none}
}
</style></head><body>
