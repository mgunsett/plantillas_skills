:root{
  --bg:#0C0E0A; --bg2:#141810; --lime:#B4F32A; --lime-d:#7FA800; --mag:#FF2E9A;
  --bone:#fff; --gray:#98A388; --line:#b4f32a40; --ease:cubic-bezier(0.23,1,0.32,1);
  --sv:1vh;
}
@supports (height:1svh){:root{--sv:1svh}}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--bone);font-family:Nippo,system-ui,sans-serif;overflow-x:hidden}
img{display:block;max-width:none}
button{font-family:inherit}
.nav{position:absolute;top:0;left:0;right:0;z-index:50;display:flex;align-items:center;justify-content:space-between;padding:22px 60px}
.nav a{color:var(--gray);text-decoration:none;font-size:12px;font-weight:700;letter-spacing:.18em;text-transform:uppercase}
.nav .links{display:flex;gap:32px;align-items:center}
.nav .logo{font-weight:700;font-size:22px;color:var(--lime);letter-spacing:.05em}
.nav .logo span{color:var(--mag)}
.nav .cta{border:1.5px solid var(--lime);color:var(--lime);padding:8px 16px;border-radius:999px}
.nav .burger{display:none;width:26px;height:16px;border-top:2px solid #fff;border-bottom:2px solid #fff;position:relative}
.nav .burger:after{content:"";position:absolute;left:0;right:0;top:5px;border-top:2px solid #fff}
@media (max-width:820px){.nav{padding:18px 20px}.nav .links,.nav .cta{display:none}.nav .burger{display:block}}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.28em;text-transform:uppercase;color:var(--gray)}
.rv{opacity:0;transform:translateY(28px);animation:rv 1s var(--ease) forwards}
@keyframes rv{to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}}
.sec{position:relative;padding:96px 60px;background:var(--bg);overflow:hidden}
.sh{margin-bottom:44px}
.sh .k{font-size:11px;font-weight:700;letter-spacing:.28em;text-transform:uppercase;color:var(--mag)}
.sh h2{font-weight:700;font-size:clamp(44px,5.4vw,84px);line-height:.9;color:var(--lime);text-transform:uppercase;margin-top:8px}
.tab{font-variant-numeric:tabular-nums}
@media (max-width:820px){.sec{padding:64px 20px}.sh{margin-bottom:28px}}
</style>
<style>
.hero{position:relative;height:calc(100 * var(--sv));min-height:560px;overflow:hidden;background:#000}
.bgb{display:none;position:absolute;inset:-40px;width:calc(100% + 80px);height:calc(100% + 80px);object-fit:cover;opacity:.35;filter:blur(2px) saturate(.6)}
.photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 55%;filter:saturate(.8) contrast(1.05) brightness(.8);animation:ph 2.4s var(--ease) both}
@keyframes ph{from{transform:scale(1.08);opacity:0}}
.veil{position:absolute;inset:0;background:linear-gradient(90deg,#0C0E0Aee 0%,#0C0E0A99 30%,transparent 50%),linear-gradient(0deg,#0C0E0A 0%,transparent 40%),linear-gradient(180deg,#0C0E0Ad9 0%,transparent 20%)}
.sb{position:absolute;top:96px;left:60px;z-index:5;display:grid;gap:2px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
.sb .row{display:grid;grid-template-columns:100px 52px 74px 52px auto;align-items:stretch;background:#0C0E0Acc;backdrop-filter:blur(6px)}
.sb .lb{display:flex;align-items:center;gap:8px;padding:0 12px;font-size:11px}
.sb .last .lb{background:var(--lime);color:#0C0E0A}
.sb .next .lb{background:var(--mag);color:#fff}
.sb .next .lb:before{content:"";width:6px;height:6px;border-radius:50%;background:#fff;animation:bl 1.4s infinite}
.sb .tm{display:grid;place-items:center;font-size:14px;color:#fff;padding:10px 0}
.sb .mid{display:flex;align-items:center;justify-content:center;gap:6px;font-size:20px;color:#fff;font-variant-numeric:tabular-nums}
.sb .mid i{font-style:normal;color:var(--gray);font-size:14px}
.sb .mid em{font-style:normal;font-size:12px;color:var(--lime);letter-spacing:.14em}
.sb .last .mid b.w{color:var(--lime)}
.sb .meta{display:flex;align-items:center;padding:0 14px;font-size:10px;color:var(--gray);letter-spacing:.16em;border-left:1px solid #ffffff14;white-space:nowrap}
@keyframes bl{50%{opacity:.2}}
.lower{position:absolute;left:60px;bottom:70px;z-index:5;max-width:min(760px,60vw)}
.l1{display:flex;align-items:stretch;animation:lw .9s var(--ease) .5s both}
@keyframes lw{from{opacity:0;transform:translateX(-40px)}}
.l1 .dor{background:var(--lime);color:#0C0E0A;font-weight:700;font-size:clamp(60px,6vw,96px);line-height:1;padding:10px 18px 4px;display:flex;align-items:center}
.l1 h1{background:#0C0E0Aee;padding:14px 26px 8px;font-weight:700;text-transform:uppercase;line-height:.88;display:flex;flex-direction:column;justify-content:center}
.l1 h1 .n1{font-size:clamp(20px,2vw,32px);color:var(--gray);font-weight:500;letter-spacing:.12em}
.l1 h1 .n2{font-size:clamp(54px,6.4vw,112px);color:#fff}
.l2{display:inline-flex;align-items:center;gap:14px;background:var(--bone);color:#0C0E0A;padding:10px 20px;font-weight:700;font-size:13px;letter-spacing:.16em;text-transform:uppercase;animation:lw .9s var(--ease) .7s both}
.l2 img{width:22px;height:22px;object-fit:contain}
.l2 i{width:1px;height:16px;background:#0C0E0A55}
.box{position:absolute;right:60px;bottom:70px;z-index:5;width:280px;background:#0C0E0Acc;backdrop-filter:blur(8px);border-top:3px solid var(--lime);animation:bx 1s var(--ease) .9s both}
@keyframes bx{from{opacity:0;transform:translateY(30px)}}
.box header{display:flex;justify-content:space-between;padding:12px 16px;font-size:10px;font-weight:700;letter-spacing:.24em;color:var(--gray)}
.box header b{color:var(--lime)}
